<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shader Studio</title>
<style>
[hidden]{display:none!important}
:root {
  --bg: #15171c; --panel: #1b1e25; --panel2: #20242c; --line: #2c313b; --text: #d6dae3; --dim: #8a92a3; --accent: #5aa2ff; --good: #5fcf80; --bad: #ef6a6a; --warn: #e6b450;
  --right: 470px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: var(--text); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; cursor: pointer; }
button:hover { border-color: #46506a; background: #262b35; }
button.on { background: #27406b; border-color: var(--accent); }
button.pri { background: #2b5fb0; border-color: #4a82d8; }
button:disabled { opacity: .4; cursor: default; }
select { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
input[type=text], input:not([type]), input[type=search], input[type=number] { background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #353b48; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; } ::-webkit-scrollbar-thumb:hover { background: #4a5266; background-clip: content-box; border: 2px solid transparent; } ::-webkit-scrollbar-corner { background: transparent; }
body.scrubbing, body.scrubbing * { cursor: ew-resize !important; user-select: none !important; }

#app { display: flex; flex-direction: column; height: 100%; }
#top { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top .logo { font-weight: 700; letter-spacing: .02em; } #top .logo span { color: var(--accent); }
#top .sep { width: 1px; height: 20px; background: var(--line); }
#bName { font-weight: 600; color: #fff; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border-color: transparent; }
#bName:hover { border-color: var(--line); }
#hint { color: var(--dim); font-size: 12px; margin-left: 6px; }
#status { margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #1f2a22; color: var(--good); }
#status.err { background: #3a2022; color: var(--bad); }
#main { flex: 1; display: flex; min-height: 0; }
#center { flex: 1; min-width: 280px; display: flex; flex-direction: column; min-height: 0; background: #12141a; }
#editor { flex: 1; min-height: 0; position: relative; }
#sbar { display: flex; gap: 14px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
#errs { max-height: 130px; overflow: auto; border-top: 1px solid var(--line); font: 12px/1.45 var(--mono); }
#errs div { padding: 3px 10px; color: #ffb0b0; cursor: pointer; border-bottom: 1px solid #2a2326; } #errs div:hover { background: #2d2225; }
#errs div.ok { color: var(--good); cursor: default; border: 0; background: transparent; }
.split { width: 5px; cursor: col-resize; background: var(--line); flex: none; } .split:hover, .split.drag { background: var(--accent); }

/* ===== right side panel ===== */
#right { width: var(--right); min-width: 340px; display: flex; flex-direction: column; background: var(--panel); overflow-y: auto; overflow-x: hidden; }
#pvwrap { position: relative; height: 280px; flex: none; background: #000; }
canvas.view { width: 100%; height: 100%; display: block; cursor: grab; } canvas.view:active { cursor: grabbing; }
#pvmsg, #lpmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--bad); font-size: 12px; pointer-events: none; }
#lpmsg { color: #c8cfdd; background: rgba(12,14,18,.82); }
#shapes { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; flex: none; }
#shapes button { padding: 2px 7px; font-size: 12px; } #shapes .grow { flex: 1; }
#lpHead { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); flex: none; flex-wrap: wrap; }
#lpHead b { color: #e6e9f0; font-weight: 600; } #lpHead .lpl { flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lpHead select, #lpHead input { font-size: 11px; padding: 1px 4px; } #lpHead input[type=number] { width: 52px; }
#lpWrap { position: relative; height: 190px; flex: none; background: #000; border-bottom: 1px solid var(--line); }
#lpWrap.off { display: none; }
#tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
#tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 7px 4px; color: var(--dim); border-bottom: 2px solid transparent; }
#tabs button.on { color: #fff; border-bottom-color: var(--accent); }
#tabbody { flex: 1; min-height: 440px; overflow: auto; padding: 8px; position: relative; }
.pane { display: none; } .pane.on { display: block; }
.btnrow { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; } .btnrow button { font-size: 12px; padding: 3px 8px; }
h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.hint { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 6px 0; } .hint code, .hint kbd, #tab-help code, #tab-help kbd { font: 11.5px var(--mono); background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #cfd6e4; }
#libFilter { width: 100%; margin-bottom: 6px; }
#libList { border: 1px solid var(--line); border-radius: 5px; max-height: 430px; overflow: auto; }
.lgh { position: sticky; top: 0; background: #232833; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; cursor: pointer; display: flex; justify-content: space-between; z-index: 1; border-bottom: 1px solid var(--line); }
.lgh:hover { color: #fff; }
.libitem { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; } .libitem:hover { background: #242a35; } .libitem.on { background: #27406b; }
.libitem small { color: var(--dim); } .libitem .mod { color: var(--warn); }
.field { display: grid; grid-template-columns: 112px 1fr auto; gap: 6px; align-items: center; margin: 5px 0; } .field label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field input[type=range] { width: 100%; } .field .v { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.field input[type=number] { width: 62px; } .field .vecs { display: flex; gap: 3px; } .field .vecs input { width: 100%; } .field input[type=color] { width: 30px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }

/* ===== docs tab ===== */
#docTools { position: sticky; top: -8px; z-index: 3; background: var(--panel); padding: 8px 0 6px; margin: -8px 0 4px; border-bottom: 1px solid var(--line); }
#docQ { width: 100%; }
#docChips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } #docChips button { font-size: 11px; padding: 1px 7px; border-radius: 99px; }
.doc { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: #1e222a; padding: 8px 10px; }
.doc.flash { animation: flash 1.4s; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.doc .dh { display: flex; align-items: baseline; gap: 8px; } .doc .dn { font: 600 13.5px var(--mono); color: #fff; } .doc .dc { margin-left: auto; font-size: 10.5px; color: var(--dim); }
.doc .ds { font: 12px var(--mono); color: #9fb4d0; margin: 2px 0; white-space: pre-wrap; }
.doc .dd { color: #b9c0cf; font-size: 12.5px; line-height: 1.5; margin: 4px 0 6px; }
.doc .db { display: flex; gap: 8px; align-items: stretch; }
.doc .th { width: 124px; flex: none; }
.doc .th canvas { width: 124px; height: 124px; border-radius: 6px; background: #000; display: block; border: 1px solid var(--line); }
.doc .dcode { flex: 1; min-width: 0; margin: 0; background: #14171d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 11.5px/1.5 var(--mono); overflow: auto; max-height: 190px; white-space: pre; }
.doc .dbt { display: flex; gap: 5px; margin-top: 6px; } .doc .dbt button { font-size: 11px; padding: 2px 8px; }
body.wide-docs { --right: 760px; }

/* ===== syntax colours ===== */
.c { color: #66758c; font-style: italic; } .pp { color: #c586c0; } .k { color: #c586c0; } .q { color: #5aa2ff; } .t { color: #4ec9b0; }
.n { color: #f0b36b; } .bf { color: #e2d994; } .sf { color: #7cc4ff; } .bv { color: #ff9d7a; } .uf { color: #a8d88a; } .un { color: #ff8fb8; } .cn { color: #d19a66; }
.sw { color: #9ecbff; } .fld { color: #c8d0e0; } .call { color: #cfc79a; } .p { color: #98a3b6; } .o { color: #bfc7d6; }

/* ===== editor engine ===== */
.ed { display: flex; height: 100%; font: 12.5px/20px var(--mono); background: #12141a; }
.ed-gut { width: 48px; flex: none; overflow: hidden; background: #14171c; border-right: 1px solid #20242c; padding-top: 8px; color: #566074; text-align: right; user-select: none; }
.ed-gutin { will-change: transform; } .ed-gutin div { padding-right: 8px; height: 20px; } .ed-gutin div.cur { color: #d6dae3; } .ed-gutin div.pv { color: #e6b450; } .ed-gutin div.pv::before { content: "◂ "; }
.ed-gutin div.err { color: #fff; background: #7a2e2e; }
.ed-view { position: relative; flex: 1; overflow: hidden; min-width: 0; }
.ed-hl, .ed-ta { position: absolute; left: 0; top: 0; margin: 0; padding: 8px 14px 160px 12px; border: 0; font: inherit; letter-spacing: 0; white-space: pre; tab-size: 2; font-variant-ligatures: none; word-spacing: 0; text-rendering: optimizeSpeed; }
.ed-hl { pointer-events: none; color: #d6dae3; will-change: transform; min-width: 100%; }
.ed-ta { width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: #fff; overflow: auto; outline: none; z-index: 2; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(90, 162, 255, .35); -webkit-text-fill-color: transparent; }
.ed-ta:focus { outline: none; }
.ed-under { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; pointer-events: none; }
.ed-under .bar { position: absolute; left: 0; width: 20000px; } .ed-under .bar.cur { background: rgba(255,255,255,.045); } .ed-under .bar.pv { background: rgba(230,180,80,.09); box-shadow: inset 2px 0 0 rgba(230,180,80,.7); }
.ed-under .bar.err { background: rgba(239,106,106,.14); box-shadow: inset 0 -2px 0 -0px rgba(239,106,106,.55); }
.ed-under .box { position: absolute; } .ed-under .box.brk { background: rgba(90,162,255,.28); outline: 1px solid rgba(90,162,255,.7); outline-offset: -1px; border-radius: 2px; }
.ed-under .box.num { background: rgba(240,179,107,.16); border-bottom: 1px dotted #f0b36b; border-radius: 2px; } .ed-under .box.find { background: rgba(230,180,80,.3); outline: 1px solid rgba(230,180,80,.7); outline-offset: -1px; }
.ed-ac { position: absolute; z-index: 20; width: 380px; background: #1e222a; border: 1px solid #46506a; border-radius: 7px; box-shadow: 0 10px 30px rgba(0,0,0,.55); font: 12.5px/1.2 var(--mono); overflow: hidden; }
.ac-list { max-height: 178px; overflow: auto; } .ac-it { display: flex; align-items: center; gap: 7px; padding: 3px 8px; height: 22px; cursor: pointer; } .ac-it.on { background: #27406b; } .ac-it .ac-l { flex: 1; color: #e6e9f0; white-space: nowrap; } .ac-it .ac-l b { color: #7cc4ff; font-weight: 700; } .ac-it .ac-d { color: #8a92a3; font-size: 11px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.ac-k { width: 16px; height: 16px; border-radius: 4px; text-align: center; font: 700 10.5px/16px var(--mono); flex: none; background: #3a404d; color: #fff; }
.k-fn { background: #2c5a94; } .k-sf { background: #2c5a94; } .k-type { background: #1f6f64; } .k-kw { background: #6a3d78; } .k-var { background: #7a4f1e; } .k-local { background: #3d7a4d; } .k-uni { background: #8a3f6a; } .k-cn { background: #7a6a1e; } .k-snip { background: #4a5870; } .k-sw { background: #4a5870; } .k-macro { background: #6a3d78; }
.ac-doc { border-top: 1px solid #2c313b; padding: 6px 9px; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: #aab3c4; max-height: 90px; overflow: auto; } .ac-doc code { display: block; font: 11.5px var(--mono); color: #9fb4d0; margin-bottom: 2px; white-space: pre-wrap; }
.ed-tip, .ed-sig { position: absolute; z-index: 25; max-width: 340px; background: #11151c; border: 1px solid #46506a; color: #dbe2ef; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; padding: 6px 9px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5); pointer-events: none; }
.ed-sig { font: 12px/1.4 var(--mono); max-width: 520px; white-space: nowrap; } .ed-sig u { color: #f0b36b; text-decoration: none; font-weight: 700; } .ed-sig .tip-dim { white-space: normal; font-family: ui-sans-serif, system-ui, sans-serif; }
.tip-err { color: #ffb0b0; font-family: var(--mono); font-size: 11.5px; } .tip-dim { color: #8a92a3; margin-top: 2px; } .tip-sig { font: 12px var(--mono); color: #9fb4d0; }
.ed-scrub { position: absolute; z-index: 30; background: #f0b36b; color: #1a1304; font: 700 12px var(--mono); padding: 1px 7px; border-radius: 5px; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
.ed-find { position: absolute; right: 16px; top: 6px; z-index: 30; display: flex; gap: 4px; align-items: center; background: #1e222a; border: 1px solid #46506a; border-radius: 7px; padding: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.ed-find input { width: 130px; } .ed-find button { padding: 2px 7px; } .ed-find .ef-n { color: var(--dim); font-size: 11px; min-width: 52px; }
[hidden] { display: none !important; }

/* ===== modal + toast ===== */
#modal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
#mbox { width: 380px; max-width: 92vw; background: var(--panel); border: 1px solid #46506a; border-radius: 10px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
#mbox .mt { font-weight: 600; margin-bottom: 8px; } #mbox input { width: 100%; padding: 6px 8px; } #mbox .mx { color: var(--dim); margin-top: 6px; line-height: 1.5; } #mbox .mrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #232a38; border: 1px solid #3a4560; padding: 6px 14px; border-radius: 6px; z-index: 95; max-width: 70vw; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
#drop { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center; background: rgba(10,14,22,.8); font-size: 22px; border: 3px dashed var(--accent); }
@media (max-width: 900px) { #main { flex-direction: column; } #right { width: auto; height: 62%; min-width: 0; } .split { display: none; } #hint { display: none; } }

/* ===== learn tab ===== */
.lcard { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin: 7px 0; cursor: pointer; background: var(--panel2); }
.lcard:hover { border-color: var(--accent); }
.lcard .lt { font-weight: 600; color: #fff; } .lcard .lm { color: var(--accent); font-size: 11px; margin: 1px 0 4px; } .lcard .ld { color: var(--dim); font-size: 12px; line-height: 1.45; }
.lnav { display: flex; gap: 6px; justify-content: space-between; margin: 4px 0 8px; }
.ltitle { margin: 6px 0 2px; font-size: 16px; color: #fff; }
.ltx p { margin: 0 0 8px; } .ltx code, .ltable code { font: 11.5px var(--mono); background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #cfd6e4; }
a.dl { color: #7db4ff; cursor: pointer; text-decoration: underline dotted; } a.dl:hover { color: #fff; } a.dl.nolink { color: var(--dim); cursor: default; text-decoration: none; }
.dcode .ln { white-space: pre; min-height: 1.4em; padding: 0 3px; margin: 0 -3px; } .dcode .ln.added { background: rgba(95,207,128,.16); box-shadow: inset 2px 0 0 var(--good); }
.lleg { color: var(--dim); font-size: 11px; margin: 4px 0 0; }
.ltable { margin: 6px 0; } .lrow { border-top: 1px solid var(--line); padding: 7px 0; } .lg { font-weight: 600; color: #fff; margin-bottom: 3px; }
.lch { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 3px; font: 12px var(--mono); } .ltip { color: var(--dim); font-size: 12px; line-height: 1.45; }
.doc.flash { animation: dflash 1.2s; } @keyframes dflash { 0% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
#tabs button#bFocus { flex: none; width: 34px; }
body.hide-pv #pvwrap, body.hide-pv #shapes, body.hide-pv #lpHead, body.hide-pv #lpWrap { display: none; }

.hsplit { height: 7px; flex: none; cursor: row-resize; background: var(--line); position: relative; } .hsplit::after { content: ""; position: absolute; left: 50%; top: 2px; width: 34px; height: 3px; margin-left: -17px; border-radius: 2px; background: #4a5266; }
.hsplit:hover, .hsplit.drag { background: var(--accent); } .hsplit:hover::after, .hsplit.drag::after { background: #fff; }
.split { width: 7px; position: relative; } .split::after { content: ""; position: absolute; top: 50%; left: 2px; width: 3px; height: 34px; margin-top: -17px; border-radius: 2px; background: #4a5266; } .split:hover::after, .split.drag::after { background: #fff; }
#pvwrap, #lpWrap { min-height: 80px; } #tabbody { min-height: 160px; }
body.hide-pv .hsplit { display: none; }

.lnew { border: 1px solid #2f4a78; background: #17233a; border-radius: 7px; padding: 6px 9px; margin: 6px 0 8px; }
.lnl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #7db4ff; margin-bottom: 3px; }
.lni { padding: 3px 0; } .lni code { font: 12px var(--mono); color: #e9d9a6; background: transparent; border: 0; padding: 0; white-space: pre-wrap; } .lnd { color: #c8d0e0; font-size: 12px; line-height: 1.45; margin-top: 1px; } .lni a.dl { font-size: 11px; }
.ltry { margin: 6px 0 0; padding: 5px 9px; border-left: 3px solid var(--good); background: rgba(95,207,128,.08); font-size: 12px; line-height: 1.45; color: #cfe8d6; } .ltry b { color: var(--good); }

.tread { color: var(--dim); font: 11px var(--mono); align-self: center; padding-left: 6px; }
.lreset { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px dashed #3a4a6a; border-radius: 7px; padding: 6px 9px; margin: 6px 0 10px; color: var(--dim); font-size: 12px; line-height: 1.4; } .lreset button { flex: none; }
button.tread { font: 11px var(--mono); color: #cfd6e4; padding: 2px 7px; background: #12141a; } button.tread:hover { border-color: var(--accent); }
.dnote { margin: 2px 2px 6px; font-size: 11.5px; } #docChips.dim button[data-c] { opacity: .45; }

.stag { display: inline-block; font: 600 9.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: #8fd0ff; background: #14304f; border: 1px solid #2f5f94; border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: middle; }
.dstudio, .lstudio { font-size: 11.5px; line-height: 1.45; color: #9cc4e6; border-left: 3px solid #2f5f94; padding: 3px 8px; margin: 5px 0; background: rgba(47,95,148,.10); }
.lstudio { margin: 3px 0 2px; font-size: 11px; }
.dsrc { margin: 5px 0 2px; } .dsrc summary { cursor: pointer; color: #8fd0ff; font-size: 11.5px; } .dsrc pre { margin-top: 5px; max-height: 260px; overflow: auto; }
.dlegend { margin: 0 2px 6px; font-size: 11.5px; }
button.origin.on { border-color: #2f5f94; color: #8fd0ff; }
.ac-it .ac-s { font: 600 9px/1 var(--mono); text-transform: uppercase; color: #8fd0ff; background: #14304f; border: 1px solid #2f5f94; border-radius: 3px; padding: 2px 4px; flex: none; }
.ac-studio { color: #8fd0ff; font-size: 11px; margin-bottom: 2px; }
.tip-studio { color: #8fd0ff; font-size: 11.5px; margin: 2px 0; }

#sbar { align-items: center; } #sbar .sbsp { flex: 1; } #sbar .sbx { color: var(--dim); }
#sbar button { font-size: 11px; padding: 1px 8px; margin: -1px 0; }

.ptop { display: flex; align-items: baseline; gap: 10px; margin: 4px 0; } .pnum { color: var(--dim); font: 12px var(--mono); }

<script>
/* ===== glsl.js : lexer, analyzer, syntax highlighter, "end the shader at this line" builder ===== */
const GL = (() => {
'use strict';

const VALUE_TYPES = new Set('bool int uint float vec2 vec3 vec4 bvec2 bvec3 bvec4 ivec2 ivec3 ivec4 uvec2 uvec3 uvec4'.split(' '));
let FN_BUILTIN = new Set(), FN_STUDIO = new Set(), VARS = new Set();

const NUM = /(?:0[xX][0-9a-fA-F]+[uU]?|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?[fFuU]?)/y;
const IDR = /[A-Za-z_]\w*/y;
const OPS2 = new Set(['==', '!=', '<=', '>=', '&&', '||', '^^', '+=', '-=', '*=', '/=', '%=', '++', '--', '<<', '>>', '&=', '|=', '^=']);

const isOp = (t, v) => t && t.t === 'op' && t.v === v;
function matchClose(code, i, open, close) { let d = 0; for (let k = i; k < code.length; k++) { if (isOp(code[k], open)) d++; else if (isOp(code[k], close)) { d--; if (d === 0) return k; } } return code.length - 1; }

function parseParams(code, a, b) { // tokens a..b inclusive between the parens

let memoSrc = null, memo = null;

/** Split a function body into statements: decl / assign / return / jump / header / close / expr. depth 1 = directly in the function. */

const lineOf = (src, off) => { let n = 1; for (let i = 0; i < off && i < src.length; i++) if (src.charCodeAt(i) === 10) n++; return n; };

/** Variables visible at offset `off`: parameters of the function plus declarations before it (block scoped). */

// ------------------------------------------------------------------ highlighter
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  if (QUAL.has(text)) return 'q';
  if (FN_BUILTIN.has(text)) return 'bf';
  if (FN_STUDIO.has(text)) return 'sf';
  if (VARS.has(text) || text.startsWith('gl_')) return 'bv';

// ------------------------------------------------------------------ line preview
/**
 * Build the shader "as if it ended on this line". Returns { ok, code, line, target, type, fn, reason }.
 * The value of the last assignment/declaration at or before the caret line is shown through _viz().

    fbm3: 'fbm3() adds up 5 layers of 3D noise (each layer is 8 hashes). Use noise3() alone, or fewer calls, if the fine detail is not visible.',

    }
    if (an.total >= 800 && !/\bvec4\s+bake\s*\(/.test(code) && (counts.noise || 0) + (counts.noise3 || 0) + (counts.noiseT || 0) + (counts.noise3T || 0) + (counts.voronoi || 0) >= 12)
      add('med', 'Precompute with bake()', 'If part of your pattern does not change over time, or only slides around, draw it ONCE with a bake() function and read it back with texture(uBake, uv) each frame. That turns dozens of noise calls into one or two reads. Use fbmTile() inside bake() so the picture repeats without a seam. See "bake" in the Docs tab.', 0, an.total * 0.5);

  const hcache = {};

  // ---------------------------------------------------------------- real timing
  let bv = null;

    }
    v.free(b.prog);

  async function bench(code, o, W, H) {

})();

/* ===== docs.js : reference of everything you can use, each with a runnable example ===== */
const DOCS = [];
const CATS = ['Language', 'Built-in variables', 'Angles & trig', 'Power & exponent', 'Common math', 'Geometry', 'Matrices', 'Compare vectors', 'Derivatives', 'Textures', 'Noise & random', 'Shapes (2D distance)', 'Colour', 'Lighting', 'Helpers', 'Fast & precomputed'];
const add = (cat, kind, n, sig, d, ex, o) => DOCS.push(Object.assign({ cat, kind, n, sig, d, ex }, o));
/** plot a 1D function: x runs 0..1 across the picture, the curve is y */
const fx = (expr, pre) => `// The curve is y, drawn for x from 0 (left) to 1 (right).
void main() {
  float x = vUv.x;
${pre ? '  ' + pre + '\n' : ''}  float y = ${expr};
  vec3 col = graphBG(vUv);
  col = mix(col, vec3(1.0, 0.75, 0.25), plot(vUv.y, y));
  gl_FragColor = vec4(col, 1.0);
}`;
/** draw a 2D distance function (a shape): orange inside, rings show the distance */
const sdf = (call, pre) => `// d is the distance to the shape: negative inside, 0 on the edge, positive outside.
void main() {
  vec2 p = vUv * 2.0 - 1.0;          // -1..1, centre in the middle
${pre ? '  ' + pre + '\n' : ''}  float d = ${call};
  vec3 col = vec3(0.5 + 0.5 * cos(d * 50.0)) * 0.22;   // rings every so often show the distance
  col = mix(col, vec3(0.95, 0.7, 0.25), sdfFill(d));
  gl_FragColor = vec4(col, 1.0);
}`;

add('Language', 'type', 'float', 'float', 'A decimal number. Always write the dot: 1.0, not 1 (GLSL never converts int to float by itself).', `void main() {

add('Language', 'type', 'mat3', 'mat3(...)', 'A 3×3 matrix. Multiply with a vec3. Good for colour matrices and for rotating 3D directions.', `void main() {
  mat3 swapRB = mat3(0, 0, 1,   0, 1, 0,   1, 0, 0);   // swaps red and blue
  vec3 c = swapRB * vec3(vUv.x, vUv.y, 0.2);
  gl_FragColor = vec4(c, 1.0);
}`);
add('Language', 'type', 'mat4', 'mat4(...)', 'A 4×4 matrix (positions with translation). The vertex shader uses them; in a fragment shader you rarely need one.', null);
add('Language', 'kw', 'const', 'const float NAME = value;', 'A value that never changes. Written in CAPITALS by habit. Can be used at the top of the file or inside functions.', `const float RADIUS = 0.3;
void main() {
  vec2 p = vUv - 0.5;
  float inside = step(length(p), RADIUS);
  gl_FragColor = vec4(vec3(inside), 1.0);
}`);
add('Language', 'kw', 'uniform', 'uniform float uName;', 'An input you control from the Uniforms tab. Add a comment after it to set the start value and range: "// 0.5 [0, 1]" (a vec3 colour: "// color 1 0.5 0.2").', `uniform float uSize; // 0.3 [0, 0.5]
uniform vec3 uTint;  // color 0.95 0.6 0.2
void main() {
  float d = length(vUv - 0.5);
  float inside = step(d, uSize);
  gl_FragColor = vec4(uTint * inside, 1.0);
}`);
add('Language', 'kw', 'struct', 'struct Name { float a; vec3 b; };', 'Bundle several values into one. Create one with Name(a, b) and read fields with a dot.', `struct Disc { vec2 c; float r; vec3 col; };
void main() {
  Disc a = Disc(vec2(0.35, 0.5), 0.2, vec3(0.9, 0.4, 0.3));
  Disc b = Disc(vec2(0.65, 0.5), 0.2, vec3(0.3, 0.6, 0.9));
  vec3 col = vec3(0.08);
  if (distance(vUv, a.c) < a.r) col = a.col;
  if (distance(vUv, b.c) < b.r) col = b.col;
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'if', 'if (cond) { ... } else { ... }', 'Run code only when a bool is true. On the GPU both sides can be costly, so the math versions (step, mix) are often better.', `void main() {
  vec3 col;
  if (vUv.x < 0.33) col = vec3(0.9, 0.3, 0.3);
  else if (vUv.x < 0.66) col = vec3(0.3, 0.8, 0.4);
  else col = vec3(0.3, 0.5, 0.9);
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'for', 'for (int i = 0; i < N; i++) { ... }', 'Repeat code. Keep N small and fixed; every pixel runs the whole loop. Use break to leave early.', `void main() {
  vec3 col = vec3(0.07);
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    vec2 c = vec2(0.15 + 0.175 * fi, 0.5);
    float dot1 = 1.0 - smoothstep(0.04, 0.07, distance(vUv, c));
    col += vec3(0.2, 0.5, 0.9) * dot1 * (0.3 + 0.175 * fi);
  }
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'Functions', 'float name(float a, vec2 b) { return ...; }', 'Write your own helper above main(). The return type comes first. Use  out  or  inout  before a parameter to send a value back.', `float ring(vec2 p, float r, float w) {
  return 1.0 - smoothstep(0.0, w, abs(length(p) - r));
}
void main() {
  vec2 p = vUv - 0.5;
  float v = ring(p, 0.15, 0.015) + ring(p, 0.3, 0.015) + ring(p, 0.45, 0.015);
  gl_FragColor = vec4(vec3(v), 1.0);
}`);
add('Language', 'kw', 'discard', 'discard;', 'Throw the pixel away: it is not drawn at all, you see what is behind. Good for cut-outs and dissolves.', `void main() {
  if (checker(vUv * 6.0) > 0.5) discard;
  gl_FragColor = vec4(vec3(vUv, 0.6), 1.0);
}`);
add('Language', 'macro', '#define', '#define NAME value', 'A text replacement made before compiling. Handy for constants and tiny helpers.', `#define SCALE 7.0
void main() {
  float v = 0.5 + 0.5 * sin(vUv.x * SCALE * 3.1416) * sin(vUv.y * SCALE * 3.1416);
  gl_FragColor = vec4(vec3(v), 1.0);
}`);
add('Language', 'kw', 'Arrays', 'const vec3 A[4] = vec3[4](...);', 'A fixed list of values. Index with an int: A[i]. Handy for palettes.', `const vec3 PAL[4] = vec3[4](vec3(0.9, 0.25, 0.25), vec3(0.95, 0.7, 0.2), vec3(0.25, 0.7, 0.4), vec3(0.25, 0.45, 0.9));
void main() {
  int i = int(clamp(vUv.x * 4.0, 0.0, 3.999));
  gl_FragColor = vec4(PAL[i], 1.0);
}`);

// ------------------------------------------------------------------ built-in variables
add('Built-in variables', 'var', 'vUv', 'vec2 vUv', 'Texture coordinates of the surface: 0..1 across each face (u to the right, v up). The most common starting point.', `void main() {
  gl_FragColor = vec4(vUv, 0.0, 1.0);    // red = u, green = v
}`);
add('Built-in variables', 'var', 'vP', 'vec2 vP', 'vUv multiplied by 4: the same coordinates but in "units" so patterns repeat 4 times. (Same name the game shaders use.)', `void main() {
  gl_FragColor = vec4(vec3(checker(vP)), 1.0);
}`);
add('Built-in variables', 'var', 'vPos', 'vec3 vPos', 'Position of this point on the object, in the object\'s own space (about -1..1). Patterns made from it have no seams and wrap around any shape.', `void main() {
  gl_FragColor = vec4(vPos * 0.5 + 0.5, 1.0);   // x, y, z shown as r, g, b
}`, { shape: true });
add('Built-in variables', 'var', 'vP3', 'vec3 vP3', 'Another name for vPos (the name the game shaders use).', `void main() {
  float stripes = step(0.0, sin(vP3.y * 24.0));
  gl_FragColor = finish(mix(vec3(0.9, 0.35, 0.2), vec3(0.95), stripes), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'vN', 'vec3 vN', 'Surface normal in view space (relative to the camera). Not normalised after interpolation: use normalize(vN).', `void main() {
  gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'vW', 'vec3 vW', 'Position of this point in the world (after the object has been moved or rotated).', `void main() {
  gl_FragColor = vec4(fract(vW * 2.0), 1.0);    // repeats every 0.5 world units
}`, { shape: true });
add('Built-in variables', 'var', 'vWN', 'vec3 vWN', 'Surface normal in world space. Use surfNormal() to get it normalised and facing you.', `void main() {
  gl_FragColor = vec4(normalize(vWN) * 0.5 + 0.5, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uTime', 'float uTime', 'Seconds since the preview started (the Time button in the preview and the Scene tab control it). Use it to animate.', `void main() {
  float v = 0.5 + 0.5 * sin(uTime * 3.0 + vUv.x * 10.0);   // hover this card: it animates
  gl_FragColor = vec4(vec3(v) * vec3(0.4, 0.8, 1.0), 1.0);
}`);
add('Built-in variables', 'var', 'uSeed', 'float uSeed', 'A number that stays the same while you look but can be changed in the Scene tab: use it to make every object slightly different.', `void main() {
  vec3 c = vec3(hash11(uSeed), hash11(uSeed + 1.0), hash11(uSeed + 2.0));
  gl_FragColor = vec4(c, 1.0);
}`);
add('Built-in variables', 'var', 'uResolution', 'vec2 uResolution', 'Size of the picture in pixels. Divide gl_FragCoord.xy by it to get 0..1 screen coordinates.', `void main() {
  vec2 s = gl_FragCoord.xy / uResolution;
  gl_FragColor = vec4(s, 0.3, 1.0);
}`);
add('Built-in variables', 'var', 'uLightDir', 'vec3 uLightDir', 'Direction towards the sun, in world space (length 1). Change it in the Scene tab.', `void main() {
  float d = lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(vec3(d), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uLightCol', 'vec3 uLightCol', 'Colour times strength of the sun.', `void main() {
  float d = lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(uLightCol * d, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uAmbSky', 'vec3 uAmbSky', 'Soft light coming from above. Together with uAmbGround it fills the shadows with colour.', `void main() {
  gl_FragColor = vec4(uAmbSky * 1.8, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uAmbGround', 'vec3 uAmbGround', 'Soft light coming from below (bounced from the ground).', `void main() {
  vec3 n = surfNormal();
  gl_FragColor = vec4(mix(uAmbGround, uAmbSky, n.y * 0.5 + 0.5) * 1.8, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'cameraPosition', 'vec3 cameraPosition', 'Where the camera is, in world space. Distance to a surface = distance(cameraPosition, vW).', `void main() {
  float d = distance(cameraPosition, vW);
  gl_FragColor = vec4(vec3(1.0 - (d - 2.0) / 2.5), 1.0);   // near = bright
}`, { shape: true });
add('Built-in variables', 'var', 'uTex0', 'sampler2D uTex0', 'A built-in test picture (colour squares with a letter) you can sample with texture().', `void main() {
  gl_FragColor = texture(uTex0, vUv);
}`);
add('Built-in variables', 'var', 'uNoiseTex', 'sampler2D uNoiseTex', 'A 256×256 picture of random noise. Repeats when you go past 0..1. A cheap source of randomness.', `void main() {
  gl_FragColor = vec4(texture(uNoiseTex, vUv * 2.0).rgb, 1.0);
}`);
add('Built-in variables', 'var', 'gl_FragCoord', 'vec4 gl_FragCoord', 'Pixel position on the screen (x, y), in pixels, plus depth in z.', `void main() {
  vec2 cell = floor(gl_FragCoord.xy / 32.0);        // 32 pixel squares
  gl_FragColor = vec4(vec3(mod(cell.x + cell.y, 2.0) * 0.6 + 0.2), 1.0);
}`);
add('Built-in variables', 'var', 'gl_FragColor', 'vec4 gl_FragColor', 'The colour (red, green, blue, alpha) this pixel ends up with. Every shader must set it. Studio note: modern GLSL (ES 3.00, what the studio runs) has no gl_FragColor; you declare your own output variable. The studio quietly renames gl_FragColor to that output so older-style shaders work. finish() (also a studio helper) gives you lighting for free.', `void main() {
  gl_FragColor = vec4(vUv, 0.5, 1.0);
}`);
add('Built-in variables', 'var', 'gl_FrontFacing', 'bool gl_FrontFacing', 'True when you see the front of the surface, false when you see the back (inside of a plane or open shape).', `void main() {
  vec3 col = gl_FrontFacing ? vec3(0.25, 0.7, 0.4) : vec3(0.9, 0.3, 0.25);
  gl_FragColor = vec4(col, 1.0);
}`);
add('Built-in variables', 'cn', 'PI', 'const float PI', '3.14159…: half a turn in radians. TAU = 2π is a full turn.', fx('0.5 + 0.5 * sin(x * PI)'));
add('Built-in variables', 'cn', 'TAU', 'const float TAU', '6.28318…: a full turn in radians.', fx('0.5 + 0.5 * sin(x * TAU)'));
add('Built-in variables', 'var', 'gNormal', 'vec3 gNormal', 'Your own surface normal (for a bump map). finish() only looks at it when gHasN is 1.0.', `void main() {
  float h = noise(vUv * 30.0);
  gNormal = bumpFromHeight(h, 0.08);
  gHasN = 1.0;
  gl_FragColor = finish(vec3(0.75, 0.62, 0.45), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gHasN', 'float gHasN', 'The switch for gNormal: set it to 1.0 and finish() lights the surface with gNormal instead of the real one. 0.0 (the start value) means "ignore gNormal".', `void main() {
  gNormal = bumpFromHeight(noise(vUv * 30.0), 0.08);
  gHasN = 1.0;   // try 0.0: the bumps disappear
  gl_FragColor = finish(vec3(0.75, 0.62, 0.45), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gShine', 'float gShine', 'How strong a sun highlight finish() adds (0 = none, 1 = clear). The size of the highlight is set by gRough.', `void main() {
  gShine = 1.0;
  gRough = 0.25;
  gl_FragColor = finish(vec3(0.75, 0.3, 0.2), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gRough', 'float gRough', 'How wide and dull the highlight from gShine is: 0.05 = small and hard like polished metal, 1 = wide and soft like plastic. Starts at 0.6. Only matters when gShine is above 0.', `void main() {
  gShine = 1.0;
  gRough = 0.9;   // try 0.1
  gl_FragColor = finish(vec3(0.75, 0.3, 0.2), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gSpec', 'vec3 gSpec', 'Extra light added after the lighting, not multiplied by the surface colour (hard shine or glow).', `void main() {
  gSpec = vec3(1.0, 0.8, 0.5) * fresnel(surfNormal(), viewDir(), 3.0);
  gl_FragColor = finish(vec3(0.2, 0.25, 0.4), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gGlint', 'vec3 gGlint', 'Like gSpec, a highlight added after the lighting (for sparkles).', `void main() {
  float sp = step(0.93, noise(vUv * 60.0));
  gGlint = vec3(sp);
  gl_FragColor = finish(vec3(0.3, 0.32, 0.38), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gBlow', 'float gBlow', 'Over-expose the lit side: where the sun hits, the colour pushes toward white (0 = off, 1 = strong).', `void main() {
  gBlow = 1.0;
  gl_FragColor = finish(vec3(0.8, 0.4, 0.2), 1.0);
}`, { shape: true });

add('Built-in variables', 'var', 'gDirect', 'float gDirect', 'How directly the sun hits this point (0 = turned away, 1 = facing the sun). finish() and sceneLight() fill it in, so it is only meaningful after one of them has run. Handy for effects that should only show on the lit side.', `void main() {
  vec3 base = finish(vec3(0.5), 1.0).rgb;   // fills in gDirect
  gl_FragColor = vec4(vec3(gDirect), 1.0);
}`, { shape: true });

// ------------------------------------------------------------------ angles & trig
add('Angles & trig', 'fn', 'radians', 'radians(degrees)', 'Degrees to radians (180° = π).', fx('0.5 + 0.5 * sin(radians(x * 720.0))', '// 720 degrees = two full waves'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'degrees', 'degrees(radians)', 'Radians to degrees.', fx('degrees(x * 6.2832) / 360.0', '// a full turn (6.28 radians) is 360 degrees'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'sin', 'sin(angle)', 'Sine of an angle in radians: a smooth wave from -1 to 1 that repeats every 2π. The basis of stripes, pulses and animation.', fx('0.5 + 0.5 * sin(x * 6.2832)', '// turned into 0..1 so it fits the picture'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'cos', 'cos(angle)', 'Cosine: like sin but starts at the top. cos(a) and sin(a) together walk around a circle.', fx('0.5 + 0.5 * cos(x * 6.2832)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'tan', 'tan(angle)', 'Tangent: shoots off to infinity at ±π/2.', fx('0.5 + 0.12 * tan(x * 3.1416 - 1.5708)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'asin', 'asin(x)', 'Inverse sine. x must be between -1 and 1; returns -π/2 .. π/2.', fx('asin(x * 2.0 - 1.0) / 3.1416 + 0.5'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'acos', 'acos(x)', 'Inverse cosine. x must be between -1 and 1; returns 0 .. π.', fx('acos(x * 2.0 - 1.0) / 3.1416'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'atan', 'atan(y, x)  or  atan(y_over_x)', 'The angle of a direction. atan(p.y, p.x) gives -π..π all the way around (the two-number form knows the quadrant).', `void main() {
  vec2 p = vUv - 0.5;
  float a = atan(p.y, p.x);                          // -PI .. PI around the centre
  vec3 col = hsv2rgb(vec3(a / 6.2832 + 0.5, 0.8, 1.0));
  gl_FragColor = vec4(col, 1.0);
}`, { ret: 'genType', G });
add('Angles & trig', 'fn', 'sinh', 'sinh(x)', 'Hyperbolic sine.', fx('0.5 + sinh(x * 4.0 - 2.0) / 8.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'cosh', 'cosh(x)', 'Hyperbolic cosine (the shape of a hanging chain).', fx('cosh(x * 4.0 - 2.0) / 8.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'tanh', 'tanh(x)', 'Hyperbolic tangent: an S-curve between -1 and 1, a soft clamp.', fx('0.5 + 0.5 * tanh(x * 6.0 - 3.0)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'asinh', 'asinh(x)', 'Inverse hyperbolic sine.', fx('0.5 + asinh(x * 8.0 - 4.0) / 4.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'acosh', 'acosh(x)', 'Inverse hyperbolic cosine (x must be 1 or more).', fx('acosh(1.0 + x * 5.0) / 3.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'atanh', 'atanh(x)', 'Inverse hyperbolic tangent (x must be between -1 and 1).', fx('0.5 + 0.15 * atanh(x * 1.8 - 0.9)'), { ret: 'genType', G });

// ------------------------------------------------------------------ power & exponent

add('Power & exponent', 'fn', 'exp', 'exp(x)', 'e to the power x: grows faster and faster.', fx('exp(x * 3.0) / 20.0'), { ret: 'genType', G });

add('Common math', 'fn', 'sign', 'sign(x)', '-1 for negative numbers, 0 for zero, +1 for positive.', fx('0.5 + 0.35 * sign(x - 0.5)'), { ret: 'genType', G });
add('Common math', 'fn', 'floor', 'floor(x)', 'Round down to a whole number. floor(x * n) / n makes steps (posterize).', fx('floor(x * 5.0) / 5.0'), { ret: 'genType', G });

add('Common math', 'fn', 'round', 'round(x)', 'Round to the nearest whole number.', fx('round(x * 5.0) / 5.0'), { ret: 'genType', G });

add('Common math', 'fn', 'fract', 'fract(x)', 'The part after the decimal point (x - floor(x)): a sawtooth from 0 to 1. fract(p * n) repeats a pattern n times.', fx('fract(x * 3.0)'), { ret: 'genType', G });

add('Common math', 'fn', 'mix', 'mix(a, b, t)', 'Blend between a and b: t = 0 gives a, t = 1 gives b, in between is a smooth mix. Works for floats, colours, positions.', `void main() {

// ------------------------------------------------------------------ geometry
add('Geometry', 'fn', 'length', 'length(v)', 'The length of a vector. length(p) is the distance from the origin: concentric circles.', `void main() {

  gl_FragColor = vec4(vec3(d), 1.0);
}`, { ret: 'float', G });
