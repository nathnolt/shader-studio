lesson('reflect', 'Reflections and shiny materials', 'Intermediate',
  'Reflect the view direction, look it up in an environment function you write yourself, then mix with fresnel and bump.', [
  { t: 'The reflected direction', x: `A mirror sends your line of sight off in a new direction. [[reflect]](I, n) mirrors the direction \`I\` around the normal \`n\`. \`-viewDir()\` points from the camera **towards** the surface, which is what \`reflect\` wants (hence the minus).

The result \`r\` answers: "what direction would I be seeing if this surface were a mirror?" Shown as colour, it changes smoothly across the shape.`,
    new: ['reflect'], shape: true, try: 'Orbit the camera: the colours slide as the view direction changes.',
    code: `void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}` },
  { t: 'Your own function', x: `Before the next step you need one more tool: **writing your own function**. It looks like \`main\`, but with a **return type** in front (here \`float\`), a **name**, parameters in brackets, and a \`return\` line that gives the answer back.

\`double_it\` takes a float and returns twice its value. Functions go **above** \`main\`, and you call them by name, exactly like the built-in ones. They keep long code tidy and let you use the same logic in several places.`,
    new: [N('return', 'float name(float x) { return x * 2.0; }', 'Define your own function: return type, name, parameters. \`return\` hands the answer back.')],
    shape: false, try: 'Change the function to return x * x and see the gradient bend.',
    code: `float double_it(float x) {
  return x * 2.0;
}
void main() {
  float g = double_it(vUv.x * 0.5);
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'A fake environment', x: `A real reflection needs a picture of the world around the object. We can write a **function that returns a colour for a direction**, which is just as good: **sky colour above, ground colour below**, with a switch at the horizon (where the up-down part \`r.y\` is 0).

\`smoothstep(-0.1, 0.1, r.y)\` is 0 below the horizon, 1 above, and a soft blend at it; \`mix\` then picks the ground or the sky.`,
    shape: true, try: 'Change the sky and ground colours.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  return mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
}
void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(env(r), 1.0);
}` },
  { t: 'Put the sun in the reflection', x: `A mirror also shows the sun as a tiny very bright disc. It's the same idea as the highlight: how closely does the reflected direction \`r\` point at \`uLightDir\`? \`pow(max(dot(...), 0.0), 200.0)\` is a tight spot, and multiplying by 3 makes it brighter than white, which looks like a real light.

Click \`c += ...\` in the editor and look at the line preview.`,
    shape: true, try: 'Change 200.0 to 20.0 for a bigger softer sun.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(env(r), 1.0);
}` },
  { t: 'Not everything is a mirror: fresnel', x: `Plastic, paint and water show only a **weak** reflection when you look straight at them and almost a full mirror at glancing angles. That's \`fresnel\` again. Mix the surface's own colour with the reflection by the fresnel value, with a floor (\`0.08 + 0.92 * f\`) so the reflection never vanishes completely.`,
    shape: true, try: 'Change the base colour. Change the floor 0.08 to 0.5 for a more mirror-like surface.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 n = surfNormal();
  vec3 v = viewDir();
  vec3 r = reflect(-v, n);
  vec3 base = vec3(0.7, 0.08, 0.06) * (0.3 + 0.7 * max(dot(n, uLightDir), 0.0));
  float f = 0.08 + 0.92 * fresnel(n, v, 5.0);
  gl_FragColor = vec4(mix(base, env(r), f), 1.0);
}` },
  { t: 'Roughness: a blurry reflection', x: `A rough surface scatters light, so its reflection is blurry. Cheap trick: **blend towards a duller version**: looking up the environment along the *normal* instead of the reflected direction gives a smooth average of the surroundings. \`mix(env(r), env(n), uRough)\` goes from sharp mirror (0) to matte (1). \`uRough\` is a slider (\`uniform\`, as in the bump lesson).`,
    shape: true, try: 'Open the Uniforms tab and move uRough.',
    code: `uniform float uRough; // 0.3 [0, 1]
vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 n = surfNormal();
  vec3 r = reflect(-viewDir(), n);
  vec3 refl = mix(env(r), env(n), uRough);
  vec3 tint = vec3(1.0, 0.9, 0.8);
  gl_FragColor = vec4(refl * tint, 1.0);
}` },
  { t: 'Reflect a bumpy surface', x: `The reflection only needs a normal, and \`bumpFromHeight\` gives you a different normal! Compute \`n\` with it, then use **that** normal in \`reflect\`. The reflection now ripples across the bumps like hammered metal or water.

This is why bump maps matter most on shiny things: every bump bends the reflection. We don't call \`finish\` here, so there's no extra lighting: the result is the reflection alone, with a slight tint.`,
    shape: true, try: 'Change 0.08 (strength) and 3.0 (bump size).',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  float h = fbm3(vPos * 3.0);
  vec3 n = bumpFromHeight(h, 0.08);
  vec3 r = reflect(-viewDir(), n);
  vec3 tint = vec3(0.9, 0.95, 1.0);
  gl_FragColor = vec4(env(r) * tint, 1.0);
}` },
], true);

lesson('uvsize', 'Same pattern on every size: compensating for UV size', 'Intermediate',
  'UV always runs 0 to 1 across a face, however big the face is. Measure the real size and use it, so patterns are never stretched.', [
  { t: 'The problem: UV ignores size', x: `Every face of a shape gets \`vUv\` from 0 to 1, whether the face is a coin or a wall. So a pattern written in \`vUv\` is **squeezed onto the face**: on a face that is wider than tall, squares become wide rectangles.

Here is a block (2 wide, 0.8 tall, 1.2 deep) with 8 by 8 checks per face. The checks are only square on faces that happen to be square. Look at the front, the side and the top: all three have the same 8 by 8 checks, but different shapes.`,
    view: 'block', shape: true, new: ['checker', 'lambert'], try: 'Orbit around the block and compare the checks on the front, side and top.',
    code: `void main() {
  float c = checker(vUv * 8.0);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  col *= 0.55 + 0.45 * lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Fix by hand: multiply by the size', x: `The idea is simple: if the face is **2 units wide** and **0.8 tall**, then multiplying u by 2 and v by 0.8 makes **one unit of the pattern equal to one world unit** in both directions. Now we choose how big a check is in the world: here every check is 0.25 units, so we divide by 0.25.

\`uv * size / tile\`. This looks right on the front, but the side face is 1.2 wide, not 2, so it is still wrong there. A number you type in is right for **one** face only.`,
    view: 'block', shape: true, try: 'The front is fixed. Change size to vec2(1.2, 0.8) and the side is fixed instead.',
    code: `void main() {
  vec2 size = vec2(2.0, 0.8);     // world size of the front face
  float tile = 0.25;              // a check is 0.25 world units
  float c = checker(vUv * size / tile);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  col *= 0.55 + 0.45 * lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Let the GPU measure the size', x: `We want the shader to find \`size\` **itself**, for any face of any shape. The helper [[uvWorldSize]]() does that: it returns how many world units one whole UV unit covers, as \`vec2(width, height)\`.

Shown as colour (red = width, green = height) you can see it measures every face separately: the front is red-ish and low green, the side has less red. Later in this lesson we build it ourselves.`,
    view: 'block', shape: true, new: ['uvWorldSize'], try: 'Orbit: the colours stay the same, because the world size does not depend on the camera.',
    code: `void main() {
  vec2 size = uvWorldSize();
  gl_FragColor = vec4(size / 2.0, 0.0, 1.0);
}` },
  { t: 'Use it: uvFit', x: `Put the measured size where we typed it by hand. Because this is the most common use, there is a one-line helper, [[uvFit]](uv, tile): it is just \`uv * uvWorldSize() / tile\`.

Now the checks are square, **the same size on every face**, and if you scale the block the checks do not stretch, they just get more or fewer.`,
    view: 'block', shape: true, new: ['uvFit'], try: 'Change 0.25 to 0.1 for smaller checks on every face at once.',
    code: `void main() {
  vec2 p = uvFit(vUv, 0.25);
  float c = checker(p);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  col *= 0.55 + 0.45 * lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Building it: how fast does something change?', x: `How can a shader know the size? It cannot see the model, but it **can compare neighbouring pixels**. [[dFdx]](v) is how much \`v\` changes between this pixel and the one to its right; [[dFdy]](v) the same for the pixel above.

Take the world position \`vW\` and the uv. Moving one pixel changes the position by \`dFdx(vW)\` and the uv by \`dFdx(vUv)\`. So **world distance per uv** is about \`length(dFdx(vW)) / length(dFdx(vUv))\`. This one-direction guess is the whole idea.`,
    view: 'block', shape: true, new: ['vW', 'dFdx', 'dFdy'], try: 'Orbit: it works on the front, but gets odd when a face is turned so that u no longer runs left to right on screen.',
    code: `void main() {
  float worldPerU = length(dFdx(vW)) / length(dFdx(vUv));
  gl_FragColor = vec4(vec3(worldPerU / 2.0), 1.0);
}` },
  { t: 'Building it: any direction', x: `Pixels run left to right and bottom to top, but **u and v can run in any direction on screen** (the side face is turned, the top face is foreshortened). So we must ask: **which pixel step makes u grow by exactly 1?**

Put the two uv changes in a [[mat2]] \`m = mat2(dFdx(vUv), dFdy(vUv))\`. It converts a pixel step into a uv step. The [[inverse]] does the opposite: it converts a uv step into a pixel step. Its first column is the pixel step for **one full u**, the second for **one full v**.

Then the world distance for that pixel step is \`dFdx(vW) * step.x + dFdy(vW) * step.y\`, and its \`length\` is the size. Here it is for u and v.`,
    view: 'block', shape: true, new: ['mat2', 'inverse'], try: 'Compare with the previous step: now it is right from every angle. Every face keeps its own colour.',
    code: `vec2 myWorldSize() {
  mat2 toUv = mat2(dFdx(vUv), dFdy(vUv));     // pixel step -> uv step
  mat2 toPx = inverse(toUv);                  // uv step -> pixel step
  vec3 dx = dFdx(vW), dy = dFdy(vW);          // world step per pixel step
  vec3 alongU = dx * toPx[0].x + dy * toPx[0].y;
  vec3 alongV = dx * toPx[1].x + dy * toPx[1].y;
  return vec2(length(alongU), length(alongV));
}
void main() {
  vec2 size = myWorldSize();
  gl_FragColor = vec4(size / 2.0, 0.0, 1.0);
}` },
  { t: 'Your own uvFit, on a cylinder', x: `With your own \`myWorldSize\` the helper is one line. The **cylinder** is the hardest test: its u goes round the whole circumference (about 4.7 units) while v is the height (1.7 units), so with plain uv a pattern is stretched almost 3 times sideways. Pick the Cylinder shape and compare the two lines in the code.`,
    view: 'cylinder', shape: true, try: 'Swap which line is used for p: with vUv the checks are wide, with myFit they are square.',
    code: `vec2 myWorldSize() {
  mat2 toPx = inverse(mat2(dFdx(vUv), dFdy(vUv)));
  vec3 dx = dFdx(vW), dy = dFdy(vW);
  return vec2(length(dx * toPx[0].x + dy * toPx[0].y), length(dx * toPx[1].x + dy * toPx[1].y));
}
vec2 myFit(vec2 uv, float tile) {
  return uv * myWorldSize() / tile;
}
void main() {
  vec2 p = myFit(vUv, 0.25);          // try vUv * 8.0 here
  float c = checker(p);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  col *= 0.55 + 0.45 * lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Compensating for pixels instead', x: `Sometimes you do not want world size but **size on screen**: a flat rectangle shown stretched to the window (like the Rectangle shape here), a full-screen effect, or any 2D picture. There the uv spans the whole window, so a circle drawn in uv turns into an **ellipse** when the window is wider than tall.

Same trick, but measure with the **pixel steps** instead of world distances: \`length(toPx[0])\` is how many pixels one u covers. [[uvPixelSize]]() returns this as \`vec2(across, up)\`. Dividing by the smaller side gives coordinates where one unit is the shorter side of the window, so a circle stays round.`,
    shape: false, new: ['uvPixelSize'], try: 'Resize the preview or switch it to a wide shape: the circle stays round.',
    code: `void main() {
  vec2 px = uvPixelSize();                       // pixels covered by one uv
  vec2 p = (vUv - 0.5) * px / min(px.x, px.y);   // 1 unit = shorter side
  float d = length(p) - 0.3;
  float edge = smoothstep(0.01, 0.0, d);
  gl_FragColor = vec4(vec3(edge), 1.0);
}` },
  { t: 'Limits, and what to do in a game', x: `Four things to know about the derivative method:

**1. Edges.** Derivatives compare neighbouring pixels, so a pixel at the border between two faces can get a wrong size for one pixel row. Usually it is invisible; for hard cases use the next idea.

**2. Curved shapes.** On a sphere, torus or knot the size changes from place to place (a sphere's u is wide at the equator and tiny at the poles). Measuring it per pixel gives a size that jumps between triangles, and multiplying uv by a jumping size draws zig-zags. So for these shapes the studio measures **one average size for the whole mesh** and \`uvWorldSize()\` returns that, which keeps the pattern smooth. The price: it is not equal everywhere, so checks get narrower towards the poles or the inside of the ring. That cannot be avoided with uv; for an even pattern on a sphere use \`vPos\` (3D) instead.

**3. It costs a little.** The inverse and derivatives run per pixel, every frame.

**4. Exporting.** ShaderToy has no mesh, so the export gives sizes of 1 and the pattern is plain uv there.

In a real three.js game it is cheaper to do it **outside the fragment shader**. Either pass the size as a uniform (\`material.uniforms.uSize.value.set(w, h)\` from the mesh's scale), or compute it in the vertex shader from \`modelMatrix\`: \`length(modelMatrix[0].xyz)\` is how much the object is stretched in x. Then \`uv * uSize / tile\` costs one multiply. The derivative helpers are best when you do not know the size beforehand, or when one mesh has faces of different sizes.`,
    view: 'block', shape: true, try: 'Edit the tile size and the colours: this is the finished pattern.',
    code: `void main() {
  vec2 p = uvFit(vUv, 0.2);
  float c = checker(p);
  vec3 col = mix(vec3(0.2, 0.15, 0.1), vec3(0.85, 0.7, 0.45), c);
  col *= 0.55 + 0.45 * lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(col, 1.0);
}` },
], true);

// ====================================================================== building the helpers
// These lessons rebuild the studio's own helpers from scratch, under names starting with "my", so you can see
// that nothing in them is magic. The last step of each says which studio helper it matches.
lesson('b-hash', 'Random numbers 1: the simple version (multiply and fract)', 'Building the helpers',
  'A shader has no random() function. Build one from just multiply and fract, see exactly what each line does, and learn where this simple version breaks.', [
  { t: 'What a hash has to do', x: `Every pixel runs the same code at the same time, and none of them can ask "what number did my neighbour pick?". So "random" in a shader means something else: a **function that scrambles a number so thoroughly that the result looks random**. Same input, same output, always. That is called a **hash**.

A good hash must give the same answer for the same input every time, give an *unrelated* answer when the input changes even a little, and spread its answers evenly between 0 and 1.

**The test used in this lesson.** We cut the screen into 64 × 64 squares and give every square its own whole number, its **id**: 0, 1, 2, ... up to 4095, counting along each row and then up. A hash of the id should give every square an unrelated grey, so the picture looks like TV static. Below is just the id itself, as a plain grey ramp.`,
    new: ['floor'], try: 'Change 64.0 to 8.0 for fewer, bigger squares (and change 4096.0 to 64.0 to match).',
    code: `void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;       // 0 ... 4095: a different whole number in every square
  gl_FragColor = vec4(vec3(id / 4096.0), 1.0);
}` },
  { t: 'Ingredient 1: wrap with fract', x: `\`fract(x)\` keeps only the part after the decimal point, so it **wraps** numbers into 0 to 1: fract(2.7) is 0.7.

Multiply the id by a small, awkward number such as **0.1031** and wrap it: each id moves 0.1031 of the way round a circle compared with the one before. That is a first scramble: neighbouring ids no longer get neighbouring greys.

The **left half** shows just this ingredient, and the **right half** is always the finished hash from the next steps. Notice the left half has *regular diagonal stripes*: every step round the circle is the same size, so the pattern repeats itself. One ingredient is not enough, and the next two lines are there to break the regularity.`,
    try: 'Change 0.1031 to 0.5 and the stripes become a plain chequerboard-like pattern. A "nice" number makes the pattern MORE regular, which is why the constant is awkward.',
    code: `float myHash(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  float stage = fract(id * 0.1031);
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? stage : myHash(id)), 1.0);
}` },
  { t: 'Ingredient 2: multiply by yourself', x: `\`p *= p + 33.33\` means \`p = p * (p + 33.33)\`: the number is multiplied by *itself plus a constant*. That is a **curve**, not a straight line (p² + 33.33p).

Why does a curve help? On a straight line, equal steps in the input give equal steps in the output, which is the regularity we saw. On a curve the step size **depends on where you are**, so neighbouring ids get different step sizes. The 33.33 makes the curve steep, so a small difference between two inputs becomes a big difference in the output.

The left half is now the result of lines 1 and 2, wrapped. The regular stripes are gone, but a trained eye can still find some structure.`,
    try: 'Change 33.33 to 0.0 and see the left half go smoother. The constant is what makes the curve steep.',
    code: `float myHash(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  float p = fract(id * 0.1031);
  p *= p + 33.33;
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? fract(p) : myHash(id)), 1.0);
}` },
  { t: 'Ingredient 3: do it again, then wrap', x: `\`p *= p + p\` is \`p = p * (p + p)\`, which is 2 × p × p: a steeper curve still. It repeats the same idea, so tiny differences are blown up again. Then the last \`fract\` wraps the (now large) number back into 0 to 1.

Put the four lines together and you have the whole function: **wrap, curve, steeper curve, wrap**. Both halves of the picture now look like static. That is Dave Hoskins' "Hash without Sine" (the name says what it avoids: the older \`fract(sin(x) * 43758.5453)\` trick, which gives different answers on different graphics cards).`,
    try: 'Is it really random? Zoom in on the preview and look for diagonal lines or repeating blocks. For ids up to a few thousand there are none.',
    code: `float myHash(float p) {
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  gl_FragColor = vec4(vec3(myHash(id)), 1.0);
}` },
  { t: 'Two inputs: a grid cell', x: `A picture usually wants a hash of a **position** (x and y), not one id. The 2D version of the same recipe does the wrap on **three** numbers at once (the x and y of the cell, with x repeated: \`p.xyx\` is *swizzling*: it builds a vec3 from the x, y and x of p), then mixes them together with a \`dot\` product (multiply the numbers pairwise and add: it makes every number depend on the other two) and wraps again.

Now each square is hashed by its own (x, y) position, with no need to count the squares into one id.

(This two-input version is built on the same four-line recipe, so it has the same limits as the one-number version above. The fixes at the end of this lesson are shown on the one-number function.)`,
    try: 'Change 64.0 to 16.0 for bigger squares.',
    code: `float myHash2(vec2 p) {
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  gl_FragColor = vec4(vec3(myHash2(cell)), 1.0);
}` },
  { t: 'The lab: one multiplier, three kinds of input', x: `The constant \`0.1031\` is the number in line 1, \`fract(p * 0.1031)\`. Here it is a slider (\`uK\`), so you can try other numbers and watch what happens. The picture has **three panels**, all hashed with the same \`uK\`:

**Left: whole-number ids** (0 to 4095, the squares from before).
**Middle: a smooth ramp** from 0 to 1 that creeps up in tiny steps, one per pixel.
**Right: very big ids** (ten million and up), like cells very far from the origin.

At **0.1031** the left panel is static, the middle is full of stripes, and the right is patterned. I measured what happens for other values with a **pattern strength**: how well one pixel's grey predicts its neighbours' greys. **0% means unrelated, which is static**; 100% means identical (flat stripes). A 64 × 64 picture of true random static still measures about 4% by chance, so anything up to about 6% is static, and above about 10% you can usually see the pattern.

**uK = 0.1031**: ids **4%** (static), ramp **100%**, big ids **83%**.
**uK = 1.1031**: ids **4%**, ramp **95%**, big ids: one flat grey.
**uK = 12.1031**: ids **7%**, ramp **45%**, big ids: one flat grey.
**uK = 127.1031**: ids **57%**, ramp **5%**, big ids: one flat grey.
**uK = 1000.1031**: ids **79%**, ramp **1%**, big ids: one flat grey.
**uK = 0.5**: ids **100%**, ramp **100%**, big ids **100%**.
**uK = 0.01**: ids **20%**, ramp **100%**, big ids **21%**.

No single number is good in all three panels. The next step explains why, and then the lesson fixes it by not asking one number to do everything.`,
    new: ['uniform'], try: 'Drag uK slowly from 0.01 to 300 and watch which panel breaks first. Then type 0.5 and see the ids panel turn into stripes.',
    code: `uniform float uK;   // 0.1031 [0.01, 300]
float myHash(float p) {
  p = fract(p * uK);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;                       // left: whole numbers 0 ... 4095
  vec2 px = floor(vUv * 512.0);
  float ramp = (px.y * 512.0 + px.x) / 262144.0;           // middle: smooth ramp 0 to 1, tiny steps
  float farId = id + 10000000.0;                           // right: the same squares, far from zero
  float h = vUv.x < 0.333 ? myHash(id) : (vUv.x < 0.667 ? myHash(ramp) : myHash(farId));
  gl_FragColor = vec4(vec3(h), 1.0);
}` },
  { t: 'Why: three forces pulling the number in different directions', x: `**Force 1: sensitivity. A smooth input wants a BIG multiplier.**
Static means that two neighbouring pixels get *unrelated* answers. The hash only scrambles by stretching differences: a difference in the input is multiplied by \`K\`, then stretched much more by the two curve lines (about a thousand times). For the ids, neighbours differ by **1**, so even a tiny \`K\` gives a big difference. For the smooth ramp, neighbours differ by **0.0000038**. With \`K = 0.1031\` that becomes 0.0000004, and after the curves it is still only about 0.0004 of a turn: neighbours get almost the same grey, so you see smooth stripes. To get the ramp to scramble you need \`K\` around 100 or more: **12.1031 only helps a bit (45% pattern), 127.1031 fixes the middle panel (5%)**.

**Force 2: precision. A BIG number wants a SMALL multiplier.**
A float holds about **7 digits in total**. If \`p * K\` is 1,031,000 (ten million times 0.1031) then all 7 digits are used up in front of the dot and nothing is left for the fraction that \`fract\` is supposed to keep: the result is only a few different values (the posterised right panel). With \`K = 127\` this starts already at ids around 4000, which is why **127.1031 breaks the ids panel**: 4095 × 127 = 520,000 leaves only 1 or 2 digits for the fraction.
The rule of thumb: **digits left for the fraction ≈ 7 minus the digits of (input × K)**. Big inputs need small K; tiny steps need big K. These two forces pull in opposite directions.

**Force 3: the fractional part of K must be awkward.**
For whole numbers only what comes **after the dot** in K matters (\`0.1031\` and \`12.1031\` do the same thing mathematically; only the precision force tells them apart). A round fraction such as \`0.5\` means id 0 lands at 0, id 1 at 0.5, id 2 back at 0: only two places, so you get stripes. An *awkward* fraction like 0.1031 (or the golden ratio, 0.6180) never lands on the same place twice, so the ids spread evenly round the circle. Too small an awkward number (0.01) is also bad: ids 0, 1, 2, 3 are then nearly the same, so neighbours look alike.

So the answer to "which number?" is: **it depends on the input, and no single number covers them all.** Instead of hunting for a magic constant, the next steps give each *piece* of the number its own multiplier.`,
    try: 'Check force 2 yourself: in the lab set uK to 12.1031 and look at the right panel. Then replace 10000000.0 with 1000.0 and look again.' },
  { t: 'The fix, part 1: treat the fraction separately', x: `Split the number into two pieces: the **whole part** (\`floor(x)\`, for 7.25 that is 7) and the **fraction** (\`x - floor(x)\`, which is 0.25). Give each its own multiplier:

**whole part:** small awkward K (**0.1031**): no precision problem, evenly spread whole numbers, same as before;
**fraction part:** a big K (**291.9429**): the fraction is between 0 and 1, so \`part * 291.9429\` stays small enough to keep its precision (fine!), and the big multiplier turns tiny steps into big jumps.

Then add the two results (\`fract(a + b)\`) and run the same two curve lines as before. For a whole number the fraction is 0, so **nothing changes** for ids, but a smooth ramp is now stirred by the big multiplier. In the picture the middle panel is static now (pattern strength about 3%, down from 100%). The right panel is still patterned, and that is the next fix.`,
    try: 'Change 291.9429 to 0.5 and see the middle panel fail again: the fraction needs a big, awkward number. Then try 12.1031: the stripes come back, fainter.',
    code: `float myHash(float x) {
  float whole = floor(x);                  // 7.25 -> 7
  float part = x - whole;                  // 7.25 -> 0.25
  float p = fract(fract(whole * 0.1031) + fract(part * 291.9429));
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  vec2 px = floor(vUv * 512.0);
  float ramp = (px.y * 512.0 + px.x) / 262144.0;
  float farId = id + 10000000.0;
  float h = vUv.x < 0.333 ? myHash(id) : (vUv.x < 0.667 ? myHash(ramp) : myHash(farId));
  gl_FragColor = vec4(vec3(h), 1.0);
}` },
  { t: 'The fix, part 2: cut big whole numbers into chunks', x: `The right panel fails because of force 2: \`whole * 0.1031\` is a huge number for a huge id. The same trick helps again: **cut the whole part into pieces so every piece stays small.**

\`chunk = floor(whole / 4096.0)\` says which block of 4096 numbers we are in (dividing by 4096 is exact in a float, because it is a power of two). \`rest = whole - chunk * 4096.0\` is the position inside that block, from 0 to 4095. Each piece gets its own multiplier: \`rest\` the awkward **0.1031**, and \`chunk\` the **golden ratio 0.6180** (famous for being the "most awkward" fraction there is: multiples of it spread more evenly round the circle than any other fraction).

Now \`rest * 0.1031\` is never more than 423 and \`chunk * 0.618\` stays small too, so there is plenty of precision left, even for ids in the millions. All three panels are static.

**Where do 4096, 291.9429 and 0.6180 come from?** I tried several hundred values for the fraction multiplier on a collection of inputs (whole ids, ids far from zero, negative numbers, smooth ramps in different ranges, steps like 0.001 and 0.37) and kept one that gave static on all of them. The exact digits are not magic, and many other awkward numbers pass the same tests. **Round numbers do not**: 0.1, 40.0 and 0.5 give a pattern strength of over 100% on the ids. And one *near-round* number failed in an interesting way: **1000.1031** is fine for most inputs but gives stripes for input that creeps up in steps of 0.001, because 0.001 × 1000.1031 = 1.0001: every step moves the number round the circle by *one whole turn plus a hair*, so it lands almost on the same place each time. That is called **resonance**, and it is why the fraction multiplier must not sit close to a whole number times a common step size.`,
    try: 'The right panel only covers two chunks, so first replace id + 10000000.0 with id * 4096.0 (every square in a different chunk). Then change 0.6180 to 0.5 and the right panel turns into stripes. Change it to 0.7549 (another awkward number) and it is static again.',
    code: `float myHash(float x) {
  float whole = floor(x);                  // the whole-number part
  float part = x - whole;                  // the fraction part
  float chunk = floor(whole / 4096.0);     // which block of 4096 whole numbers
  float rest = whole - chunk * 4096.0;     // where inside the block: 0 ... 4095
  float a = fract(rest * 0.1031 + chunk * 0.6180);
  float b = fract(part * 291.9429);
  float p = fract(a + b);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  vec2 px = floor(vUv * 512.0);
  float ramp = (px.y * 512.0 + px.x) / 262144.0;
  float farId = id + 10000000.0;
  float h = vUv.x < 0.333 ? myHash(id) : (vUv.x < 0.667 ? myHash(ramp) : myHash(farId));
  gl_FragColor = vec4(vec3(h), 1.0);
}` },
  { t: 'What is still wrong with this version', x: `Be honest about what the fixes did **not** fix:

**More work.** It is about three times as many operations as the four-line version, because of the split. Still cheap, but it is no longer "the simple one".

**Floats run out above about 16 million.** A float cannot even store every whole number above 16,777,216 (it skips some), so two different ids can *be* the same number before the hash ever sees them. No hash can fix that.

**The 2D version from earlier has the old limits.** Only the one-number function got the fixes. Smooth positions or huge cell numbers in the two-input version still show patterns.

**Other graphics cards may round differently.** Float maths can differ in the last digit between cards, and a hash that multiplies and wraps several times magnifies that. A shader can look right on your machine and slightly different on another.

**Resonance is still possible.** I tested many step sizes and 291.9429 passed all of them, but for any multiplier there are some step sizes that land it close to a whole number of turns and show stripes. The integer hash has no such weak spot that I could find.

Whole-number maths avoids all of these: it is exact and identical on every card, and it needs no special constants for different input sizes. That is the next lesson, and it is the version the studio's own \`hash11\`, \`hash21\` and friends use.`,
    try: 'Resonance, live: in the previous step replace float ramp = ... with float ramp = id * 0.001; and 291.9429 with 1000.1031. Stripes appear.' },
]);

lesson('b-hash2', 'Random numbers 2: the robust version (bits, shifts and xor)', 'Building the helpers',
  'Treat a number as 32 bits and scramble the bits with shifts, xor and multiplies. Learn binary, hex, >>, & and ^ as you go, then see where this version has limits too.', [
  { t: 'Why use whole-number maths?', x: `Last lesson's hash scrambles with **float** maths, which rounds, and rounds differently on different graphics cards. The robust fix is to scramble with **whole-number maths**: it is exact, there is no rounding, and every card gives the identical answer.

The price: you have to think of a number as a row of **bits**. This lesson explains bits, binary, hexadecimal, shifting and xor from scratch, then builds the hash in small steps. The studio's own \`hash11\`, \`hash21\`, \`hash22\`, \`hash31\` and \`hash33\` are built this way.

First, the finished function, tested on two inputs at once. The **left half** hashes the 4096 square ids from the last lesson. The **right half** hashes a *smooth* ramp, one slightly different number per pixel, which broke the simple hash. Both give static.`,
    new: [N('uint', 'uint', 'A whole number that can not be negative, stored in 32 bits. Maths on it is exact and wraps round on overflow, the same on every graphics card.')],
    try: 'Compare with the simple version: the right half used to be full of ripples.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  float id = cell.y * 64.0 + cell.x;
  vec2 px = floor(vUv * 512.0);
  float ramp = (px.y * 512.0 + px.x) / 262144.0;   // 0 to 1 in tiny steps, one per pixel
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? myHash(id) : myHash(ramp)), 1.0);
}` },
  { t: 'Bits, binary and hexadecimal', x: `Inside the computer every whole number is a row of **bits**, each 0 or 1. A \`uint\` has **32** of them. Each bit is a place worth double the one before: 1, 2, 4, 8, 16... So 13 is 8 + 4 + 1, written in **binary** as 1101.

Writing 32 bits out is long, so people group them in fours and write each group as one **hexadecimal** digit (0 to 9, then a to f for 10 to 15). \`0x7feb352d\` is just a whole number written that way (\`0x\` says "hex"), and the \`u\` on the end says "unsigned" (a \`uint\`).

The picture counts from 0 to 63 across the screen and shows, in each row, **one bit of that number**: the bottom row is the 1s place (it flips every column), the next is the 2s place (every two columns), then 4s, 8s... a binary counter.

The two new tools in the code: \`n >> k\` slides the bits **right by k places** (the lowest k bits fall off the end), and \`& 1u\` ("and") keeps only the lowest bit. Together, \`(n >> k) & 1u\` is "bit number k of n".`,
    new: [N('>>', 'n >> k', 'Shift the bits k places to the right. The lowest k bits fall off the end (same as dividing by 2 to the power k, rounding down).'), N('&', 'a & b', 'And: for every bit, 1 only if both bits are 1. n & 1u keeps just the lowest bit.')],
    try: 'Change 6.0 to 3.0 for three rows. Change 64.0 to 256.0 and you need 8 rows to see all the bits.',
    code: `void main() {
  uint n = uint(floor(vUv.x * 64.0));        // 0 ... 63 across the screen
  uint k = uint(floor(vUv.y * 6.0));         // which bit each row shows (0 = lowest)
  float on = float((n >> k) & 1u);
  gl_FragColor = vec4(vec3(on), 1.0);
}` },
  { t: 'Line 1: a float is 32 bits too', x: `\`floatBitsToUint(x)\` does **not** convert the number: it hands you the **32 bits the float is stored as**, read as a whole number. Every float, including negative and fractional ones, has its own bit pattern, so this works for **any input**.

Look at the **left half**: the lower 23 bits of the float (\`& 0x7fffffu\` keeps only those), shown as a grey. It is a set of smooth ramps: numbers that are close together have almost the same bits, so reading the bits has **not scrambled anything yet**. The right half is the finished hash.`,
    new: [N('floatBitsToUint', 'floatBitsToUint(x)', 'The 32 bits a float is stored as, read as a whole number (uint). Nothing is rounded or converted.')],
    try: 'Change 0x7fffffu to 0xffu to look at only the lowest 8 bits.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float x = (px.y * 512.0 + px.x) / 262144.0;
  uint h = floatBitsToUint(x);
  float stage = float(h & 0x7fffffu) / 8388608.0;
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? stage : myHash(x)), 1.0);
}` },
  { t: 'Line 3: multiply by a big odd number', x: `\`h *= 0x7feb352du\` multiplies the bits by a big number. If the answer doesn't fit in 32 bits the top simply **falls off and it wraps round**, exactly, every time. The constant is **odd**, so no information is lost: different inputs still give different outputs.

What multiplying accomplishes: a change in a **low** bit spreads to the **higher** bits (the same carrying you do in long multiplication). So the high bits of the answer are well mixed. But the **low** bits of the answer depend only on the low bits of the input, so they are still weak.

The left half is the result after just this multiply. It has changed from smooth ramps into fine diagonal-ish stripes, so it is mixed, but it still has a clear pattern. Multiplying alone can only push changes *upwards*.`,
    new: [N('0x7feb352du', '0x7feb352du', 'A whole number written in hexadecimal. The trailing u makes it a uint.')],
    try: 'Change the constant to 0x00000001u: the multiply does nothing and the left half goes back to smooth ramps.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float x = (px.y * 512.0 + px.x) / 262144.0;
  uint h = floatBitsToUint(x);
  h *= 0x7feb352du;
  float stage = float(h >> 8u) / 16777216.0;
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? stage : myHash(x)), 1.0);
}` },
  { t: 'Line 2: shift and xor', x: `\`h ^= h >> 16u\` does two things. \`h >> 16u\` slides every bit 16 places to the right: the **top 16 bits end up in the bottom 16** and the rest drop off. Then \`^\` is **xor** ("exclusive or"): for every bit, the answer is 1 where the two bits **differ** and 0 where they match. So \`^\` mixes two numbers bit by bit without losing anything.

Together: **the high bits get folded down onto the low bits**. That is exactly what a multiply can't do. After this line the low bits depend on the high bits, and the *next* multiply spreads that upward again.

The recipe is **fold down, spread up**. The left half now runs lines 2 and 3: xor-shift, then multiply.`,
    new: [N('^', 'a ^ b', 'Xor: for every bit, 1 if the two bits differ, 0 if they match. Works on whole numbers.')],
    try: 'Change 16u to 1u or 31u and see how much the left half changes.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float x = (px.y * 512.0 + px.x) / 262144.0;
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  float stage = float(h >> 8u) / 16777216.0;
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? stage : myHash(x)), 1.0);
}` },
  { t: 'Lines 4 to 6: do it again', x: `One round of fold-and-spread leaves traces, so the hash repeats it: **xor-shift, multiply, xor-shift, multiply, xor-shift**. The left half shows the result after the second multiply, which already looks like static; the last xor-shift (line 6) tidies the low bits that the final multiply left weak.

Where do the odd numbers (\`0x7feb352d\`, \`0x846ca68b\`, and the shifts 16, 15, 16) come from? They were **found by a computer**. Chris Wellons searched huge numbers of constants and measured, for each, whether flipping one input bit flips about **half** of the output bits (the "avalanche" property). This set scored best for this shape of function ("lowbias32"). You can't derive them, and you shouldn't change them in your own copy.`,
    try: 'Change one hex digit of a constant. Often it still looks fine to the eye, but the measured quality drops.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float x = (px.y * 512.0 + px.x) / 262144.0;
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  float stage = float(h >> 8u) / 16777216.0;
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? stage : myHash(x)), 1.0);
}` },
  { t: 'The last line: back to 0 to 1', x: `The hash result is a whole number from 0 to 4,294,967,295. A graphics float holds about **24 bits** of detail, so we keep the **top 24 bits** (\`h >> 8u\` drops the lowest 8) and divide by 2²⁴ = 16,777,216. The answer runs from 0 up to just below 1, evenly spread.

\`float(...)\` converts a whole number to a float. In the studio the scrambling lines are \`hashBits\` and this last line is \`hashToFloat\`.`,
    new: [N('float(x)', 'float(h)', 'Convert a whole number (int or uint) into a float.')],
    try: 'Change the divider 16777216.0 to 8388608.0 (half): the picture gets brighter and washes out above 1.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float x = (px.y * 512.0 - 100000.0 + px.x) * 37.0;   // any range works: negative and big numbers too
  gl_FragColor = vec4(vec3(myHash(x)), 1.0);
}` },
  { t: 'Two inputs, several outputs', x: `To hash a **position**, take the bits of **both** numbers, multiply each by a *different* big odd number so that (3, 5) and (5, 3) come out differently, **add** them into one whole number, and run it through the same scrambler. For a random **colour** (three numbers) hash once to get \`h\`, then hash \`h + 1u\` and \`h + 2u\`: different offset, different (but repeatable) number.

This is how the studio's \`hash21\`, \`hash22\` and \`hash33\` work. The \`uvec2\` below is a pair of \`uint\`s, one for x and one for y.`,
    try: 'Change the offsets 1u and 2u. Every cell stays a random colour, but a different one.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float toFloat(uint h) {
  return float(h >> 8u) / 16777216.0;
}
void main() {
  uvec2 b = floatBitsToUint(floor(vUv * 20.0));
  uint h = myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu);
  vec3 colour = vec3(toFloat(h), toFloat(myMix(h + 1u)), toFloat(myMix(h + 2u)));
  gl_FragColor = vec4(colour, 1.0);
}` },
  { t: 'Gotcha: the input decides the output', x: `A hash gives **equal answers for equal inputs**, and that includes inputs you didn't mean to be equal. A common mistake is to hash something like \`vUv.x + vUv.y\`. Every pixel on a diagonal line has the same x + y, so every pixel on that line gets the **same random number**, and you see **diagonal lines**.

The **left half** below does exactly that (with whole-number pixel coordinates, so it looks the same on every graphics card). There are only about a thousand different values of x + y on the whole screen, so the hash can produce only about a thousand different answers, no matter how good it is.

If you add the smooth \`vUv.x + vUv.y\` instead, you may see the lines **plus some noise in places**, and where the noise appears depends on your graphics card. Floats are packed more closely near zero, so in the bottom-left the rounding of the sum differs from pixel to pixel and breaks the lines up. That is a second effect on top of the first, and it is the reason the picture can look different on different machines.

The **right half** feeds in a different number for every pixel (the pixel's position in reading order) and is static. This is the hash working perfectly: **the pattern was in the input, not in the hash.**

To get one random number per pixel from two coordinates, use the two-input hash (\`hash21\`) on both, not the sum.`,
    try: 'Change (px.x + px.y) / 1024.0 to (px.x * 3.0 + px.y) / 1024.0: still lines, only steeper, because the input is still constant along lines.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 px = floor(vUv * 512.0);
  float perPixel = (px.y * 512.0 + px.x) / 262144.0;
  float diagonal = (px.x + px.y) / 1024.0;           // the same on every diagonal line
  gl_FragColor = vec4(vec3(vUv.x < 0.5 ? myHash(diagonal) : myHash(perPixel)), 1.0);
}` },
  { t: 'Shortcomings of this version', x: `No hash is perfect. Honestly, for this one:

**Cost.** It needs about twice as many operations as the simple version (a few shifts, xors and multiplies). That is still small next to a noise or an fbm, but it is not free.

**Needs integers.** Whole-number maths exists in WebGL2 / GLSL ES 3.00 (which the studio uses) but not in the oldest WebGL1 shaders.

**Float inputs must match exactly.** The hash reads the float's bits, so two numbers that differ in the very last bit give completely unrelated answers. If two places compute "the same" cell number by different routes (say \`floor(p)\` in one and \`p - fract(p)\` in another), a rounding difference can give them different random numbers and you see a seam. Also \`-0.0\` and \`0.0\` have different bits. Hashing whole numbers from \`floor\` is the safe path.

**Not for secrets.** It is built to look random, not to be unguessable.

**Tuned, not proved.** The constants were picked by measuring, and the studio checked the result on smooth ramps, whole numbers, negative numbers and big numbers against the older fract version. It looked like true random numbers in all of them, but "looks random on these tests" is the claim, nothing stronger.`,
    try: 'Open the Perf tab and compare the cost of hash21 with the simple myHash2 from the previous lesson.',
    code: `float myHash(float x) {
  uint h = floatBitsToUint(x);
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return float(h >> 8u) / 16777216.0;
}
void main() {
  vec2 cell = floor(vUv * 64.0);
  gl_FragColor = vec4(vec3(myHash(cell.y * 64.0 + cell.x)), 1.0);
}` },
]);

lesson('b-noise', 'Build noise from random numbers', 'Building the helpers',
  'Blocky random squares become smooth hills: pick a random value at each grid corner and blend between them. This is `noise`, built from scratch.', [
  { t: 'Start from random squares', x: `Noise is **random numbers placed on a grid, then blended smoothly**. Step one is the grid itself. We reuse the hash from the last lesson (named \`myHash2\` here) and give each cell a random grey. This is blocky, with hard jumps between neighbours; the next steps remove them.`,
    try: 'Change 8.0 to see bigger or smaller blocks.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 8.0;
  gl_FragColor = vec4(vec3(myHash2(floor(p))), 1.0);
}` },
  { t: 'Blend between the four corners', x: `Instead of one value per cell, think of a random value at each **corner** of the cell. A pixel in the middle should be a **mix** of the four corners around it, closer corners counting more.

\`floor(p)\` is the cell's corner (\`i\`), and \`fract(p)\` is how far across the cell we are (\`f\`, from 0 to 1). Mix along the bottom edge, mix along the top edge, then mix those two upwards. That is *bilinear interpolation*, and the whole thing is just three \`mix\` calls.

It is smooth now, but look closely: you can still see faint diamond shapes where cells meet.`,
    try: 'Zoom the preview and look for the diamond-shaped creases along the cell borders.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 8.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float bottom = mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x);
  float top = mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x);
  gl_FragColor = vec4(vec3(mix(bottom, top, f.y)), 1.0);
}` },
  { t: 'Ease the blend: the smooth curve', x: `The creases appear because a straight blend changes speed suddenly when you cross into the next cell. The fix is to **ease** the blend weight so it starts and ends gently: replace \`f\` with \`f * f * (3.0 - 2.0 * f)\`. That curve is exactly what \`smoothstep(0.0, 1.0, f)\` draws.

One line changes and the creases vanish.`,
    try: 'Comment out the line f = f * f * (3.0 - 2.0 * f); and compare.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 8.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float bottom = mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x);
  float top = mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x);
  gl_FragColor = vec4(vec3(mix(bottom, top, f.y)), 1.0);
}` },
  { t: 'Wrap it in a function', x: `Now put it in a function so you can call it with **any** position: \`myNoise(p)\`. This is the studio's \`noise\`, line for line. Calling it with \`p * 4.0\` and \`p * 16.0\` shows the one idea that matters most: **multiplying the input is zoom**. Bigger multiplier, more (smaller) blobs.

The left half uses 4, the right half uses 16.`,
    new: ['noise'], try: 'Change the 4.0 and 16.0.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
float myNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x),
             mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  float zoom = vUv.x < 0.5 ? 4.0 : 16.0;
  gl_FragColor = vec4(vec3(myNoise(vUv * zoom)), 1.0);
}` },
  { t: 'Noise in 3D', x: `Putting noise on a 3D object using \`vUv\` can stretch or leave seams. Using the **3D position** with a 3D noise avoids that. The idea is the same one dimension up: a random value at each **cube corner** (8 of them), and the blend runs along x, then y, then z: **seven** \`mix\` calls instead of three.

This is the studio's \`noise3\`. The two-line helper \`myHash3\` is the 3-input version of the hash.`,
    shape: true, new: ['noise3'], try: 'Change 4.0 to make the pattern finer.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash3(vec3 p) {
  uvec3 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu + b.z * 0xc2b2ae35u) >> 8u) / 16777216.0;
}
float myNoise3(vec3 p) {
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float x00 = mix(myHash3(i), myHash3(i + vec3(1.0, 0.0, 0.0)), f.x);
  float x10 = mix(myHash3(i + vec3(0.0, 1.0, 0.0)), myHash3(i + vec3(1.0, 1.0, 0.0)), f.x);
  float x01 = mix(myHash3(i + vec3(0.0, 0.0, 1.0)), myHash3(i + vec3(1.0, 0.0, 1.0)), f.x);
  float x11 = mix(myHash3(i + vec3(0.0, 1.0, 1.0)), myHash3(i + vec3(1.0, 1.0, 1.0)), f.x);
  return mix(mix(x00, x10, f.y), mix(x01, x11, f.y), f.z);
}
void main() {
  float n = myNoise3(vPos * 4.0);
  gl_FragColor = finish(vec3(n), 1.0);
}` },
]);

lesson('b-fbm', 'Build fbm: layered noise', 'Building the helpers',
  'One layer of noise looks like soft clouds. Stack several, each finer and fainter, and you get clouds, rock and terrain. That stack is `fbm`.', [
  { t: 'Two layers by hand', x: `Real surfaces have big shapes **and** small details. One noise has only one size. So add a second layer at **twice the zoom** and **half the strength**, then add them together. Big blobs now carry fine wrinkles.

(\`myNoise\` is the noise you built in the last lesson.)`,
    try: 'Change the 0.5 to 1.0: the fine layer takes over.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
float myNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x),
             mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  vec2 p = vUv * 4.0;
  float n = myNoise(p) + 0.5 * myNoise(p * 2.0);
  gl_FragColor = vec4(vec3(n / 1.5), 1.0);
}` },
  { t: 'Put the layers in a loop', x: `Writing every layer out gets long. Instead, **loop**: each time round, add a layer, then **double the zoom** (\`p *= 2.0\`) and **halve the strength** (\`amp *= 0.5\`). Each layer is called an *octave*, because each is twice the frequency of the one before.

\`for (int i = 0; i < 5; i++)\` reads: start a whole number \`i\` (an \`int\`, a whole-number type, unlike \`float\`) at 0, repeat while it is below 5, add one each time round. The loop runs 5 times. Count the \`myNoise\` calls: each octave costs one, so fbm is **five times** the price of a single noise. Remember that for the optimisation lessons.`,
    new: ['for', 'int'], try: 'Change 5 to 2, then 8. More octaves, more detail, more cost.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
float myNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x),
             mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
float myFbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 5; i++) {
    sum += amp * myNoise(p);
    p *= 2.0;
    amp *= 0.5;
  }
  return sum;
}
void main() {
  gl_FragColor = vec4(vec3(myFbm(vUv * 4.0)), 1.0);
}` },
  { t: 'Normalise, and avoid lining up', x: `Two small fixes make it match the studio's \`fbm\`.

**1. The sum is too bright.** Five layers add up to at most 0.5 + 0.25 + 0.125 + 0.0625 + 0.03125 = **0.96875**, so dividing by that keeps the answer within 0 to 1.

**2. The layers line up.** With an exact 2.0 zoom, every layer's cell borders sit on the previous layer's, which can show faint grid lines. Using **2.03** and **shifting each layer** a bit (\`+ vec2(17.1, 9.2)\`) breaks the alignment.`,
    new: ['fbm'], try: 'Change 2.03 back to 2.0 and look hard for faint straight lines.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
float myNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x),
             mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
float myFbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 5; i++) {
    sum += amp * myNoise(p);
    p = p * 2.03 + vec2(17.1, 9.2);
    amp *= 0.5;
  }
  return sum / 0.96875;
}
void main() {
  gl_FragColor = vec4(vec3(myFbm(vUv * 4.0)), 1.0);
}` },
  { t: 'Variations: ridges and billows', x: `Because fbm is just a number from 0 to 1, you can reshape it. **\`abs(n * 2.0 - 1.0)\`** folds it around the middle into sharp creases (like mountain ridges or lightning); **\`1.0 - \`** that flips the creases into bright veins.

You are not limited to the helper as it comes. Almost every stone, marble and cloud shader is **fbm plus one reshaping line**.`,
    new: ['abs'], try: 'Replace the last line with: float v = n; (no folding) and compare.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
float myNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(myHash2(i), myHash2(i + vec2(1.0, 0.0)), f.x),
             mix(myHash2(i + vec2(0.0, 1.0)), myHash2(i + vec2(1.0, 1.0)), f.x), f.y);
}
float myFbm(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 5; i++) {
    sum += amp * myNoise(p);
    p = p * 2.03 + vec2(17.1, 9.2);

  }

}
void main() {
  float n = myFbm(vUv * 3.0);
  float veins = 1.0 - abs(n * 2.0 - 1.0);
