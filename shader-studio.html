lesson('patterns', 'Repeating patterns: stripes, checkers, bricks', 'Beginner',
  'The fract / floor trick that cuts space into tiles, then mod, random numbers (hash21) and min to make stripes, checkerboards and bricks.', [
  { t: 'fract: a ramp that restarts', x: `You met [[fract]](x) in lesson 2: it keeps only the decimals (1.7 becomes 0.7, 4.0 becomes 0.0). Feed it a number that keeps growing and you get a **0 to 1 ramp that restarts over and over**. \`vUv.x * 5.0\` grows from 0 to 5 across the picture, so we get five ramps. This is the most useful trick in pattern making.`,
    new: ['fract'], try: 'Change 5.0 to 2.0 or 10.0.',
    code: `void main() {
  float f = fract(vUv.x * 5.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}` },
  { t: 'Stripes', x: `A ramp that repeats, cut with \`step\` (which you know): below 0.5 gives 0, from 0.5 up gives 1. That's **hard stripes**: half black, half white, five times.

Change the \`0.5\` to change the stripe thickness, change the \`5.0\` to change how many.`,
    try: 'Use vUv.y for horizontal stripes, or (vUv.x + vUv.y) for diagonal ones.',
    code: `void main() {
  float s = step(0.5, fract(vUv.x * 5.0));
  vec3 col = mix(vec3(0.1, 0.15, 0.3), vec3(0.95, 0.85, 0.5), s);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'floor: which stripe am I in?', x: `[[floor]](x) is the other half: it **rounds down** to the whole number, 1.7 becomes 1.0, 4.9 becomes 4.0. Where \`fract\` tells you *where inside* the stripe you are, \`floor\` tells you *which* stripe.

Dividing by 5 at the end squeezes the whole numbers 0, 1, 2, 3, 4 into 0 to 0.8, so you can see them: a **staircase** with five flat steps.`,
    new: ['floor'], try: 'Replace 5.0 with 10.0 (both places).',
    code: `void main() {
  float step5 = floor(vUv.x * 5.0) / 5.0;
  gl_FragColor = vec4(vec3(step5), 1.0);
}` },
  { t: 'Cut space into cells', x: `Do both at once, on a 2D position. We scale by 6 so there are six cells across, then:

\`floor(g)\` is **which cell** you are in: (0,0), (1,0), (2,0)...
\`fract(g)\` is **where inside that cell**, from 0 to 1 in x and y.

The picture shows \`f\` as red and green: each cell contains a small copy of the red-green square from the \`vUv\` lesson. These two values are the basis of grids, tiles, bricks and per-tile randomness.`,
    try: 'Change 6.0 to 3.0 for fewer, bigger cells.',
    code: `void main() {
  vec2 g = vUv * 6.0;
  vec2 cell = floor(g);
  vec2 f = fract(g);
  gl_FragColor = vec4(f.x, f.y, 0.0, 1.0);
}` },
  { t: 'mod: checkerboard', x: `[[mod]](a, b) is the **remainder** after dividing a by b: mod(5.0, 2.0) is 1.0, mod(6.0, 2.0) is 0.0. With b = 2 it flips between 0 and 1: **even, odd, even, odd**.

Add the cell's x and y numbers together and take mod 2: neighbouring cells always differ by one, so they alternate like a chessboard.`,
    new: ['mod'], try: 'Change 8.0 to 3.0 or 20.0.',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  float c = mod(cell.x + cell.y, 2.0);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'hash21: a random number per cell', x: `[[hash21]] takes a position (vec2) and gives back a **random-looking number between 0 and 1**. The same input always gives the same answer, but a slightly different input gives a completely unrelated one.

Feed it the **cell number** (the whole numbers from \`floor\`) and every cell gets its own steady random grey. Remember: each pixel computes this alone, but pixels in the same cell have the same \`cell\` so they agree.`,
    new: ['hash21'], try: 'Try 4.0 and 40.0 for different cell sizes.',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  float r = hash21(cell);
  gl_FragColor = vec4(vec3(r), 1.0);
}` },
  { t: 'Random colour per cell', x: `Three random numbers make a random colour. We shift the cell number by a different amount for each of r, g, b (\`cell + 1.0\` adds 1 to both parts) so that the three values are different from each other.

The result is a patchwork of random colours. Nothing here is new: it is \`hash21\` three times.`,
    try: 'Multiply the colour by 0.5 to darken it: vec4(col * 0.5, 1.0).',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  vec3 col = vec3(hash21(cell), hash21(cell + 1.0), hash21(cell + 2.0));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'min: the smaller of two numbers', x: `[[min]](a, b) gives back **whichever is smaller**. Why is that useful? Take \`f\` (0 to 1 inside a cell). Its distance to the *left* edge is \`f\`, and to the *right* edge is \`1.0 - f\`. The distance to the **nearest** side is the smaller of the two.

The result goes 0, up to 0.5 in the middle, back down to 0: a triangle wave, zero at every cell border.`,
    new: ['min'], try: 'Multiply by 2.0 so the peak is white: vec3(edge * 2.0).',
    code: `void main() {
  float f = fract(vUv.x * 4.0);
  float edge = min(f, 1.0 - f);
  gl_FragColor = vec4(vec3(edge), 1.0);
}` },
  { t: 'Grid lines', x: `Do it for x **and** y, and take the \`min\` of those too: \`edge\` is now the distance to the **nearest border in any direction**, 0 on every grid line and bigger towards the cell centres.

Cut it with \`smoothstep\` (0.0 to 0.06): the pixels very close to a border come out dark, everything else bright. **Grid lines**, from a distance and a smoothstep.`,
    try: 'Change 0.06 for thicker or thinner lines.',
    code: `void main() {
  vec2 f = fract(vUv * 6.0);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float line = smoothstep(0.0, 0.06, edge);
  gl_FragColor = vec4(vec3(line), 1.0);
}` },
  { t: 'Bricks: shift every other row', x: `Bricks are a grid where every second row is slid half a brick sideways. We find the row number with \`floor(g.y)\`, and for **odd rows** (\`mod(row, 2.0)\` is 1) we add 0.5 to x. The 8 and 16 make each brick twice as wide as tall.

The rest is the grid-lines recipe: the border distance (\`edge\`), smoothstep for the mortar, \`hash21\` to vary each brick's colour a little, and \`mix\` to put mortar and brick together.`,
    try: 'Change the brick colour vec3(0.7, 0.3, 0.2), or 8.0 / 16.0.',
    code: `void main() {
  vec2 g = vec2(vUv.x * 8.0, vUv.y * 16.0);
  float row = floor(g.y);
  g.x = g.x + 0.5 * mod(row, 2.0);
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float brick = smoothstep(0.03, 0.08, edge);
  vec3 clay = vec3(0.7, 0.3, 0.2) * (0.7 + 0.5 * hash21(cell));
  gl_FragColor = vec4(mix(vec3(0.8), clay, brick), 1.0);
}` },
  { t: 'Make it move', x: `Animation is the same as always: **add \`uTime\` to the coordinate before cutting it up**. Here one line is added: \`g.x\` also moves by \`uTime * 0.4\`. Every later step uses \`g\`, so the whole wall slides. Watch it slide.`,
    try: 'Make odd and even rows move in opposite directions: add uTime * 0.4 only when mod(row, 2.0) is 1 by changing the multiply.',
    code: `void main() {
  vec2 g = vec2(vUv.x * 8.0, vUv.y * 16.0);
  float row = floor(g.y);
  g.x = g.x + 0.5 * mod(row, 2.0) + uTime * 0.4;
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float brick = smoothstep(0.03, 0.08, edge);
  vec3 clay = vec3(0.7, 0.3, 0.2) * (0.7 + 0.5 * hash21(cell));
  gl_FragColor = vec4(mix(vec3(0.8), clay, brick), 1.0);
}` },
]);

lesson('noise', 'Noise: natural randomness', 'Beginner',
  'Smooth random patterns for clouds, rock and terrain: noise, fbm, voronoi, and working in 3D with vPos.', [
  { t: 'Random is not enough', x: `Last lesson, \`hash21\` gave a random number per cell: sharp squares, no relation to each other. Making it finer (more, smaller cells) gives **static**, like a TV with no signal. Real things (clouds, dirt, wood) are random *but smooth*: nearby points are similar.`,
    try: 'Change 40.0 to 6.0 (big squares) and to 200.0 (static).',
    code: `void main() {
  float r = hash21(floor(vUv * 40.0));
  gl_FragColor = vec4(vec3(r), 1.0);
}` },
  { t: 'noise: smooth random', x: `[[noise]](p) gives a **smooth random number between 0 and 1** for a position. Nearby positions give similar values, so you get soft random blobs. The number you multiply \`vUv\` by is how many blobs fit across: 8.0 means about 8 blobs.

It is the base of clouds, dirt, stains and wood.`,
    new: ['noise'], try: 'Change 8.0 to 3.0 (a few big blobs) and to 30.0.',
    code: `void main() {
  float n = noise(vUv * 8.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'fbm: noise with detail', x: `[[fbm]] (fractal noise) adds several layers of noise on top of each other: each layer twice as detailed and half as strong. You get big blobs **plus** smaller bumps, **plus** fine grain, which looks a lot more natural than plain noise.

It's used exactly the same way: \`fbm(p)\` gives a number from 0 to 1 for a position.`,
    new: ['fbm'], try: 'Compare with the previous step: same number, much more detail.',
    code: `void main() {
  float n = fbm(vUv * 8.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'Animate noise', x: `You already know how to move things: **add \`uTime\` to the position**. Here only x is shifted over time (the vec2 is x, then y = 0), so the noise slides sideways. If you also change y, it drifts diagonally; **if you add time in a way that changes the pattern** instead of sliding it, you get "boiling" shapes like fire or clouds.`,
    try: 'Slide it in y instead: vec2(0.0, uTime * 0.3).',
    code: `void main() {
  float n = fbm(vUv * 8.0 + vec2(uTime * 0.3, 0.0));
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'Noise as a mask', x: `Noise is just a 0 to 1 number, so everything from the shapes lesson works on it. Cut it with \`smoothstep\` to get a **mask**, then \`mix\` two colours with the mask:
below 0.45 is water, above 0.55 is land, and in between a soft shore. A map with three lines of code.`,
    try: 'Change 0.45 and 0.55 (move them both up for less land). Change the colours.',
    code: `void main() {
  float n = fbm(vUv * 6.0);
  float land = smoothstep(0.45, 0.55, n);
  vec3 col = mix(vec3(0.1, 0.3, 0.7), vec3(0.3, 0.7, 0.3), land);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'voronoi: cells', x: `[[voronoi]] scatters a random point in every cell of a grid and, for each pixel, finds the **nearest point**. It returns a vec3, and we take its first part \`.x\`: the **distance to the nearest point**.

Result: dark at every point, brighter away from it, a *pattern of cells* like stones, scales, cracked mud or water caustics.`,
    new: ['voronoi'], try: 'Change 6.0 to get more or fewer cells.',
    code: `void main() {
  float d = voronoi(vUv * 6.0).x;
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'voronoi: cell borders', x: `The second part of the result, \`.y\`, is the **distance to the nearest border between two cells** (0 on the border, bigger inside). Cut it with \`smoothstep\` exactly like grid lines: dark thin lines between cells.

\`.x\` and \`.y\` are the same x/y slots you already know, here on a vec3 the **function** returned.`,
    try: 'Change 0.08 for thicker or thinner cracks.',
    code: `void main() {
  float border = voronoi(vUv * 6.0).y;
  float line = smoothstep(0.0, 0.08, border);
  gl_FragColor = vec4(vec3(line), 1.0);
}` },
  { t: '3D: the seam problem', x: `So far we used \`vUv\` which is a flat sheet. On a **sphere** it gets wrapped round, and where the left edge meets the right edge, the noise doesn't match: **a visible seam**. Spin the shape in the big preview and look for the vertical line. (This picture is also on a sphere.)`,
    shape: true, try: 'Drag the sphere around to find the seam.',
    code: `void main() {
  float n = fbm(vUv * 8.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'vPos and fbm3: noise with no seam', x: `[[vPos]] is the pixel's **3D position** on the object, (x, y, z). [[fbm3]] is fbm for a 3D position. Because every point of the sphere has a position in 3D space, the noise is continuous everywhere: **no seam**.

Use \`vUv\` for patterns that belong on a flat face (bricks, stripes), \`vPos\` with the 3D noise functions for natural materials (rock, marble, planets).`,
    new: ['vPos', 'fbm3'], shape: true, try: 'Change 3.0 to get bigger or smaller blobs.',
    code: `void main() {
  float n = fbm3(vPos * 3.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
], false);

lesson('colour', 'Colour: ramps, palettes and tone', 'Beginner',
  'Gradients and multi-colour ramps, then pow, palette, hsv2rgb and luma for shaping and choosing colours.', [
  { t: 'A gradient from two colours', x: `You met \`mix\`; with a coordinate as \`t\`, the colour fades from a to b. \`mix\` works on the three parts together, so colours behave just like numbers.`,
    try: 'Change the two colours.',
    code: `void main() {
  vec3 a = vec3(0.05, 0.1, 0.35);
  vec3 b = vec3(1.0, 0.6, 0.3);
  vec3 col = mix(a, b, vUv.y);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Shape the ramp', x: `\`t\` doesn't have to be the raw coordinate. With \`smoothstep(0.3, 0.7, y)\` the bottom third stays pure a, the top third is pure b, and the change happens in the middle. Anything you can do to a number, you can do to \`t\`.

Click the \`float t\` line and look at the line preview on the right: that's the curve itself.`,
    try: 'Change 0.3 and 0.7 to 0.0 and 1.0, or to 0.45 and 0.55.',
    code: `void main() {
  vec3 a = vec3(0.05, 0.1, 0.35);
  vec3 b = vec3(1.0, 0.6, 0.3);
  float t = smoothstep(0.3, 0.7, vUv.y);
  gl_FragColor = vec4(mix(a, b, t), 1.0);
}` },
  { t: 'pow: bend a number', x: `[[pow]](x, p) raises x to the power p. For x between 0 and 1: **p above 1 pushes values down** (the middle gets darker, 0 and 1 stay put), **p below 1 pushes them up**. The ramp below bends so that the colour change happens late.

Try it on any 0 to 1 value you don't like the feel of.`,
    new: ['pow'], try: 'Change 3.0 to 0.3 to bend it the other way.',
    code: `void main() {
  vec3 a = vec3(0.05, 0.1, 0.35);
  vec3 b = vec3(1.0, 0.6, 0.3);
  float t = pow(vUv.y, 3.0);
  gl_FragColor = vec4(mix(a, b, t), 1.0);
}` },
  { t: 'Three colours', x: `Chain two \`mix\` calls. First blend a to b with a \`smoothstep\` that handles the lower half; then blend *that result* with c using a second \`smoothstep\` for the upper half. This is how sunsets, skies and fire gradients are made.`,
    try: 'Change the middle colour b.',
    code: `void main() {
  vec3 a = vec3(0.02, 0.03, 0.15);
  vec3 b = vec3(0.9, 0.3, 0.25);
  vec3 c = vec3(1.0, 0.85, 0.5);
  vec3 col = mix(a, b, smoothstep(0.0, 0.5, vUv.y));
  col = mix(col, c, smoothstep(0.5, 1.0, vUv.y));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'palette: a whole colour scheme from numbers', x: `Choosing colours by hand is hard. [[palette]](t, a, b, c, d) makes a smooth rainbow-like ramp from four vec3 numbers: it computes \`a + b * cos(TAU * (c * t + d))\`, a wave per colour channel.

**a** is the average colour, **b** the amount of swing, **c** how fast each channel cycles, **d** where each channel starts. The four values here give the classic rainbow. You don't need to understand the formula, just change numbers and see.`,
    new: ['palette'], try: 'Change the last vec3 to vec3(0.0, 0.1, 0.2) for a blue/orange scheme.',
    code: `void main() {
  vec3 col = palette(vUv.x, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'hsv2rgb: pick colours like a painter', x: `RGB is awkward when you think "a bit more blue-green". [[hsv2rgb]] takes **hue** (which colour, 0 to 1 round the colour wheel), **saturation** (0 grey, 1 vivid) and **value** (0 black, 1 bright) and gives back an RGB colour.

Here hue goes across, saturation goes up, value is full.`,
    new: ['hsv2rgb'], try: 'Replace vUv.y with 1.0 for the pure rainbow, or put it in the last slot to dim it.',
    code: `void main() {
  vec3 col = hsv2rgb(vec3(vUv.x, vUv.y, 1.0));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'luma: how bright does it look?', x: `[[luma]](colour) is **how bright a colour looks to the eye** (green counts for much more than blue). \`vec3(luma(col))\` is the grey version of the colour.

\`mix(grey, col, amount)\` then blends between grey (amount 0) and the colour (1). Above 1 *over-saturates*. Here the amount goes from 0 at the bottom (grey) to 2 at the top (extra vivid).`,
    new: ['luma'], try: 'Replace vUv.y * 2.0 with 0.0 for a full greyscale version.',
    code: `void main() {
  vec3 col = palette(vUv.x, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  vec3 grey = vec3(luma(col));
  col = mix(grey, col, vUv.y * 2.0);
  gl_FragColor = vec4(col, 1.0);
}` },
]);

lesson('dirs', 'Directions, angles and the dot product', 'Intermediate',
  'normalize, dot, max and atan: the vector tools that lighting and radial patterns are built from.', [
  { t: 'normalize: keep the direction, drop the length', x: `A vec2 has two properties: a **direction** it points, and a **length**. [[normalize]](v) gives you a vector pointing the **same way but with length exactly 1**. Lots of things need "just the direction": which way a surface faces, where the light comes from.

The picture shows the direction of every pixel as seen from the middle. A direction has parts between -1 and 1, so we squash it into colour range with \`* 0.5 + 0.5\` (the same trick as with \`sin\`).`,
    new: ['normalize'], try: 'The four directions each get their own colour: right is red-ish, up is green-ish.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  vec2 dir = normalize(p);
  gl_FragColor = vec4(dir * 0.5 + 0.5, 0.5, 1.0);
}` },
  { t: 'dot: how much do two directions agree?', x: `[[dot]](a, b) is a single number that says **how much two vectors point the same way**. For two directions (length 1): **1** = identical, **0** = at right angles, **-1** = opposite.

Here every pixel's position is compared with a fixed direction (pointing right and a bit up). Pixels far along that direction are bright, those behind are dark, with the middle line at 0. (The \`* 0.5 + 0.5\` shows the negative side too.) **Light brightness is exactly this**: the surface direction compared with the light direction.`,
    new: ['dot'], try: 'Change vec2(1.0, 0.5) to vec2(0.0, 1.0): now it measures "how far up".',
    code: `void main() {
  vec2 p = (vUv - 0.5) * 2.0;
  vec2 dir = normalize(vec2(1.0, 0.5));
  float s = dot(p, dir);
  gl_FragColor = vec4(vec3(s * 0.5 + 0.5), 1.0);
}` },
  { t: 'max: cut off the negative part', x: `[[max]](a, b) gives the **larger** of two numbers. \`max(s, 0.0)\` means "s, but never below 0": it clips off the negative side. In the last picture the dark half was negative; with \`max\` it becomes plain 0 (black) and only the part that agrees with the direction stays.

You'll use this for light: the side of an object facing away from the light must be 0 (no light), not negative.`,
    new: ['max'], try: 'Replace 0.0 with 0.5 to raise the floor.',
    code: `void main() {
  vec2 p = (vUv - 0.5) * 2.0;
  vec2 dir = normalize(vec2(1.0, 0.5));
  float s = max(dot(p, dir), 0.0);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'atan: the angle around the middle', x: `Any position can also be described as **an angle around the middle and a distance from it**. [[atan]](y, x) gives the angle in *radians* from the right-hand direction, between about -3.14 and 3.14. Dividing by \`TAU\` (a built-in number, 6.28, one full turn) makes it -0.5 to 0.5, and adding 0.5 makes it 0 to 1 all the way round.

Angle turns into a grey: a sweep like a radar.`,
    new: ['atan', 'TAU'], try: 'Multiply the angle by 4.0 before showing it (inside the vec3) and watch it repeat 4 times.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float a = atan(p.y, p.x) / TAU + 0.5;
  gl_FragColor = vec4(vec3(a), 1.0);
}` },
  { t: 'Angle and distance together', x: `Use the angle as the **hue** and the distance to darken: a colour wheel. Polar thinking (angle + distance) is how you make stars, flowers, spirals and radial patterns: any time the pattern repeats *around* a point instead of across.`,
    try: 'Change 1.0 - d * 1.5 to 1.0 for a flat colour wheel.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float a = atan(p.y, p.x) / TAU + 0.5;
  float d = length(p);
  vec3 col = hsv2rgb(vec3(a, 0.8, 1.0 - d * 1.5));
  gl_FragColor = vec4(col, 1.0);
}` },
]);

lesson('light', 'How lighting works, built by hand', 'Intermediate',
  'Surface normals, diffuse light, ambient light, shiny highlights and rim light, written out yourself so finish() is no longer magic.', [
  { t: 'The surface normal', x: `Lighting is about **which way the surface faces**. The **normal** is an arrow of length 1 pointing straight out of the surface; [[surfNormal]]() gives you the normal of the pixel's bit of surface. Its x, y, z run -1 to 1, so \`* 0.5 + 0.5\` squeezes it into colour range.

Red = faces right, green = faces up, blue = faces towards you. This picture is on the 3D shape: orbit it in the preview.`,
    new: ['surfNormal'], shape: true, try: 'Change the shape in the preview: a cube has flat sides, so each side is one flat colour.',
    code: `void main() {
  vec3 n = surfNormal();
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}` },
  { t: 'Diffuse light: dot with the light direction', x: `[[uLightDir]] is a built-in arrow (length 1) pointing **towards the sun**. You can move the sun in the Scene tab. How much a surface is lit is how much its normal agrees with the light direction: that's \`dot(n, uLightDir)\`. \`max(..., 0.0)\` cuts off the negative part, so the shaded side is simply 0.

This one line is the classic **diffuse** (Lambert) lighting.`,
    new: ['uLightDir'], shape: true, try: 'Open the Scene tab and move the sun with the sliders.',
    code: `void main() {
  vec3 n = surfNormal();
  float diff = max(dot(n, uLightDir), 0.0);
  gl_FragColor = vec4(vec3(diff), 1.0);
}` },
  { t: 'Surface colour and ambient light', x: `Multiply the light by a colour (the **albedo**, the colour of the surface itself) and the grey becomes orange. But the shaded side is pitch black, and in real life light bounces everywhere. So we add a base level, **ambient light**.

[[uAmbSky]] and [[uAmbGround]] are the colour of the light from above and from below; \`mix\` picks between them by the normal's up/down part (\`n.y\`, squashed to 0 to 1). [[uLightCol]] is the colour of the sun. Total light = ambient + sun × diffuse.`,
    new: ['uAmbSky', 'uAmbGround', 'uLightCol'], shape: true, try: 'Change the albedo vec3(0.9, 0.5, 0.3) to a colour you like.',
    code: `void main() {
  vec3 n = surfNormal();
  float diff = max(dot(n, uLightDir), 0.0);
  vec3 amb = mix(uAmbGround, uAmbSky, n.y * 0.5 + 0.5);
  vec3 light = amb + uLightCol * diff;
  vec3 albedo = vec3(0.9, 0.5, 0.3);
  gl_FragColor = vec4(albedo * light * 0.85, 1.0);
}` },
  { t: 'A shiny highlight', x: `Shiny things show the light as a bright spot where the surface mirrors the sun into your eye. [[viewDir]]() is the direction from the surface towards the camera. The **half vector** is halfway between the light direction and the view direction (add them, then \`normalize\`). When the normal lines up with it, you see the glint.

\`pow(..., 60.0)\` makes the spot small: bigger power = smaller, sharper highlight. The highlight is **added** on top (it's reflected light, not tinted by the surface).`,
    new: ['viewDir'], shape: true, try: 'Change 60.0 to 10.0 (a broad glow) or 300.0 (a pin-prick).',
    code: `void main() {
  vec3 n = surfNormal();
  vec3 v = viewDir();
  float diff = max(dot(n, uLightDir), 0.0);
  vec3 amb = mix(uAmbGround, uAmbSky, n.y * 0.5 + 0.5);
  vec3 h = normalize(uLightDir + v);
  float spec = pow(max(dot(n, h), 0.0), 60.0);
  vec3 albedo = vec3(0.9, 0.5, 0.3);
  vec3 col = albedo * (amb + uLightCol * diff) * 0.85 + uLightCol * spec * 0.6;
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Rim light with fresnel', x: `At glancing angles every surface gets more reflective (look at a lake at your feet vs far away). [[fresnel]](n, v, power) is **0 where you look straight at the surface and rises to 1 at the silhouette**. Used as a mask for a bluish glow, it gives the classic soft rim. Higher power = thinner rim.`,
    new: ['fresnel'], shape: true, try: 'Change 3.0 to 1.0 (a wide rim) or 8.0 (a thin one).',
    code: `void main() {
  vec3 n = surfNormal();
  vec3 v = viewDir();
  float diff = max(dot(n, uLightDir), 0.0);
  vec3 amb = mix(uAmbGround, uAmbSky, n.y * 0.5 + 0.5);
  vec3 albedo = vec3(0.9, 0.5, 0.3);
  vec3 col = albedo * (amb + uLightCol * diff) * 0.85;
  col = col + vec3(0.4, 0.6, 1.0) * fresnel(n, v, 3.0) * 0.5;
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Let finish() do all of that', x: `[[finish]](colour, alpha) does the lighting for you: ambient, sun, plus extras. In normal shaders you only decide the **albedo** (surface colour) and call \`finish\` on the last line.

Two extra settings you can assign before calling it: [[gShine]] (0 to 1, how bright the highlight is) and [[gRough]] (how wide it is, lower = tighter). Writing your own lighting, as we just did, is only needed for unusual looks (toon shading, custom rims).`,
    new: ['finish', 'gShine', N('gRough', 'float gRough', 'How wide and dull the highlight is: 0 is small and hard, 1 is wide and soft.')], shape: true, try: 'Set gShine to 0.0 for a matte look, or gRough to 0.8.',
    code: `void main() {
  vec3 albedo = vec3(0.9, 0.5, 0.3);
  gShine = 1.0;
  gRough = 0.3;
  gl_FragColor = finish(albedo, 1.0);
}` },
], true);

lesson('bump', 'Bump maps: fake surface detail', 'Intermediate',
  'How a grey height picture becomes dents and bumps; strength, shine, and combining it with colour.', [
  { t: 'The idea: a bump map is a grey height picture', x: `Real bumps would need millions of triangles. A **bump map** fakes them: you give a **height** for every point (white = high, black = low) and the shader tilts the **normal** (lesson 9) according to the *slope* of that height. Lighting then reacts as if there were bumps, but the silhouette stays smooth.

So a bump map is just a greyscale picture: any number from 0 to 1 works (noise, stripes, bricks...). Here is such a height by itself. It shows as a flat grey pattern with no depth, because the lighting doesn't know about it yet.`,
    shape: true, try: 'Change 6.0 to get bigger or smaller lumps.',
    code: `void main() {
  float h = fbm3(vPos * 6.0);
  gl_FragColor = vec4(vec3(h), 1.0);
}` },
  { t: 'bumpFromHeight: height becomes a normal', x: `[[bumpFromHeight]](h, strength) measures how steeply the height changes across the screen and tilts the normal against the slope. Three things to do:

**1.** store the result in [[gNormal]] (the normal \`finish\` will use),
**2.** set [[gHasN]] to 1.0 to tell \`finish\` "use my normal",
**3.** use \`finish\` for the final colour (so lighting is applied).

The sphere now looks lumpy, but its outline is still perfectly round.`,
    new: ['bumpFromHeight', 'gNormal', N('gHasN', 'float gHasN', 'Set it to 1.0 to tell finish() to use your gNormal instead of the real surface normal.')], shape: true, try: 'Change 0.08 (the strength) to 0.01 and then to 0.3.',
    code: `void main() {
  float h = fbm3(vPos * 6.0);
  gNormal = bumpFromHeight(h, 0.08);
  gHasN = 1.0;
  gl_FragColor = finish(vec3(0.7), 1.0);
}` },
  { t: 'A slider for the strength: uniform', x: `The strength is a number you'll want to tweak. A line starting with \`uniform\` at the top creates a **control**: \`uniform float uBump;\` gives a slider in the **Uniforms** tab. The comment after it sets the starting value and the range: \`// 0.08 [0, 0.3]\`.

Use \`uBump\` like any other number (it's a uniform, so every pixel gets the same value). Typical strengths in this studio: 0.03 to 0.15.`,
    new: [N('uniform', 'uniform float uName; // 0.5 [0, 2]', 'A number you can change with a slider in the Uniforms tab. The comment gives the start value and [min, max].')],
    shape: true, try: 'Open the Uniforms tab and drag the slider.',
    code: `uniform float uBump; // 0.08 [0, 0.3]
void main() {
  float h = fbm3(vPos * 6.0);
  gNormal = bumpFromHeight(h, uBump);
  gHasN = 1.0;
  gl_FragColor = finish(vec3(0.7), 1.0);
}` },
  { t: 'Shine shows bumps best', x: `A matte surface hides bumps; a shiny surface lets the highlight wobble over them. Set \`gShine\` above 0 before \`finish\` to get a highlight, and a lower \`gRough\` for a tighter one. Wet, polished or plastic things want shine and low roughness; dry rock wants little.`,
    shape: true, try: 'Set gShine = 0.0 and look at how the bumps hide.',
    code: `uniform float uBump; // 0.08 [0, 0.3]
void main() {
  float h = fbm3(vPos * 6.0);
  gNormal = bumpFromHeight(h, uBump);
  gHasN = 1.0;
  gShine = 1.0;
  gRough = 0.25;
  gl_FragColor = finish(vec3(0.2, 0.55, 0.45), 1.0);
}` },
  { t: 'Let the height colour the surface too', x: `The same height can drive the colour. \`mix(dark, light, h)\` makes low parts darker. And multiplying by \`0.5 + 0.5 * h\` darkens the low areas even more: crevices get less light in real life, so this makes the surface read as truly deep. **Colour and bump should agree**, otherwise it looks like a printed photo.`,
    shape: true, try: 'Remove the "col = col * ..." line and compare.',
    code: `void main() {
  float h = fbm3(vPos * 6.0);
  gNormal = bumpFromHeight(h, 0.08);
  gHasN = 1.0;
  vec3 col = mix(vec3(0.2, 0.17, 0.15), vec3(0.65, 0.58, 0.5), h);
  col = col * (0.5 + 0.5 * h);
  gl_FragColor = finish(col, 1.0);
}` },
  { t: 'A designed height: bricks', x: `The height can be any pattern you can make. Take the brick pattern from the patterns lesson: the border distance \`edge\` is 0 in the mortar and rises to flat brick, \`smoothstep\` makes the brick edge rounded: that is the height. A little \`fbm\` adds grain. **Design the height as a picture first, then plug it into \`bumpFromHeight\`.** The same \`brick\` value also colours the mortar.`,
    shape: true, try: 'Change 0.6 (the brick height) to 1.5 for deeper mortar.',
    code: `void main() {
  vec2 g = vec2(vUv.x * 8.0, vUv.y * 16.0);
  g.x = g.x + 0.5 * mod(floor(g.y), 2.0);
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float brick = smoothstep(0.02, 0.12, edge);
  float grain = fbm(vUv * 60.0);
  gNormal = bumpFromHeight(brick * 0.6 + grain * 0.25, 0.05);
  gHasN = 1.0;
  vec3 clay = mix(vec3(0.6, 0.22, 0.14), vec3(0.8, 0.4, 0.25), hash21(cell));
  vec3 col = mix(vec3(0.55), clay, brick) * (0.75 + 0.5 * grain);
  gl_FragColor = finish(col, 1.0);
}` },
  { t: 'Layer big and small detail', x: `Natural surfaces have bumps at several sizes. Add heights at different scales with different weights: a big feature strongly, a fine one weakly. Scales about 4 to 8 times apart look natural. Subtracting a feature digs it in: here the first part of \`voronoi\` (dark at each cell centre) is subtracted to make dents.`,
    shape: true, try: 'Change each multiplier (0.7, 0.15, 0.3) to find which layer does what.',
    code: `void main() {
  float big = fbm3(vPos * 3.0);
  float fine = fbm3(vPos * 24.0);
  float dents = 1.0 - smoothstep(0.0, 0.3, voronoi(vPos.xy * 5.0).x);
  float h = big * 0.7 + fine * 0.15 - dents * 0.3;
  gNormal = bumpFromHeight(h * 2.0, 0.06);
  gHasN = 1.0;
  vec3 col = mix(vec3(0.22, 0.2, 0.19), vec3(0.58, 0.53, 0.47), big);
  gl_FragColor = finish(col * (0.6 + 0.6 * fine), 1.0);
}` },
], true);

lesson('reflect', 'Reflections and shiny materials', 'Intermediate',
  'Reflect the view direction, look it up in an environment function you write yourself, then mix with fresnel and bump.', [
  { t: 'The reflected direction', x: `A mirror sends your line of sight off in a new direction. [[reflect]](I, n) mirrors the direction \`I\` around the normal \`n\`. \`-viewDir()\` points from the camera **towards** the surface, which is what \`reflect\` wants (hence the minus).

The result \`r\` answers: "what direction would I be seeing if this surface were a mirror?" Shown as colour, it changes smoothly across the shape.`,
    new: ['reflect'], shape: true, try: 'Orbit the camera: the colours slide as the view direction changes.',
    code: `void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}` },
  { t: 'Your own function', x: `Before the next step you need one more tool: **writing your own function**. It looks like \`main\`, but with a **return type** in front (here \`float\`), a **name**, parameters in brackets, and a \`return\` line that gives the answer back.

\`double_it\` takes a float and returns twice its value. Functions go **above** \`main\`, and you call them by name, exactly like the built-in ones. They keep long code tidy and let you use the same logic in several places.`,
    new: [N('return', 'float name(float x) { return x * 2.0; }', 'Define your own function: return type, name, parameters. \`return\` hands the answer back.')],
    shape: false, try: 'Change the function to return x * x and see the gradient bend.',
    code: `float double_it(float x) {
  return x * 2.0;
}
void main() {
  float g = double_it(vUv.x * 0.5);
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'A fake environment', x: `A real reflection needs a picture of the world around the object. We can write a **function that returns a colour for a direction**, which is just as good: **sky colour above, ground colour below**, with a switch at the horizon (where the up-down part \`r.y\` is 0).

\`smoothstep(-0.1, 0.1, r.y)\` is 0 below the horizon, 1 above, and a soft blend at it; \`mix\` then picks the ground or the sky.`,
    shape: true, try: 'Change the sky and ground colours.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  return mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
}
void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(env(r), 1.0);
}` },
  { t: 'Put the sun in the reflection', x: `A mirror also shows the sun as a tiny very bright disc. It's the same idea as the highlight: how closely does the reflected direction \`r\` point at \`uLightDir\`? \`pow(max(dot(...), 0.0), 200.0)\` is a tight spot, and multiplying by 3 makes it brighter than white, which looks like a real light.

Click \`c += ...\` in the editor and look at the line preview.`,
    shape: true, try: 'Change 200.0 to 20.0 for a bigger softer sun.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  gl_FragColor = vec4(env(r), 1.0);
}` },
  { t: 'Not everything is a mirror: fresnel', x: `Plastic, paint and water show only a **weak** reflection when you look straight at them and almost a full mirror at glancing angles. That's \`fresnel\` again. Mix the surface's own colour with the reflection by the fresnel value, with a floor (\`0.08 + 0.92 * f\`) so the reflection never vanishes completely.`,
    shape: true, try: 'Change the base colour. Change the floor 0.08 to 0.5 for a more mirror-like surface.',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 n = surfNormal();
  vec3 v = viewDir();
  vec3 r = reflect(-v, n);
  vec3 base = vec3(0.7, 0.08, 0.06) * (0.3 + 0.7 * max(dot(n, uLightDir), 0.0));
  float f = 0.08 + 0.92 * fresnel(n, v, 5.0);
  gl_FragColor = vec4(mix(base, env(r), f), 1.0);
}` },
  { t: 'Roughness: a blurry reflection', x: `A rough surface scatters light, so its reflection is blurry. Cheap trick: **blend towards a duller version**: looking up the environment along the *normal* instead of the reflected direction gives a smooth average of the surroundings. \`mix(env(r), env(n), uRough)\` goes from sharp mirror (0) to matte (1). \`uRough\` is a slider (\`uniform\`, as in the bump lesson).`,
    shape: true, try: 'Open the Uniforms tab and move uRough.',
    code: `uniform float uRough; // 0.3 [0, 1]
vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  vec3 n = surfNormal();
  vec3 r = reflect(-viewDir(), n);
  vec3 refl = mix(env(r), env(n), uRough);
  vec3 tint = vec3(1.0, 0.9, 0.8);
  gl_FragColor = vec4(refl * tint, 1.0);
}` },
  { t: 'Reflect a bumpy surface', x: `The reflection only needs a normal, and \`bumpFromHeight\` gives you a different normal! Compute \`n\` with it, then use **that** normal in \`reflect\`. The reflection now ripples across the bumps like hammered metal or water.

This is why bump maps matter most on shiny things: every bump bends the reflection. We don't call \`finish\` here, so there's no extra lighting: the result is the reflection alone, with a slight tint.`,
    shape: true, try: 'Change 0.08 (strength) and 3.0 (bump size).',
    code: `vec3 env(vec3 r) {
  vec3 sky = vec3(0.3, 0.55, 0.95);
  vec3 ground = vec3(0.25, 0.2, 0.15);
  vec3 c = mix(ground, sky, smoothstep(-0.1, 0.1, r.y));
  c = c + uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  return c;
}
void main() {
  float h = fbm3(vPos * 3.0);
  vec3 n = bumpFromHeight(h, 0.08);
  vec3 r = reflect(-viewDir(), n);
  vec3 tint = vec3(0.9, 0.95, 1.0);
  gl_FragColor = vec4(env(r) * tint, 1.0);
}` },
], true);

// ====================================================================== 12
const GOAL_TABLE = [
  ['A shape: circle, box, line, star…', ['length', 'distance', 'sdCircle', 'sdBox', 'sdSegment', 'smoothstep'], 'Make a **distance** number (how far from the shape), then cut it into a mask with `smoothstep`. The "Shapes (2D distance)" docs category has ready-made ones.'],
  ['Repeating things: tiles, stripes, dots', ['fract', 'floor', 'mod', 'checker'], '`fract(p * count)` repeats space. `floor` tells you which tile you are in (for per-tile randomness).'],
  ['Natural, uneven, organic', ['noise', 'fbm', 'fbm3', 'voronoi', 'perlin'], 'Use noise as a **height or a mask**. fbm = clouds, rock, dirt. voronoi = cells, cracks, scales, stones.'],
  ['Random variation', ['hash11', 'hash21', 'hash22', 'hash31'], 'Pair with `floor(p)` so each tile gets its own steady random number.'],
  ['Smooth transitions and edges', ['mix', 'smoothstep', 'step', 'clamp', 'saturate', 'remap'], 'Build a 0 to 1 number first, shape it with smoothstep or pow, then use it as `t` in mix.'],
  ['Picking colours', ['mix', 'palette', 'hsv2rgb', 'rgb2hsv', 'luma'], 'Few colours: mix. A rainbow or random hues: palette or hsv2rgb. Greyscale or saturation: luma.'],
  ['Motion and animation', ['uTime', 'sin', 'cos', 'fract', 'rot2'], 'Add `uTime` to a coordinate, to a noise input, or inside a `sin`. Rotate with `rot2(angle) * p`.'],
  ['Rings, spirals, radial patterns', ['length', 'atan', 'rot2', 'sin'], 'Polar: distance = `length(p)`, angle = `atan(p.y, p.x)`. A pattern in angle/distance becomes radial.'],
  ['Distort or warp a pattern', ['noise', 'fbm', 'sin', 'rot2'], 'Add a noise or sin value to the **coordinate** before using it: `p = p + 0.1 * noise(p * 4.0)`.'],
  ['Lighting, shine, rim glow', ['surfNormal', 'viewDir', 'dot', 'pow', 'fresnel', 'finish'], 'Normal + light direction + view direction are the three vectors all lighting uses.'],
  ['Surface detail: bumps, dents, scratches', ['bumpFromHeight', 'fbm3', 'voronoi', 'gNormal', 'gShine'], 'Design a **height** picture, then `bumpFromHeight`. See the bump lesson.'],
  ['Mirror, metal, glass, water', ['reflect', 'fresnel', 'surfNormal', 'viewDir', 'pow'], 'Reflect the view direction, look it up in an environment function, mix with fresnel. See the reflection lesson.'],
  ['Transparency and glow', ['fresnel', 'smoothstep', 'exp'], 'Set the type to **transparent** and put the see-through amount in alpha. Glows are added light: `col = col + glowColour * exp(-d * k)`.'],
  ['Something based on the object\'s own position', ['vPos', 'vUv', 'vN', 'vW', 'cameraPosition'], '`vUv` stays on the surface (can show seams), `vPos` is a 3D position in the object (seamless with fbm3).'],
];
lesson('backwards', 'Working backwards from a picture in your head', 'Method',
  'How to take an idea like "molten lava" apart into pieces, find where each piece lives in the Docs, and rebuild it layer by layer.', [
  { t: 'Start with questions, not code', x: `When you picture something and don't know how to make it, don't look for **the** function. Almost nothing is one function. Look at the picture and ask, in order:

**1. Shape.** What are the regions? (A circle? Cells? Blobs? Stripes?) Each region is a **mask**: a 0 to 1 number.
**2. Pattern.** Does it repeat (fract / floor), is it random and organic (noise / fbm / voronoi), or a smooth gradient (a coordinate)?
**3. Colour.** How many colours, and what picks between them? (mask → mix, height → ramp, angle → palette.)
**4. Surface.** Flat, bumpy, shiny, glowing, see-through? (bump, gShine, fresnel, extra light, alpha.)
**5. Motion.** What changes over time? (add \`uTime\` to one of the inputs above.)

Write the answers down as a list of layers. Each layer can be built and checked alone, and the line preview lets you inspect each one.` },
  { t: 'Where to look for what', x: `Click any name to jump to its documentation and example in the Docs tab. Each row is a thing you might want, the pieces that produce it, and the usual way to use them.`, table: GOAL_TABLE },
  { t: 'Worked example: "a molten lava ball". Layer 1, the pattern', x: `Take the idea apart.
**Shape:** dark crust plates with glowing cracks. **Pattern:** organic and random, so noise. **Colour:** black-brown crust, orange-yellow lava. **Surface:** crust is rough and lit; lava glows by itself. **Motion:** the lava slowly moves.

Build the pattern first, alone, in black and white. \`fbm3\` on the 3D position wraps cleanly around the ball, and adding to the y input makes it drift slowly.`,
    shape: true, try: 'Change 2.5 for bigger or smaller plates.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'Layer 2: turn the pattern into a mask', x: `We need two regions, crust and lava, so cut the noise with \`smoothstep\`: above about 0.56 is crust (1), below 0.46 is lava (0), a narrow transition between. Moving these two numbers changes how much of the ball is crust: that's your main design control.`,
    shape: true, try: 'Raise both numbers to get more lava.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  gl_FragColor = vec4(vec3(crust), 1.0);
}` },
  { t: 'Layer 3: colour each region', x: `Give each region its own colour and combine with \`mix\` and the mask. The lava gets a gradient too (hotter yellow where the noise is lowest, the middle of the cracks). The same \`n\` drives both the mask and the lava colour. This is the "which colour comes from which number" step.`,
    shape: true, try: 'Change the lava colours to make green slime.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 col = mix(lavaCol, crustCol, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 4: light only the crust', x: `Lava gives off its own light, so it shouldn't be darkened by shading; rock should. So we run only the crust colour through \`finish\` and take the colour from the result: \`finish(...)\` returns a vec4, and **\`.rgb\`** picks its first three parts (red, green, blue). The lava is shown unlit and over-bright (\`* 1.6\`; values above 1 look intense), and the mask chooses.

**Different parts of one object can follow different rules**, as long as a mask chooses.`,
    shape: true, try: 'Change 1.6 to 1.0 and 3.0.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 5: bump the crust', x: `The crust should look raised above the lava. Reuse the same mask as the **height**: crust high, lava low, plus a little fine grit. \`gNormal\` and \`gHasN\` are set **before** \`finish\` is called. No new idea: it's the bump lesson with numbers you already had.`,
    shape: true, try: 'Raise 0.06 for stronger bumps.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(crust * 0.8 + grit * 0.15, 0.06);
  gHasN = 1.0;
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n) * (0.6 + 0.8 * grit);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 6: a hot rim', x: `Finishing touches usually come from the lighting group. A \`fresnel\` mask adds an orange glow at the edge of the ball, like heat haze. We *add* because it's emitted light. Compare the first picture with this one: six small, separate decisions, each answering one question from step one.

When you build your own: finish one layer, look at it, add the next. If something looks wrong, click the line that makes it and use the line preview to see which layer is the problem.`,
    shape: true, try: 'Change 0.6 (the rim strength).',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(crust * 0.8 + grit * 0.15, 0.06);
  gHasN = 1.0;
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n) * (0.6 + 0.8 * grit);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  col = col + vec3(1.0, 0.35, 0.05) * fresnel(surfNormal(), viewDir(), 3.0) * 0.6;
  gl_FragColor = vec4(col, 1.0);
}` },
], true);

/* ===== editor.js : a small self-contained code editor engine for GLSL =====
   textarea (input, caret, selection) + a highlighted <pre> underneath + line-number gutter.
   Features: syntax highlighting, error markers, undo/redo, auto-indent, auto-close brackets, bracket matching, comment toggle,
   move/duplicate lines, find/replace, autocomplete, signature help, hover docs, and drag-to-change numbers. */
class CodeEditor {
  constructor(host, o) {
    this.o = o || {}; this.host = host;
    host.innerHTML = '<div class="ed"><div class="ed-gut"><div class="ed-gutin"></div></div><div class="ed-view">' +
      '<div class="ed-under"></div><pre class="ed-hl"></pre>' +
      '<textarea class="ed-ta" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>' +
