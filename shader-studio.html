<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shader Studio</title>
<style>
[hidden]{display:none!important}
:root {
  --bg: #15171c; --panel: #1b1e25; --panel2: #20242c; --line: #2c313b; --text: #d6dae3; --dim: #8a92a3; --accent: #5aa2ff; --good: #5fcf80; --bad: #ef6a6a; --warn: #e6b450;
  --right: 470px;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: var(--text); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; cursor: pointer; }
button:hover { border-color: #46506a; background: #262b35; }
button.on { background: #27406b; border-color: var(--accent); }
button.pri { background: #2b5fb0; border-color: #4a82d8; }
button:disabled { opacity: .4; cursor: default; }
select { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
input[type=text], input:not([type]), input[type=search], input[type=number] { background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
input:focus, textarea:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #353b48; border-radius: 6px; border: 2px solid transparent; background-clip: content-box; } ::-webkit-scrollbar-thumb:hover { background: #4a5266; background-clip: content-box; border: 2px solid transparent; } ::-webkit-scrollbar-corner { background: transparent; }
body.scrubbing, body.scrubbing * { cursor: ew-resize !important; user-select: none !important; }

#app { display: flex; flex-direction: column; height: 100%; }
#top { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top .logo { font-weight: 700; letter-spacing: .02em; } #top .logo span { color: var(--accent); }
#top .sep { width: 1px; height: 20px; background: var(--line); }
#bName { font-weight: 600; color: #fff; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border-color: transparent; }
#bName:hover { border-color: var(--line); }
#hint { color: var(--dim); font-size: 12px; margin-left: 6px; }
#status { margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #1f2a22; color: var(--good); }
#status.err { background: #3a2022; color: var(--bad); }
#main { flex: 1; display: flex; min-height: 0; }
#center { flex: 1; min-width: 280px; display: flex; flex-direction: column; min-height: 0; background: #12141a; }
#editor { flex: 1; min-height: 0; position: relative; }
#sbar { display: flex; gap: 14px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; }
#errs { max-height: 130px; overflow: auto; border-top: 1px solid var(--line); font: 12px/1.45 var(--mono); }
#errs div { padding: 3px 10px; color: #ffb0b0; cursor: pointer; border-bottom: 1px solid #2a2326; } #errs div:hover { background: #2d2225; }
#errs div.ok { color: var(--good); cursor: default; border: 0; background: transparent; }
.split { width: 5px; cursor: col-resize; background: var(--line); flex: none; } .split:hover, .split.drag { background: var(--accent); }

/* ===== right side panel ===== */
#right { width: var(--right); min-width: 340px; display: flex; flex-direction: column; background: var(--panel); overflow-y: auto; overflow-x: hidden; }
#pvwrap { position: relative; height: 280px; flex: none; background: #000; }
canvas.view { width: 100%; height: 100%; display: block; cursor: grab; } canvas.view:active { cursor: grabbing; }
#pvmsg, #lpmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--bad); font-size: 12px; pointer-events: none; }
#lpmsg { color: #c8cfdd; background: rgba(12,14,18,.82); }
#shapes { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); align-items: center; flex: none; }
#shapes button { padding: 2px 7px; font-size: 12px; } #shapes .grow { flex: 1; }
#lpHead { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); flex: none; flex-wrap: wrap; }
#lpHead b { color: #e6e9f0; font-weight: 600; } #lpHead .lpl { flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lpHead select, #lpHead input { font-size: 11px; padding: 1px 4px; } #lpHead input[type=number] { width: 52px; }
#lpWrap { position: relative; height: 190px; flex: none; background: #000; border-bottom: 1px solid var(--line); }
#lpWrap.off { display: none; }
#tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
#tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 7px 4px; color: var(--dim); border-bottom: 2px solid transparent; }
#tabs button.on { color: #fff; border-bottom-color: var(--accent); }
#tabbody { flex: 1; min-height: 440px; overflow: auto; padding: 8px; position: relative; }
.pane { display: none; } .pane.on { display: block; }
.btnrow { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; } .btnrow button { font-size: 12px; padding: 3px 8px; }
h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.hint { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 6px 0; } .hint code, .hint kbd, #tab-help code, #tab-help kbd { font: 11.5px var(--mono); background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #cfd6e4; }
#libFilter { width: 100%; margin-bottom: 6px; }
#libList { border: 1px solid var(--line); border-radius: 5px; max-height: 430px; overflow: auto; }
.lgh { position: sticky; top: 0; background: #232833; color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 8px; cursor: pointer; display: flex; justify-content: space-between; z-index: 1; border-bottom: 1px solid var(--line); }
.lgh:hover { color: #fff; }
.libitem { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; } .libitem:hover { background: #242a35; } .libitem.on { background: #27406b; }
.libitem small { color: var(--dim); } .libitem .mod { color: var(--warn); }
.field { display: grid; grid-template-columns: 112px 1fr auto; gap: 6px; align-items: center; margin: 5px 0; } .field label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field input[type=range] { width: 100%; } .field .v { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
.field input[type=number] { width: 62px; } .field .vecs { display: flex; gap: 3px; } .field .vecs input { width: 100%; } .field input[type=color] { width: 30px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }

/* ===== docs tab ===== */
#docTools { position: sticky; top: -8px; z-index: 3; background: var(--panel); padding: 8px 0 6px; margin: -8px 0 4px; border-bottom: 1px solid var(--line); }
#docQ { width: 100%; }
#docChips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } #docChips button { font-size: 11px; padding: 1px 7px; border-radius: 99px; }
.doc { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: #1e222a; padding: 8px 10px; }
.doc.flash { animation: flash 1.4s; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.doc .dh { display: flex; align-items: baseline; gap: 8px; } .doc .dn { font: 600 13.5px var(--mono); color: #fff; } .doc .dc { margin-left: auto; font-size: 10.5px; color: var(--dim); }
.doc .ds { font: 12px var(--mono); color: #9fb4d0; margin: 2px 0; white-space: pre-wrap; }
.doc .dd { color: #b9c0cf; font-size: 12.5px; line-height: 1.5; margin: 4px 0 6px; }
.doc .db { display: flex; gap: 8px; align-items: stretch; }
.doc .th { width: 124px; flex: none; }
.doc .th canvas { width: 124px; height: 124px; border-radius: 6px; background: #000; display: block; border: 1px solid var(--line); }
.doc .dcode { flex: 1; min-width: 0; margin: 0; background: #14171d; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 11.5px/1.5 var(--mono); overflow: auto; max-height: 190px; white-space: pre; }
.doc .dbt { display: flex; gap: 5px; margin-top: 6px; } .doc .dbt button { font-size: 11px; padding: 2px 8px; }
body.wide-docs { --right: 760px; }

/* ===== syntax colours ===== */
.c { color: #66758c; font-style: italic; } .pp { color: #c586c0; } .k { color: #c586c0; } .q { color: #5aa2ff; } .t { color: #4ec9b0; }
.n { color: #f0b36b; } .bf { color: #e2d994; } .sf { color: #7cc4ff; } .bv { color: #ff9d7a; } .uf { color: #a8d88a; } .un { color: #ff8fb8; } .cn { color: #d19a66; }
.sw { color: #9ecbff; } .fld { color: #c8d0e0; } .call { color: #cfc79a; } .p { color: #98a3b6; } .o { color: #bfc7d6; }

/* ===== editor engine ===== */
.ed { display: flex; height: 100%; font: 12.5px/20px var(--mono); background: #12141a; }
.ed-gut { width: 48px; flex: none; overflow: hidden; background: #14171c; border-right: 1px solid #20242c; padding-top: 8px; color: #566074; text-align: right; user-select: none; }
.ed-gutin { will-change: transform; } .ed-gutin div { padding-right: 8px; height: 20px; } .ed-gutin div.cur { color: #d6dae3; } .ed-gutin div.pv { color: #e6b450; } .ed-gutin div.pv::before { content: "◂ "; }
.ed-gutin div.err { color: #fff; background: #7a2e2e; }
.ed-view { position: relative; flex: 1; overflow: hidden; min-width: 0; }
.ed-hl, .ed-ta { position: absolute; left: 0; top: 0; margin: 0; padding: 8px 14px 160px 12px; border: 0; font: inherit; letter-spacing: 0; white-space: pre; tab-size: 2; font-variant-ligatures: none; word-spacing: 0; text-rendering: optimizeSpeed; }
.ed-hl { pointer-events: none; color: #d6dae3; will-change: transform; min-width: 100%; }
.ed-ta { width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: #fff; overflow: auto; outline: none; z-index: 2; -webkit-text-fill-color: transparent; }
.ed-ta::selection { background: rgba(90, 162, 255, .35); -webkit-text-fill-color: transparent; }
.ed-ta:focus { outline: none; }
.ed-under { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; pointer-events: none; }
.ed-under .bar { position: absolute; left: 0; width: 20000px; } .ed-under .bar.cur { background: rgba(255,255,255,.045); } .ed-under .bar.pv { background: rgba(230,180,80,.09); box-shadow: inset 2px 0 0 rgba(230,180,80,.7); }
.ed-under .bar.err { background: rgba(239,106,106,.14); box-shadow: inset 0 -2px 0 -0px rgba(239,106,106,.55); }
.ed-under .box { position: absolute; } .ed-under .box.brk { background: rgba(90,162,255,.28); outline: 1px solid rgba(90,162,255,.7); outline-offset: -1px; border-radius: 2px; }
.ed-under .box.num { background: rgba(240,179,107,.16); border-bottom: 1px dotted #f0b36b; border-radius: 2px; } .ed-under .box.find { background: rgba(230,180,80,.3); outline: 1px solid rgba(230,180,80,.7); outline-offset: -1px; }
.ed-ac { position: absolute; z-index: 20; width: 380px; background: #1e222a; border: 1px solid #46506a; border-radius: 7px; box-shadow: 0 10px 30px rgba(0,0,0,.55); font: 12.5px/1.2 var(--mono); overflow: hidden; }
.ac-list { max-height: 178px; overflow: auto; } .ac-it { display: flex; align-items: center; gap: 7px; padding: 3px 8px; height: 22px; cursor: pointer; } .ac-it.on { background: #27406b; } .ac-it .ac-l { flex: 1; color: #e6e9f0; white-space: nowrap; } .ac-it .ac-l b { color: #7cc4ff; font-weight: 700; } .ac-it .ac-d { color: #8a92a3; font-size: 11px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.ac-k { width: 16px; height: 16px; border-radius: 4px; text-align: center; font: 700 10.5px/16px var(--mono); flex: none; background: #3a404d; color: #fff; }
.k-fn { background: #2c5a94; } .k-sf { background: #2c5a94; } .k-type { background: #1f6f64; } .k-kw { background: #6a3d78; } .k-var { background: #7a4f1e; } .k-local { background: #3d7a4d; } .k-uni { background: #8a3f6a; } .k-cn { background: #7a6a1e; } .k-snip { background: #4a5870; } .k-sw { background: #4a5870; } .k-macro { background: #6a3d78; }
.ac-doc { border-top: 1px solid #2c313b; padding: 6px 9px; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; color: #aab3c4; max-height: 90px; overflow: auto; } .ac-doc code { display: block; font: 11.5px var(--mono); color: #9fb4d0; margin-bottom: 2px; white-space: pre-wrap; }
.ed-tip, .ed-sig { position: absolute; z-index: 25; max-width: 340px; background: #11151c; border: 1px solid #46506a; color: #dbe2ef; font: 12px/1.45 ui-sans-serif, system-ui, sans-serif; padding: 6px 9px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.5); pointer-events: none; }
.ed-sig { font: 12px/1.4 var(--mono); max-width: 520px; white-space: nowrap; } .ed-sig u { color: #f0b36b; text-decoration: none; font-weight: 700; } .ed-sig .tip-dim { white-space: normal; font-family: ui-sans-serif, system-ui, sans-serif; }
.tip-err { color: #ffb0b0; font-family: var(--mono); font-size: 11.5px; } .tip-dim { color: #8a92a3; margin-top: 2px; } .tip-sig { font: 12px var(--mono); color: #9fb4d0; }
.ed-scrub { position: absolute; z-index: 30; background: #f0b36b; color: #1a1304; font: 700 12px var(--mono); padding: 1px 7px; border-radius: 5px; pointer-events: none; box-shadow: 0 3px 10px rgba(0,0,0,.5); }
.ed-find { position: absolute; right: 16px; top: 6px; z-index: 30; display: flex; gap: 4px; align-items: center; background: #1e222a; border: 1px solid #46506a; border-radius: 7px; padding: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.ed-find input { width: 130px; } .ed-find button { padding: 2px 7px; } .ed-find .ef-n { color: var(--dim); font-size: 11px; min-width: 52px; }
[hidden] { display: none !important; }

/* ===== modal + toast ===== */
#modal { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
#mbox { width: 380px; max-width: 92vw; background: var(--panel); border: 1px solid #46506a; border-radius: 10px; padding: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
#mbox .mt { font-weight: 600; margin-bottom: 8px; } #mbox input { width: 100%; padding: 6px 8px; } #mbox .mx { color: var(--dim); margin-top: 6px; line-height: 1.5; } #mbox .mrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #232a38; border: 1px solid #3a4560; padding: 6px 14px; border-radius: 6px; z-index: 95; max-width: 70vw; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
#drop { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center; background: rgba(10,14,22,.8); font-size: 22px; border: 3px dashed var(--accent); }
@media (max-width: 900px) { #main { flex-direction: column; } #right { width: auto; height: 62%; min-width: 0; } .split { display: none; } #hint { display: none; } }

/* ===== learn tab ===== */
.lcard { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin: 7px 0; cursor: pointer; background: var(--panel2); }
.lcard:hover { border-color: var(--accent); }
.lcard .lt { font-weight: 600; color: #fff; } .lcard .lm { color: var(--accent); font-size: 11px; margin: 1px 0 4px; } .lcard .ld { color: var(--dim); font-size: 12px; line-height: 1.45; }
.lnav { display: flex; gap: 6px; justify-content: space-between; margin: 4px 0 8px; }
.ltitle { margin: 6px 0 2px; font-size: 16px; color: #fff; }
.ltx p { margin: 0 0 8px; } .ltx code, .ltable code { font: 11.5px var(--mono); background: #12141a; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #cfd6e4; }
a.dl { color: #7db4ff; cursor: pointer; text-decoration: underline dotted; } a.dl:hover { color: #fff; } a.dl.nolink { color: var(--dim); cursor: default; text-decoration: none; }
.dcode .ln { white-space: pre; min-height: 1.4em; padding: 0 3px; margin: 0 -3px; } .dcode .ln.added { background: rgba(95,207,128,.16); box-shadow: inset 2px 0 0 var(--good); }
.lleg { color: var(--dim); font-size: 11px; margin: 4px 0 0; }
.ltable { margin: 6px 0; } .lrow { border-top: 1px solid var(--line); padding: 7px 0; } .lg { font-weight: 600; color: #fff; margin-bottom: 3px; }
.lch { display: flex; flex-wrap: wrap; gap: 3px 10px; margin-bottom: 3px; font: 12px var(--mono); } .ltip { color: var(--dim); font-size: 12px; line-height: 1.45; }
.doc.flash { animation: dflash 1.2s; } @keyframes dflash { 0% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
#tabs button#bFocus { flex: none; width: 34px; }
body.hide-pv #pvwrap, body.hide-pv #shapes, body.hide-pv #lpHead, body.hide-pv #lpWrap { display: none; }

.hsplit { height: 7px; flex: none; cursor: row-resize; background: var(--line); position: relative; } .hsplit::after { content: ""; position: absolute; left: 50%; top: 2px; width: 34px; height: 3px; margin-left: -17px; border-radius: 2px; background: #4a5266; }
.hsplit:hover, .hsplit.drag { background: var(--accent); } .hsplit:hover::after, .hsplit.drag::after { background: #fff; }
.split { width: 7px; position: relative; } .split::after { content: ""; position: absolute; top: 50%; left: 2px; width: 3px; height: 34px; margin-top: -17px; border-radius: 2px; background: #4a5266; } .split:hover::after, .split.drag::after { background: #fff; }
#pvwrap, #lpWrap { min-height: 80px; } #tabbody { min-height: 160px; }
body.hide-pv .hsplit { display: none; }

.lnew { border: 1px solid #2f4a78; background: #17233a; border-radius: 7px; padding: 6px 9px; margin: 6px 0 8px; }
.lnl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #7db4ff; margin-bottom: 3px; }
.lni { padding: 3px 0; } .lni code { font: 12px var(--mono); color: #e9d9a6; background: transparent; border: 0; padding: 0; white-space: pre-wrap; } .lnd { color: #c8d0e0; font-size: 12px; line-height: 1.45; margin-top: 1px; } .lni a.dl { font-size: 11px; }
.ltry { margin: 6px 0 0; padding: 5px 9px; border-left: 3px solid var(--good); background: rgba(95,207,128,.08); font-size: 12px; line-height: 1.45; color: #cfe8d6; } .ltry b { color: var(--good); }

.tread { color: var(--dim); font: 11px var(--mono); align-self: center; padding-left: 6px; }
.lreset { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px dashed #3a4a6a; border-radius: 7px; padding: 6px 9px; margin: 6px 0 10px; color: var(--dim); font-size: 12px; line-height: 1.4; } .lreset button { flex: none; }
button.tread { font: 11px var(--mono); color: #cfd6e4; padding: 2px 7px; background: #12141a; } button.tread:hover { border-color: var(--accent); }
.dnote { margin: 2px 2px 6px; font-size: 11.5px; } #docChips.dim button[data-c] { opacity: .45; }

</style></head><body>
<div id="app">
  <div id="top">
    <div class="logo">Shader<span>Studio</span></div><div class="sep"></div>
    <button id="bName" title="Click to rename"></button>
    <select id="typeSel" title="Shader type"><option value="opaque">opaque</option><option value="transparent">transparent</option></select>
    <div class="sep"></div>
    <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Shift+Z)">↷</button><button id="bFind" title="Find / replace (Ctrl+F)">Find</button>
    <span id="hint">Drag any number to change it · Ctrl+Space autocomplete · F1 docs</span>
    <span id="status">…</span>
  </div>
  <div id="main">
    <div id="center">
      <div id="editor"></div>
      <div id="errs"></div>
      <div id="sbar"><span id="sbPos">Ln 1, Col 1</span><span>GLSL ES 3.00</span><span>Ctrl+Enter compile</span></div>
    </div>
    <div class="split" id="rsplit" title="Drag to resize"></div>
    <div id="right">
      <div id="pvwrap"><canvas class="view" id="view"></canvas><div id="pvmsg"></div></div>
      <div class="hsplit" data-k="pvH" title="Drag to resize the preview (double-click to reset)"></div>
      <div id="shapes"></div>
      <div id="lpHead"></div>
      <div id="lpWrap"><canvas class="view" id="view2"></canvas><div id="lpmsg"></div></div>
      <div class="hsplit" data-k="lpH" title="Drag to resize the line preview (double-click to reset)"></div>
      <div id="tabs">
        <button data-tab="shaders">Shaders</button><button data-tab="scene">Scene</button><button data-tab="uniforms">Uniforms</button><button data-tab="learn">Learn</button><button data-tab="docs">Docs</button><button data-tab="help">Help</button><button id="bFocus" title="Hide / show the previews (more room to read)">⇕</button>
      </div>

 * The value of the last assignment/declaration at or before the caret line is shown through _viz().

add('Language', 'type', 'mat4', 'mat4(...)', 'A 4×4 matrix (positions with translation). The vertex shader uses them; in a fragment shader you rarely need one.', null);
add('Language', 'kw', 'const', 'const float NAME = value;', 'A value that never changes. Written in CAPITALS by habit. Can be used at the top of the file or inside functions.', `const float RADIUS = 0.3;
void main() {
  vec2 p = vUv - 0.5;
  float inside = step(length(p), RADIUS);
  gl_FragColor = vec4(vec3(inside), 1.0);
}`);
add('Language', 'kw', 'uniform', 'uniform float uName;', 'An input you control from the Uniforms tab. Add a comment after it to set the start value and range: "// 0.5 [0, 1]" (a vec3 colour: "// color 1 0.5 0.2").', `uniform float uSize; // 0.3 [0, 0.5]
uniform vec3 uTint;  // color 0.95 0.6 0.2
void main() {
  float d = length(vUv - 0.5);
  float inside = step(d, uSize);
  gl_FragColor = vec4(uTint * inside, 1.0);
}`);
add('Language', 'kw', 'struct', 'struct Name { float a; vec3 b; };', 'Bundle several values into one. Create one with Name(a, b) and read fields with a dot.', `struct Disc { vec2 c; float r; vec3 col; };
void main() {
  Disc a = Disc(vec2(0.35, 0.5), 0.2, vec3(0.9, 0.4, 0.3));
  Disc b = Disc(vec2(0.65, 0.5), 0.2, vec3(0.3, 0.6, 0.9));
  vec3 col = vec3(0.08);
  if (distance(vUv, a.c) < a.r) col = a.col;
  if (distance(vUv, b.c) < b.r) col = b.col;
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'if', 'if (cond) { ... } else { ... }', 'Run code only when a bool is true. On the GPU both sides can be costly, so the math versions (step, mix) are often better.', `void main() {
  vec3 col;
  if (vUv.x < 0.33) col = vec3(0.9, 0.3, 0.3);
  else if (vUv.x < 0.66) col = vec3(0.3, 0.8, 0.4);
  else col = vec3(0.3, 0.5, 0.9);
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'for', 'for (int i = 0; i < N; i++) { ... }', 'Repeat code. Keep N small and fixed; every pixel runs the whole loop. Use break to leave early.', `void main() {
  vec3 col = vec3(0.07);
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    vec2 c = vec2(0.15 + 0.175 * fi, 0.5);
    float dot1 = 1.0 - smoothstep(0.04, 0.07, distance(vUv, c));
    col += vec3(0.2, 0.5, 0.9) * dot1 * (0.3 + 0.175 * fi);
  }
  gl_FragColor = vec4(col, 1.0);
}`);
add('Language', 'kw', 'Functions', 'float name(float a, vec2 b) { return ...; }', 'Write your own helper above main(). The return type comes first. Use  out  or  inout  before a parameter to send a value back.', `float ring(vec2 p, float r, float w) {
  return 1.0 - smoothstep(0.0, w, abs(length(p) - r));
}
void main() {
  vec2 p = vUv - 0.5;
  float v = ring(p, 0.15, 0.015) + ring(p, 0.3, 0.015) + ring(p, 0.45, 0.015);
  gl_FragColor = vec4(vec3(v), 1.0);
}`);
add('Language', 'kw', 'discard', 'discard;', 'Throw the pixel away: it is not drawn at all, you see what is behind. Good for cut-outs and dissolves.', `void main() {
  if (checker(vUv * 6.0) > 0.5) discard;
  gl_FragColor = vec4(vec3(vUv, 0.6), 1.0);
}`);
add('Language', 'macro', '#define', '#define NAME value', 'A text replacement made before compiling. Handy for constants and tiny helpers.', `#define SCALE 7.0
void main() {
  float v = 0.5 + 0.5 * sin(vUv.x * SCALE * 3.1416) * sin(vUv.y * SCALE * 3.1416);
  gl_FragColor = vec4(vec3(v), 1.0);
}`);
add('Language', 'kw', 'Arrays', 'const vec3 A[4] = vec3[4](...);', 'A fixed list of values. Index with an int: A[i]. Handy for palettes.', `const vec3 PAL[4] = vec3[4](vec3(0.9, 0.25, 0.25), vec3(0.95, 0.7, 0.2), vec3(0.25, 0.7, 0.4), vec3(0.25, 0.45, 0.9));
void main() {
  int i = int(clamp(vUv.x * 4.0, 0.0, 3.999));
  gl_FragColor = vec4(PAL[i], 1.0);
}`);

// ------------------------------------------------------------------ built-in variables
add('Built-in variables', 'var', 'vUv', 'vec2 vUv', 'Texture coordinates of the surface: 0..1 across each face (u to the right, v up). The most common starting point.', `void main() {
  gl_FragColor = vec4(vUv, 0.0, 1.0);    // red = u, green = v
}`);
add('Built-in variables', 'var', 'vP', 'vec2 vP', 'vUv multiplied by 4: the same coordinates but in "units" so patterns repeat 4 times. (Same name the game shaders use.)', `void main() {
  gl_FragColor = vec4(vec3(checker(vP)), 1.0);
}`);
add('Built-in variables', 'var', 'vPos', 'vec3 vPos', 'Position of this point on the object, in the object\'s own space (about -1..1). Patterns made from it have no seams and wrap around any shape.', `void main() {
  gl_FragColor = vec4(vPos * 0.5 + 0.5, 1.0);   // x, y, z shown as r, g, b
}`, { shape: true });
add('Built-in variables', 'var', 'vP3', 'vec3 vP3', 'Another name for vPos (the name the game shaders use).', `void main() {
  float stripes = step(0.0, sin(vP3.y * 24.0));
  gl_FragColor = finish(mix(vec3(0.9, 0.35, 0.2), vec3(0.95), stripes), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'vN', 'vec3 vN', 'Surface normal in view space (relative to the camera). Not normalised after interpolation: use normalize(vN).', `void main() {
  gl_FragColor = vec4(normalize(vN) * 0.5 + 0.5, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'vW', 'vec3 vW', 'Position of this point in the world (after the object has been moved or rotated).', `void main() {
  gl_FragColor = vec4(fract(vW * 2.0), 1.0);    // repeats every 0.5 world units
}`, { shape: true });
add('Built-in variables', 'var', 'vWN', 'vec3 vWN', 'Surface normal in world space. Use surfNormal() to get it normalised and facing you.', `void main() {
  gl_FragColor = vec4(normalize(vWN) * 0.5 + 0.5, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uTime', 'float uTime', 'Seconds since the preview started (the Time button in the preview and the Scene tab control it). Use it to animate.', `void main() {
  float v = 0.5 + 0.5 * sin(uTime * 3.0 + vUv.x * 10.0);   // hover this card: it animates
  gl_FragColor = vec4(vec3(v) * vec3(0.4, 0.8, 1.0), 1.0);
}`);
add('Built-in variables', 'var', 'uSeed', 'float uSeed', 'A number that stays the same while you look but can be changed in the Scene tab: use it to make every object slightly different.', `void main() {
  vec3 c = vec3(hash11(uSeed), hash11(uSeed + 1.0), hash11(uSeed + 2.0));
  gl_FragColor = vec4(c, 1.0);
}`);
add('Built-in variables', 'var', 'uResolution', 'vec2 uResolution', 'Size of the picture in pixels. Divide gl_FragCoord.xy by it to get 0..1 screen coordinates.', `void main() {
  vec2 s = gl_FragCoord.xy / uResolution;
  gl_FragColor = vec4(s, 0.3, 1.0);
}`);
add('Built-in variables', 'var', 'uLightDir', 'vec3 uLightDir', 'Direction towards the sun, in world space (length 1). Change it in the Scene tab.', `void main() {
  float d = lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(vec3(d), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uLightCol', 'vec3 uLightCol', 'Colour times strength of the sun.', `void main() {
  float d = lambert(surfNormal(), uLightDir);
  gl_FragColor = vec4(uLightCol * d, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uAmbSky', 'vec3 uAmbSky', 'Soft light coming from above. Together with uAmbGround it fills the shadows with colour.', `void main() {
  gl_FragColor = vec4(uAmbSky * 1.8, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'uAmbGround', 'vec3 uAmbGround', 'Soft light coming from below (bounced from the ground).', `void main() {
  vec3 n = surfNormal();
  gl_FragColor = vec4(mix(uAmbGround, uAmbSky, n.y * 0.5 + 0.5) * 1.8, 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'cameraPosition', 'vec3 cameraPosition', 'Where the camera is, in world space. Distance to a surface = distance(cameraPosition, vW).', `void main() {
  float d = distance(cameraPosition, vW);
  gl_FragColor = vec4(vec3(1.0 - (d - 2.0) / 2.5), 1.0);   // near = bright
}`, { shape: true });
add('Built-in variables', 'var', 'uTex0', 'sampler2D uTex0', 'A built-in test picture (colour squares with a letter) you can sample with texture().', `void main() {
  gl_FragColor = texture(uTex0, vUv);
}`);
add('Built-in variables', 'var', 'uNoiseTex', 'sampler2D uNoiseTex', 'A 256×256 picture of random noise. Repeats when you go past 0..1. A cheap source of randomness.', `void main() {
  gl_FragColor = vec4(texture(uNoiseTex, vUv * 2.0).rgb, 1.0);
}`);
add('Built-in variables', 'var', 'gl_FragCoord', 'vec4 gl_FragCoord', 'Pixel position on the screen (x, y), in pixels, plus depth in z.', `void main() {
  vec2 cell = floor(gl_FragCoord.xy / 32.0);        // 32 pixel squares
  gl_FragColor = vec4(vec3(mod(cell.x + cell.y, 2.0) * 0.6 + 0.2), 1.0);
}`);
add('Built-in variables', 'var', 'gl_FragColor', 'vec4 gl_FragColor', 'The colour (red, green, blue, alpha) this pixel ends up with. Every shader must set it. finish() gives you lighting for free.', `void main() {
  gl_FragColor = vec4(vUv, 0.5, 1.0);
}`);
add('Built-in variables', 'var', 'gl_FrontFacing', 'bool gl_FrontFacing', 'True when you see the front of the surface, false when you see the back (inside of a plane or open shape).', `void main() {
  vec3 col = gl_FrontFacing ? vec3(0.25, 0.7, 0.4) : vec3(0.9, 0.3, 0.25);
  gl_FragColor = vec4(col, 1.0);
}`);
add('Built-in variables', 'cn', 'PI', 'const float PI', '3.14159…: half a turn in radians. TAU = 2π is a full turn.', fx('0.5 + 0.5 * sin(x * PI)'));
add('Built-in variables', 'cn', 'TAU', 'const float TAU', '6.28318…: a full turn in radians.', fx('0.5 + 0.5 * sin(x * TAU)'));
add('Built-in variables', 'var', 'gNormal', 'vec3 gNormal; float gHasN', 'Set gNormal to your own surface normal (a bump map) and gHasN = 1.0 before calling finish(), and the lighting uses it.', `void main() {
  float h = noise(vUv * 30.0);
  gNormal = bumpFromHeight(h, 0.08);
  gHasN = 1.0;
  gl_FragColor = finish(vec3(0.75, 0.62, 0.45), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gShine', 'float gShine; float gRough', 'Make finish() add a sun highlight. gShine is how strong (0 = none), gRough how wide and dull (0 = small and hard, 1 = wide).', `void main() {
  gShine = 1.0;
  gRough = 0.25;
  gl_FragColor = finish(vec3(0.75, 0.3, 0.2), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gSpec', 'vec3 gSpec', 'Extra light added after the lighting, not multiplied by the surface colour (hard shine or glow).', `void main() {
  gSpec = vec3(1.0, 0.8, 0.5) * fresnel(surfNormal(), viewDir(), 3.0);
  gl_FragColor = finish(vec3(0.2, 0.25, 0.4), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gGlint', 'vec3 gGlint', 'Like gSpec, a highlight added after the lighting (for sparkles).', `void main() {
  float sp = step(0.93, noise(vUv * 60.0));
  gGlint = vec3(sp);
  gl_FragColor = finish(vec3(0.3, 0.32, 0.38), 1.0);
}`, { shape: true });
add('Built-in variables', 'var', 'gBlow', 'float gBlow', 'Over-expose the lit side: where the sun hits, the colour pushes toward white (0 = off, 1 = strong).', `void main() {
  gBlow = 1.0;
  gl_FragColor = finish(vec3(0.8, 0.4, 0.2), 1.0);
}`, { shape: true });

// ------------------------------------------------------------------ angles & trig
add('Angles & trig', 'fn', 'radians', 'radians(degrees)', 'Degrees to radians (180° = π).', fx('0.5 + 0.5 * sin(radians(x * 720.0))', '// 720 degrees = two full waves'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'degrees', 'degrees(radians)', 'Radians to degrees.', fx('degrees(x * 6.2832) / 360.0', '// a full turn (6.28 radians) is 360 degrees'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'sin', 'sin(angle)', 'Sine of an angle in radians: a smooth wave from -1 to 1 that repeats every 2π. The basis of stripes, pulses and animation.', fx('0.5 + 0.5 * sin(x * 6.2832)', '// turned into 0..1 so it fits the picture'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'cos', 'cos(angle)', 'Cosine: like sin but starts at the top. cos(a) and sin(a) together walk around a circle.', fx('0.5 + 0.5 * cos(x * 6.2832)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'tan', 'tan(angle)', 'Tangent: shoots off to infinity at ±π/2.', fx('0.5 + 0.12 * tan(x * 3.1416 - 1.5708)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'asin', 'asin(x)', 'Inverse sine. x must be between -1 and 1; returns -π/2 .. π/2.', fx('asin(x * 2.0 - 1.0) / 3.1416 + 0.5'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'acos', 'acos(x)', 'Inverse cosine. x must be between -1 and 1; returns 0 .. π.', fx('acos(x * 2.0 - 1.0) / 3.1416'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'atan', 'atan(y, x)  or  atan(y_over_x)', 'The angle of a direction. atan(p.y, p.x) gives -π..π all the way around (the two-number form knows the quadrant).', `void main() {
  vec2 p = vUv - 0.5;
  float a = atan(p.y, p.x);                          // -PI .. PI around the centre
  vec3 col = hsv2rgb(vec3(a / 6.2832 + 0.5, 0.8, 1.0));
  gl_FragColor = vec4(col, 1.0);
}`, { ret: 'genType', G });
add('Angles & trig', 'fn', 'sinh', 'sinh(x)', 'Hyperbolic sine.', fx('0.5 + sinh(x * 4.0 - 2.0) / 8.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'cosh', 'cosh(x)', 'Hyperbolic cosine (the shape of a hanging chain).', fx('cosh(x * 4.0 - 2.0) / 8.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'tanh', 'tanh(x)', 'Hyperbolic tangent: an S-curve between -1 and 1, a soft clamp.', fx('0.5 + 0.5 * tanh(x * 6.0 - 3.0)'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'asinh', 'asinh(x)', 'Inverse hyperbolic sine.', fx('0.5 + asinh(x * 8.0 - 4.0) / 4.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'acosh', 'acosh(x)', 'Inverse hyperbolic cosine (x must be 1 or more).', fx('acosh(1.0 + x * 5.0) / 3.0'), { ret: 'genType', G });
add('Angles & trig', 'fn', 'atanh', 'atanh(x)', 'Inverse hyperbolic tangent (x must be between -1 and 1).', fx('0.5 + 0.15 * atanh(x * 1.8 - 0.9)'), { ret: 'genType', G });

// ------------------------------------------------------------------ power & exponent
add('Power & exponent', 'fn', 'pow', 'pow(x, y)', 'x to the power y. Bends a 0..1 value: y above 1 pushes it down (darker mid-tones), below 1 lifts it. x must not be negative.', fx('pow(x, 3.0)', '// try 0.4 for the opposite bend'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'exp', 'exp(x)', 'e to the power x: grows faster and faster.', fx('exp(x * 3.0) / 20.0'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'log', 'log(x)', 'Natural logarithm: the inverse of exp. x must be above 0.', fx('log(x * 9.0 + 1.0) / 2.31'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'exp2', 'exp2(x)', '2 to the power x.', fx('exp2(x * 4.0) / 16.0'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'log2', 'log2(x)', 'Base-2 logarithm: how many times you can halve x.', fx('log2(x * 15.0 + 1.0) / 4.0'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'sqrt', 'sqrt(x)', 'Square root. Lifts the dark part of a 0..1 value.', fx('sqrt(x)'), { ret: 'genType', G });
add('Power & exponent', 'fn', 'inversesqrt', 'inversesqrt(x)', '1 / sqrt(x), faster than doing it by hand.', fx('inversesqrt(x * 4.0 + 0.25) / 2.0'), { ret: 'genType', G });

// ------------------------------------------------------------------ common math
add('Common math', 'fn', 'abs', 'abs(x)', 'Absolute value: removes the minus sign, folds the picture over. Great for symmetric shapes.', fx('abs(x * 2.0 - 1.0)'), { ret: 'genType', G });
add('Common math', 'fn', 'sign', 'sign(x)', '-1 for negative numbers, 0 for zero, +1 for positive.', fx('0.5 + 0.35 * sign(x - 0.5)'), { ret: 'genType', G });
add('Common math', 'fn', 'floor', 'floor(x)', 'Round down to a whole number. floor(x * n) / n makes steps (posterize).', fx('floor(x * 5.0) / 5.0'), { ret: 'genType', G });
add('Common math', 'fn', 'ceil', 'ceil(x)', 'Round up to a whole number.', fx('ceil(x * 5.0) / 5.0'), { ret: 'genType', G });
add('Common math', 'fn', 'trunc', 'trunc(x)', 'Drop the decimals (round toward zero).', fx('0.5 + trunc((x * 2.0 - 1.0) * 4.0) / 8.0'), { ret: 'genType', G });
add('Common math', 'fn', 'round', 'round(x)', 'Round to the nearest whole number.', fx('round(x * 5.0) / 5.0'), { ret: 'genType', G });
add('Common math', 'fn', 'roundEven', 'roundEven(x)', 'Round to nearest, halves go to the even number (0.5 → 0, 1.5 → 2).', fx('roundEven(x * 5.0) / 5.0'), { ret: 'genType', G });
add('Common math', 'fn', 'fract', 'fract(x)', 'The part after the decimal point (x - floor(x)): a sawtooth from 0 to 1. fract(p * n) repeats a pattern n times.', fx('fract(x * 3.0)'), { ret: 'genType', G });
add('Common math', 'fn', 'mod', 'mod(x, y)', 'Remainder of x divided by y (always has the sign of y). mod(x, 2.0) flips between 0 and 1 and back.', fx('mod(x * 7.0, 2.0) / 2.0'), { ret: 'genType', G });
add('Common math', 'fn', 'min', 'min(a, b)', 'The smaller of two values.', fx('min(x, 0.6)'), { ret: 'genType', G });
add('Common math', 'fn', 'max', 'max(a, b)', 'The larger of two values.', fx('max(x, 0.4)'), { ret: 'genType', G });
add('Common math', 'fn', 'clamp', 'clamp(x, lo, hi)', 'Limit x to the range lo..hi.', fx('clamp(x * 1.6 - 0.3, 0.2, 0.8)'), { ret: 'genType', G });
add('Common math', 'fn', 'mix', 'mix(a, b, t)', 'Blend between a and b: t = 0 gives a, t = 1 gives b, in between is a smooth mix. Works for floats, colours, positions.', `void main() {
  vec3 a = vec3(0.95, 0.35, 0.2);
  vec3 b = vec3(0.2, 0.45, 0.95);
  gl_FragColor = vec4(mix(a, b, vUv.x), 1.0);     // t = vUv.x
}`, { ret: 'genType', G });
add('Common math', 'fn', 'step', 'step(edge, x)', '0 when x is below edge, 1 when it is at or above. A hard cut-off; the edge of a shape.', fx('step(0.5, x)'), { ret: 'genType', G });
add('Common math', 'fn', 'smoothstep', 'smoothstep(edge0, edge1, x)', 'Like step but with a smooth ramp between edge0 and edge1 (0 below edge0, 1 above edge1). The way to get soft edges.', fx('smoothstep(0.2, 0.8, x)'), { ret: 'genType', G });
add('Common math', 'fn', 'isnan', 'isnan(x)', 'True where x is "not a number" (for example 0.0 / 0.0). Useful when debugging black spots.', null, { ret: 'bool', G });
add('Common math', 'fn', 'isinf', 'isinf(x)', 'True where x is infinite.', null, { ret: 'bool', G });
add('Common math', 'fn', 'fma', 'fma(a, b, c)', 'a * b + c in one step.', null, { ret: 'genType', G });
add('Common math', 'fn', 'modf', 'modf(x, out i)', 'Splits x into whole part (written to i) and fraction (returned).', null, { ret: 'genType', G });

// ------------------------------------------------------------------ geometry
add('Geometry', 'fn', 'length', 'length(v)', 'The length of a vector. length(p) is the distance from the origin: concentric circles.', `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p) * 2.0;
  gl_FragColor = vec4(vec3(d), 1.0);
}`, { ret: 'float', G });
add('Geometry', 'fn', 'distance', 'distance(a, b)', 'Distance between two points (= length(a - b)).', `void main() {
  float d = min(distance(vUv, vec2(0.3, 0.6)), distance(vUv, vec2(0.7, 0.35)));   // distance to the nearest of two points
  gl_FragColor = vec4(vec3(0.5 + 0.5 * cos(d * 60.0)), 1.0);
}`, { ret: 'float', G });
add('Geometry', 'fn', 'dot', 'dot(a, b)', 'Dot product: how much two vectors point the same way (1 same, 0 at right angles, -1 opposite for unit vectors). Also gives a gradient along a direction, and is the heart of lighting.', `void main() {
  vec2 p = vUv - 0.5;
  vec2 dir = vec2(cos(0.7), sin(0.7));
  float d = dot(p, dir) + 0.5;                       // a gradient that runs along dir
  gl_FragColor = vec4(vec3(d), 1.0);
}`, { ret: 'float', G });
add('Geometry', 'fn', 'cross', 'cross(a, b)', 'Cross product of two vec3: a vector at right angles to both. Used to build coordinate frames.', `void main() {
  vec3 a = vec3(1.0, 0.0, 0.0);
  vec3 b = normalize(vec3(vUv - 0.5, 0.7));
  gl_FragColor = vec4(abs(cross(a, b)), 1.0);
}`, { ret: 'vec3', G });
add('Geometry', 'fn', 'normalize', 'normalize(v)', 'Scale a vector to length 1, keeping its direction. Directions and normals should usually be normalised before dot() or lighting.', `void main() {
  vec2 n = normalize(vUv - 0.5);                      // direction away from the centre
  gl_FragColor = vec4(n * 0.5 + 0.5, 0.5, 1.0);
}`, { ret: 'genType', G });
add('Geometry', 'fn', 'reflect', 'reflect(I, N)', 'Bounce direction I off a surface with normal N (N must be length 1). Used for mirror reflections.', `void main() {
  vec3 r = reflect(-viewDir(), surfNormal());         // where the mirror image comes from
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}`, { ret: 'genType', G, shape: true });
add('Geometry', 'fn', 'refract', 'refract(I, N, eta)', 'Bend direction I as it enters a material (eta = ratio of refractive indices, e.g. 0.75 for glass seen from air). Returns 0 on total reflection.', `void main() {
  vec3 r = refract(-viewDir(), surfNormal(), 0.75);
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}`, { ret: 'genType', G, shape: true });
add('Geometry', 'fn', 'faceforward', 'faceforward(N, I, Nref)', 'Flip N if it points the wrong way relative to I. Returns N when dot(Nref, I) < 0, otherwise -N.', `void main() {

// ------------------------------------------------------------------ matrices
add('Matrices', 'fn', 'transpose', 'transpose(m)', 'Flip a matrix over its diagonal. For a rotation matrix the transpose rotates back.', `void main() {
  vec2 p = vUv - 0.5;
  float a = 0.8;
  mat2 R = mat2(cos(a), sin(a), -sin(a), cos(a));
  vec2 q = transpose(R) * (R * p);                    // rotate and rotate back: no change
  gl_FragColor = vec4(vec3(step(0.0, sin(q.x * 40.0))), 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'inverse', 'inverse(m)', 'The matrix that undoes m.', `void main() {
  vec2 p = vUv - 0.5;
  mat2 S = mat2(3.0, 0.0, 0.0, 0.6);                  // stretch x by 3, squash y
  vec2 q = inverse(S) * p;                            // undo the stretch: wide stripes
  gl_FragColor = vec4(vec3(step(0.0, sin(q.x * 40.0)) * step(0.0, sin(q.y * 40.0))), 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'determinant', 'determinant(m)', 'A single number that says how much a matrix scales area (0 means it flattens everything).', `void main() {
  float d = determinant(mat2(vUv.x, 0.5, 0.5, vUv.y));
  gl_FragColor = vec4(vec3(0.5 + d), 1.0);
}`, { ret: 'float', G });
add('Matrices', 'fn', 'matrixCompMult', 'matrixCompMult(a, b)', 'Multiply two matrices component by component (the * operator does real matrix multiplication).', `void main() {
  mat2 a = mat2(vUv.x, 1.0, 0.5, vUv.y);
  mat2 b = mat2(0.5, 1.0, 1.0, 0.5);
  mat2 c = matrixCompMult(a, b);
  gl_FragColor = vec4(c[0].x, c[0].y, c[1].x, 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'outerProduct', 'outerProduct(c, r)', 'Matrix made from a column vector times a row vector.', `void main() {
  mat2 m = outerProduct(vec2(1.0, 0.5), vUv);
  gl_FragColor = vec4(m[0], m[1].x, 1.0);
}`, { ret: 'mat', G });

for (const d of DOCS) { const m = /\(([^)]*)\)/.exec(d.sig); d.argc = d.kind === 'fn' ? (m && m[1].trim() ? m[1].split(',').length : 0) : 0; d.key = d.n; }
const DOC_BY = {}; for (const d of DOCS) DOC_BY[d.n] = d;
GL.setNames(new Set(DOCS.filter(d => d.kind === 'fn' && !d.studio).map(d => d.n)), new Set(DOCS.filter(d => d.kind === 'fn' && d.studio).map(d => d.n)), new Set(DOCS.filter(d => d.kind === 'var' || d.kind === 'cn').map(d => d.n)));

/* ===== library.js : the shaders that come with the studio ===== */
const LIB = [];
const sh = (cat, n, code, type) => LIB.push({ cat, n, code: code.trim() + '\n', type: type || 'opaque' });

// ------------------------------------------------------------------ Basics
sh('Basics', 'Solid colour', `
// The simplest shader: one colour, lit by the sun. Try changing the numbers: drag them!
void main() {
  vec3 col = vec3(0.85, 0.38, 0.22);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'UV gradient', `
// Unlit: the texture coordinates shown as colour (red = u, green = v).
void main() {
  gl_FragColor = vec4(vUv, 0.4, 1.0);
}`);
sh('Basics', 'Normals', `
// The surface normal shown as colour: x = red, y = green, z = blue.
void main() {
  vec3 n = surfNormal();
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}`);
sh('Basics', 'Object position', `
// Position on the object (about -1..1) shown as colour. Needs no UVs, so it has no seams.
void main() {
  vec3 p = vPos;
  gl_FragColor = vec4(p * 0.5 + 0.5, 1.0);
}`);
sh('Basics', 'Checkerboard', `
// checker() gives 0 or 1 per square. Multiply the coordinates for more squares.
void main() {
  float c = checker(vUv * 8.0);
  vec3 col = mix(vec3(0.12), vec3(0.92), c);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Diagonal stripes', `
uniform float uCount; // 10 [2, 40]
void main() {
  float t = fract((vUv.x + vUv.y) * uCount * 0.5);
  float stripe = smoothstep(0.0, 0.03, t) * (1.0 - smoothstep(0.47, 0.5, t));
  vec3 col = mix(vec3(0.95, 0.85, 0.3), vec3(0.12, 0.12, 0.14), stripe);
  gl_FragColor = finish(col, 1.0);
}`);

void main() {
  vec2 p = vUv * 6.0;
  float v = sin(p.x + uTime) + sin((p.y + uTime) * 0.7) + sin((p.x + p.y + uTime) * 0.5);
  v += sin(length(p - 3.0) * 1.5 - uTime);
  vec3 col = palette(v * 0.2 + 0.5, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));

sh('Lighting', 'Lambert (by hand)', `
// Diffuse lighting without finish(): the surface is brighter the more it faces the sun.
void main() {
  vec3 n = surfNormal();
  float d = lambert(n, uLightDir);
  vec3 base = vec3(0.8, 0.5, 0.3);
  vec3 col = base * (uAmbSky * 0.6 + uLightCol * d);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Blinn-Phong', `
// Diffuse plus a specular highlight. Raise shininess for a smaller highlight.
uniform float uShine; // 80 [2, 300]
void main() {
  vec3 n = surfNormal(), v = viewDir();
  vec3 base = vec3(0.15, 0.3, 0.7);
  float d = lambert(n, uLightDir);
  float s = blinn(n, uLightDir, v, uShine);
  vec3 col = base * (uAmbSky + uLightCol * d) + uLightCol * s * 0.8;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Toon', `
// Cel shading: light is cut into three flat steps, with a dark outline from the rim.
void main() {
  vec3 n = surfNormal();
  float d = clamp(dot(n, uLightDir), 0.0, 0.999);
  float band = floor(d * 3.0) / 2.0;               // 0, 0.5, 1
  vec3 base = vec3(0.9, 0.35, 0.25);
  vec3 col = base * (0.35 + 0.65 * band);
  col += vec3(1.0) * step(0.96, blinn(n, uLightDir, viewDir(), 60.0)) * 0.6;
  float outline = step(0.72, fresnel(n, viewDir(), 2.0));
  col = mix(col, vec3(0.04), outline);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Rim light', `
// Fresnel: bright where the surface turns away from you. Added after lighting through gSpec.
uniform vec3 uRim; // color 0.4 0.75 1.0
void main() {
  float rim = fresnel(surfNormal(), viewDir(), 3.0);
  gSpec = uRim * rim;
  gl_FragColor = finish(vec3(0.3, 0.32, 0.4), 1.0);
}`);
sh('Lighting', 'Hemisphere light', `
// Colour from the sky above and the ground below, blended by which way the surface faces.

  vec3 n = surfNormal();
  vec3 sky = vec3(0.55, 0.75, 1.0), ground = vec3(0.35, 0.28, 0.2);
  vec3 col = mix(ground, sky, n.y * 0.5 + 0.5);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Gooch (warm / cool)', `

  vec3 n = surfNormal();
  float t = dot(n, uLightDir) * 0.5 + 0.5;
  vec3 col = mix(vec3(0.2, 0.25, 0.6), vec3(0.95, 0.8, 0.5), t);
  col += vec3(1.0) * blinn(n, uLightDir, viewDir(), 90.0) * 0.7;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Soft wrap light', `
// Wrapped diffuse lets light creep past the terminator, with a warm tint in the soft zone (a cheap skin look).

  vec3 n = surfNormal();
  float nl = dot(n, uLightDir);
  float wrap = clamp((nl + 0.6) / 1.6, 0.0, 1.0);
  float soft = smoothstep(0.0, 0.5, wrap) * (1.0 - smoothstep(0.5, 1.0, wrap));
  vec3 base = vec3(0.9, 0.7, 0.6);
  vec3 col = base * (uAmbSky * 0.8 + uLightCol * wrap) + vec3(0.6, 0.12, 0.05) * soft * 0.5;
  gl_FragColor = vec4(col, 1.0);
}`);

uniform float uCols; // 6 [2, 20]
void main() {
  vec2 uv = vUv * vec2(uCols, uCols * 2.0);
  float row = floor(uv.y);
  uv.x += mod(row, 2.0) * 0.5;                       // every second row is shifted
  vec2 f = fract(uv), id = floor(uv);
  float brick = smoothstep(0.02, 0.07, f.x) * smoothstep(0.02, 0.07, 1.0 - f.x) * smoothstep(0.05, 0.14, f.y) * smoothstep(0.05, 0.14, 1.0 - f.y);
  float grain = fbm(uv * 8.0);
  vec3 bc = mix(vec3(0.6, 0.22, 0.14), vec3(0.78, 0.38, 0.22), hash21(id)) * (0.8 + 0.35 * grain);
  vec3 col = mix(vec3(0.62, 0.6, 0.56) * (0.8 + 0.3 * grain), bc, brick);
  gNormal = bumpFromHeight(brick * 0.6 + grain * 0.25, 0.05);
  gHasN = 1.0;
  gl_FragColor = finish(col, 1.0);
}`);

uniform float uWeave; // 30 [6, 80]
void main() {
  vec2 p = vUv * uWeave;
  vec2 id = floor(p), f = fract(p);
  float over = mod(id.x + id.y, 2.0);              // which thread is on top in this cell
  float tx = sin(f.y * 3.14159), ty = sin(f.x * 3.14159);
  float thread = over < 0.5 ? tx : ty;
  vec3 warp = vec3(0.75, 0.25, 0.2), weft = vec3(0.92, 0.88, 0.8);
  vec3 col = (over < 0.5 ? warp : weft) * (0.45 + 0.55 * thread);
  col *= 0.9 + 0.2 * noise(p * 6.0);
  gl_FragColor = finish(col, 1.0);
}`);

void main() {
  vec2 p = vUv * 22.0;
  vec2 id = floor(p), f = fract(p);
  float flip = mod(id.x + id.y, 2.0);
  float strand = flip < 0.5 ? sin(f.x * 3.14159) : sin(f.y * 3.14159);
  float shade = 0.15 + 0.85 * strand * strand;
  vec3 col = vec3(0.03) + vec3(0.2) * shade;
  gShine = 1.0; gRough = 0.2;
  gl_FragColor = finish(col, 1.0);
}`);
sh('Materials', 'Hexagon tiles', `
vec4 hexGrid(vec2 p) {
  vec2 r = vec2(1.0, 1.7320508), h = r * 0.5;
  vec2 a = mod(p, r) - h, b = mod(p - h, r) - h;
  vec2 gv = dot(a, a) < dot(b, b) ? a : b;
  return vec4(p - gv, gv);
}
float hexDist(vec2 p) { p = abs(p); return max(dot(p, normalize(vec2(1.0, 1.7320508))), p.x); }
void main() {
  vec4 h = hexGrid(vUv * 8.0);
  float edge = smoothstep(0.0, 0.07, 0.5 - hexDist(h.zw));
  vec3 tile = palette(hash21(h.xy), vec3(0.45), vec3(0.2), vec3(1.0), vec3(0.0, 0.2, 0.4));
  vec3 col = mix(vec3(0.05), tile, edge);
  gNormal = bumpFromHeight(edge * 0.5, 0.04); gHasN = 1.0;
  gShine = 0.6; gRough = 0.3;
  gl_FragColor = finish(col, 1.0);
}`);

sh('Effects', 'Dissolve', `
// Noise decides which parts vanish first; discard throws pixels away; a glowing edge marks the burn line.
void main() {
  float n = fbm3(vPos * 2.5);
  float t = fract(uTime * 0.2) * 1.2 - 0.1;       // loops
  if (n < t) discard;
  float edge = 1.0 - smoothstep(0.0, 0.07, n - t);
  vec3 col = vec3(0.55, 0.55, 0.6);
  gl_FragColor = finish(col, 1.0);
  gl_FragColor.rgb += vec3(1.0, 0.5, 0.1) * edge * 2.0;
}`);
sh('Effects', 'Cutaway (slice)', `
// Everything above a moving plane is discarded. gl_FrontFacing tells us we see the inside, which we paint solid.
void main() {
  float cut = 0.15 + 0.5 * sin(uTime);
  if (vPos.y > cut) discard;
  vec3 col = vec3(0.85, 0.5, 0.25);
  if (!gl_FrontFacing) col = vec3(0.15, 0.55, 0.85);
  gl_FragColor = vec4(col * (gl_FrontFacing ? 0.5 + 0.5 * lambert(surfNormal(), uLightDir) : 1.0), 1.0);
}`);
sh('Effects', 'Hologram', `

  float scan = 0.5 + 0.5 * sin(vW.y * 90.0 - uTime * 4.0);
  float flicker = 0.9 + 0.1 * sin(uTime * 40.0) * sin(uTime * 7.0);
  vec3 col = vec3(0.1, 0.8, 1.0) * (0.35 + 0.65 * scan) + vec3(0.7, 1.0, 1.0) * rim;
  gl_FragColor = vec4(col * flicker, (0.25 + 0.6 * rim) * (0.5 + 0.5 * scan));
}`, 'transparent');
sh('Effects', 'Force field', `
// Set the type to "transparent". A hexagon grid that glows at the rim, with a ring of light sweeping up.
vec4 hexGrid(vec2 p) {
  vec2 r = vec2(1.0, 1.7320508), h = r * 0.5;
  vec2 a = mod(p, r) - h, b = mod(p - h, r) - h;
  vec2 gv = dot(a, a) < dot(b, b) ? a : b;
  return vec4(p - gv, gv);
}
float hexDist(vec2 p) { p = abs(p); return max(dot(p, normalize(vec2(1.0, 1.7320508))), p.x); }
void main() {
  vec3 n = surfNormal();
  float rim = fresnel(n, viewDir(), 2.5);
  vec2 q = vec2(atan(vPos.z, vPos.x) * 1.6, vPos.y * 3.0);
  vec4 h = hexGrid(q * 2.0);
  float line = 1.0 - smoothstep(0.0, 0.08, 0.5 - hexDist(h.zw));
  float sweep = 1.0 - smoothstep(0.0, 0.25, abs(fract(uTime * 0.3) * 2.0 - 1.0 - vPos.y));
  vec3 col = vec3(0.15, 0.6, 1.0) * (rim * 1.2 + line * 0.9 + sweep * 1.2);
  gl_FragColor = vec4(col, clamp(rim * 0.6 + line * 0.7 + sweep * 0.6, 0.0, 1.0));
}`, 'transparent');

void main() {
  vec2 p = vUv * 2.0 - 1.0;
  float d = 1.0e3;
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    vec2 c = 0.55 * vec2(sin(uTime * (0.6 + 0.2 * fi) + fi * 2.0), cos(uTime * (0.5 + 0.15 * fi) + fi * 1.7));
    d = smin(d, sdCircle(p - c, 0.2), 0.35);

  col += vec3(0.4, 0.15, 0.1) * (1.0 - smoothstep(0.0, 0.3, d)) * (1.0 - sdfFill(d));

sh('SDF & fractals', 'Mandelbrot', `
uniform float uZoom;   // 1 [0.5, 60]
uniform vec2 uCenter;  // -0.75 0.0
void main() {
  vec2 c = (vUv - 0.5) * 3.2 / uZoom + uCenter;
  vec2 z = vec2(0.0);
  int n = 0;
  for (int i = 0; i < 200; i++) {
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    if (dot(z, z) > 256.0) break;
    n++;
  }
  float s = float(n) - log2(max(log2(dot(z, z)), 1.0e-4)) + 4.0;
  vec3 col = n >= 200 ? vec3(0.0) : palette(s * 0.03, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.1, 0.2));
  gl_FragColor = vec4(col, 1.0);
}`);

// ====================================================================== 1
lesson('basics', 'The very first shader: main() and colour', 'Absolute beginner',
  'One line that paints everything red, then what `void main()`, `gl_FragColor`, `vec4` and the four colour numbers really mean.', [
  { t: 'One line, one colour', x: `This is a complete shader. It has exactly one job: **decide the colour of a pixel**. The line sets \`gl_FragColor\`, the shader's output, to four numbers: red, green, blue and alpha.

Red is 1.0 (full), green and blue are 0.0 (none), so everything is red. The \`void main() { }\` around it is the wrapper every shader needs; the next step explains it.`,
    new: ['gl_FragColor', 'vec4'], try: 'Click the line and change a number, for example the second one to 1.0. The big preview updates instantly.',
    code: `void main() {
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
}` },
  { t: 'What void main() { } means', x: `\`main\` is the **name** of the function the graphics card runs. You never call it yourself: the card calls it for you, **once for every pixel**.

\`void\` means "this function gives nothing back". Instead it *writes* its answer into \`gl_FragColor\`. Whatever is in there when \`main\` ends becomes the pixel's colour.

The curly braces \`{ }\` hold everything that belongs to \`main\`. Every line that does something ends with a **semicolon**. A missing semicolon is the most common first error; the red message under the editor tells you which line.

Text after \`//\` is a **comment**: the computer ignores it, it's a note for you.`,
    new: [N('main', 'void main() { ... }', 'The function the card runs once for every pixel. Your code goes between the braces.')],
    try: 'Delete the semicolon at the end of the gl_FragColor line and read the error message. Then put it back.',
    code: `void main() {
  // everything in here runs once per pixel
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);   // red
}` },
  { t: 'The four numbers: r, g, b, a', x: `The colour is **four numbers, always in this order**:

**r** red amount, **g** green amount, **b** blue amount, **a** alpha (how solid; 1.0 is fully solid).

Each goes from **0.0** (none) to **1.0** (full). A screen makes every colour by mixing red, green and blue light, so mixing means **adding light**: red + green = **yellow**, all three = **white**, none = **black**.

Alpha only matters when the shader type (top bar) is set to *transparent*. Otherwise leave it at 1.0.`,
    try: 'Make green: (0.0, 1.0, 0.0, 1.0). Make grey: (0.5, 0.5, 0.5, 1.0). Make white. Make black.',
    code: `void main() {
  gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0);
}` },
  { t: 'Give each number a name', x: `\`vec4(1.0, 1.0, 0.0, 1.0)\` is hard to read: which number is which? Let's **name the four numbers** first.

\`float\` is the type for **one decimal number**. We make four of them, called r, g, b and a, and hand them to \`vec4(...)\` in the same order. The picture is identical to the last step; only the writing is clearer.

This is the pattern every shader uses: **work out some numbers, then gather them into a colour on the last line.**`,
    new: ['float'], try: 'Change the value of b from 0.0 to 1.0. The yellow becomes white.',
    code: `void main() {
  float r = 1.0;
  float g = 1.0;
  float b = 0.0;
  float a = 1.0;
  gl_FragColor = vec4(r, g, b, a);
}` },
  { t: 'Numbers can be calculated', x: `A number doesn't have to be typed in. It can be **calculated from other numbers**. Here \`b\` is "one minus r", so when r is 0.5, b is 0.5.

Also: always write **1.0, not 1**. GLSL is strict: \`1\` is a whole number (an *int*), \`1.0\` is a decimal number (a *float*), and it will **not** convert between them for you. Using \`1\` where a float is needed is a common error.`,
    try: 'Change r to 0.9: b follows automatically (it becomes 0.1).',
    code: `void main() {
  float r = 0.5;
  float g = 0.2;
  float b = 1.0 - r;
  float a = 1.0;
  gl_FragColor = vec4(r, g, b, a);
}` },
  { t: 'What is a vector?', x: `\`vec4\` is a **vector**: a small bundle of numbers stored under one name. Three sizes matter:

**vec2**: two numbers, usually a *position* (x, y)
**vec3**: three numbers, usually a *colour* (r, g, b) or a *direction*
**vec4**: four numbers, a colour with alpha

You can reach each part by name. For colours: \`.r .g .b .a\`. For positions: \`.x .y .z .w\`. These are the **same four slots with different names**: \`c.r\` and \`c.x\` are the same number. You can read a part (\`c.r\`) or change it (\`c.g = 0.9;\`).`,
    new: [N('c.r  c.g  c.b  c.a', 'c.r   c.x', 'Pick one part of a vector by name (r, g, b, a for colours; x, y, z, w for positions).')],
    try: 'Change the 0.9 on the c.g line, or change c.r = 0.0 to see only green.',
    code: `void main() {
  vec4 c = vec4(1.0, 0.5, 0.0, 1.0);
  c.g = 0.9;
  gl_FragColor = c;
}` },
  { t: 'vec3: a colour without alpha', x: `Most of the time you only care about red, green and blue, and alpha is always 1.0. So we make an RGB colour with **vec3** and add the alpha at the very end:

\`vec4(col, 1.0)\` means "the three numbers of col, then 1.0": a vec4 built from a vec3 plus one float. GLSL lets you mix pieces like this, as long as the total count is right.

Two shortcuts: \`vec3(0.5)\` means \`vec3(0.5, 0.5, 0.5)\` (a grey), and \`.rgb\` picks the first three parts of a vec4.`,
    new: ['vec3'], try: 'Try vec3(0.5) as the colour for a grey, or vec3(1.0, 0.3, 0.6) for pink.',
    code: `void main() {
  vec3 col = vec3(0.2, 0.6, 1.0);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Maths on vectors', x: `Arithmetic on a vector works on **all its parts at once**:

\`col * 0.5\`: every part halved (darker)
\`col + 0.2\`: 0.2 added to every part (lighter)
\`col * tint\`: matching parts multiplied (red × red, green × green...)

Multiplying two colours is how you **tint** something: a blue thing times an orange tint keeps only what both colours share, so it gets dark and murky. Below, the sky blue is multiplied by the tint, then 0.1 is added to all three parts.`,
    try: 'Set tint to vec3(1.0) and nothing changes (multiplying by 1 does nothing). Set it to vec3(0.5) and everything halves.',
    code: `void main() {
  vec3 col = vec3(0.2, 0.6, 1.0);
  vec3 tint = vec3(1.0, 0.7, 0.3);
  col = col * tint;
  col = col + 0.1;
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'The limits: below 0 and above 1', x: `A screen can only show 0 to 1. A value of 3.0 is **clamped** and looks exactly like 1.0; a negative value looks like 0.0 (black). This colour is orange-red with its red part at 3.0: it looks the same as with 1.0.

The extra brightness isn't lost *inside* the shader, though: if you later multiply or blend, a 3.0 stays strong. That's how glows are made.

You now know every piece in a one-line shader. Next lesson: what the card actually does with it.`,
    try: 'Change 3.0 to 1.0, then to -1.0, and see which changes look different.',
    code: `void main() {
  vec3 col = vec3(3.0, 0.5, 0.2);
  gl_FragColor = vec4(col, 1.0);
}` },
]);

lesson('pixels', 'How shaders run: one pixel at a time', 'Absolute beginner',
  'Your code runs separately for every pixel, and a pixel cannot see its neighbours. What follows from that, and how to think about it.', [
  { t: 'The same code, everywhere at once', x: `A shader is **one small program run again and again, once for each pixel** of the object, all at the same moment (a graphics card has thousands of tiny processors). A 500 × 500 picture means 250,000 runs of \`main()\`.

Every run is the same code. If they all received the same input they'd all give the same colour. What makes the picture interesting is that **each pixel is told where it is**, through an input called [[vUv]]. \`vUv\` is a vec2: \`vUv.x\` is 0 at the left edge and 1 at the right edge. (You can use \`.x .y\` and \`.r .g\` interchangeably, they're the same slots.)

Here the colour is simply the pixel's own x position, repeated three times as a grey. Every pixel runs the same formula; the left ones get small numbers, the right ones large.`,
    new: ['vUv'], try: 'Change vUv.x to vUv.y: the gradient turns to go from bottom (black) to top (white).',
    code: `void main() {
  float g = vUv.x;
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'Two numbers: x and y', x: `\`vUv\` has **two** numbers: x runs 0 to 1 from left to right, y runs 0 to 1 from the bottom to the top. Here they become the red and green parts of the colour.

Look at the corners: bottom-left has x = 0, y = 0 so it's black. Top-right has both at 1, so red + green = yellow. Bottom-right is only red, top-left only green. Once you can predict this picture, you understand \`vUv\`.`,
    try: 'Put vUv.y in the blue slot too: vec4(vUv.x, vUv.y, vUv.y, 1.0).',
    code: `void main() {
  gl_FragColor = vec4(vUv.x, vUv.y, 0.0, 1.0);
}` },
  { t: 'Every pixel does its own sum', x: `Now do some maths with it. \`vUv.x * vUv.x\` multiplies a pixel's x by itself. A pixel at x = 0.5 computes 0.25. A pixel at x = 1.0 computes 1.0. So the picture is dark for a long way and then brightens quickly: the gradient has been *bent*.

The important part: **each pixel just did a small sum with its own position.** It did not look at the pixel next to it. The picture looks smooth only because the formula is smooth: tiny change in position, tiny change in answer.`,
    try: 'Try vUv.x * vUv.y (a corner gradient), or vUv.x * 0.5 (a darker gradient).',
    code: `void main() {
  float g = vUv.x * vUv.x;
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'The big rule: pixels cannot talk to each other', x: `Here is the most important idea in shader writing:

**Each pixel is calculated alone. It cannot read its neighbour's colour, and it cannot see what any other pixel is doing.**

They all run at the same moment, so there is no "left pixel first, then me", and nothing to look at. Writing "my colour = my left neighbour's colour plus a bit" is impossible: there is nowhere to read that from.

What a pixel *can* know: **its own position** (like \`vUv\`), **numbers that are the same for everybody** (like time, next step), and **the maths in your code**.

Consequences you'll see over and over:
**1.** Nothing is remembered between pixels, or between frames. Variables are born when the pixel's run starts and vanish when it ends.
**2.** To make a shape you don't "draw it": every pixel asks *"am I inside the shape?"* from its own position.
**3.** To make something move, you change an **input** that every pixel receives.`, },
  { t: 'fract: count up, then start over', x: `Before we meet time, one small tool, because time **never stops growing** (1, 2, 3 ... 100 ... 5000 seconds) and we'll want it to start over again and again.

[[fract]](x) throws away the whole part of a number and keeps only the decimals: 1.7 becomes 0.7, 2.3 becomes 0.3, 4.0 becomes 0.0. Feed it a number that keeps growing and you get a **ramp from 0 to 1 that restarts** each time the number passes a whole number. (This kind of "wrap around" is also called *modulo*; you'll meet the full version, \`mod\`, later.)

Here \`vUv.x * 3.0\` grows from 0 to 3 across the picture, so the ramp restarts twice and you see **three** ramps. The multiplier is how many repeats.`,
    new: ['fract'], try: 'Change 3.0 to 1.0 (one ramp, same as before), then to 8.0.',
    code: `void main() {
  float f = fract(vUv.x * 3.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}` },
  { t: 'Same for everyone: uTime', x: `[[uTime]] is the number of **seconds since the shader started**. **Every pixel receives the same value** of \`uTime\` in a given frame: a number that is "the same for everybody" is called a **uniform**. You can watch it counting next to the shape buttons above the previews ("uTime 4.2").

Used on its own it has a problem: it only ever grows. \`uTime * 0.25\` would reach 1.0 (full red) after 4 seconds and then stay white-hot forever, because the screen can't show more than 1.0. So we wrap it with \`fract\`: \`fract(uTime * 0.25)\` counts 0 to 1 over four seconds and **starts again, forever**. The whole picture is one flat red that pulses up and restarts every 4 seconds. Not a gradient: every pixel agrees.

The picture moves because *the input* changed; nothing was remembered from the previous frame. If you want to restart time by hand, **click the "uTime" number** above the previews: it jumps back to 0.`,
    new: ['uTime'], try: 'Change 0.25 to 1.0 to make it restart every second. Click the uTime number above the preview to jump back to 0.',
    code: `void main() {
  float r = fract(uTime * 0.25);
  gl_FragColor = vec4(r, 0.0, 0.0, 1.0);
}` },
  { t: 'Different per pixel vs. the same for everyone', x: `Now you know both kinds of input, and a lot of the docs use these words:

**Per-pixel inputs** (often called *varyings*) **differ from pixel to pixel**: \`vUv\`, \`vPos\` (3D position), \`vN\` (surface direction).

**Uniforms** are **the same for every pixel**: \`uTime\`, \`uSeed\`, the light direction, and the sliders in the Uniforms tab.

In this picture red comes from \`vUv.x\` (differs across the picture), green from \`vUv.y\` (differs), and blue from \`fract(uTime * 0.25)\` (identical everywhere, it counts up and restarts). Only the blue changes over time.`,
    try: 'Replace the whole fract(uTime * 0.25) with 0.5 for a still picture.',
    code: `void main() {
  gl_FragColor = vec4(vUv.x, vUv.y, fract(uTime * 0.25), 1.0);
}` },
  { t: 'Think like a single pixel', x: `So shader writing is a particular way of thinking. Before writing code, imagine you are **one pixel** and ask: *"What do I know about myself, and from that, what colour should I be?"*

To draw a circle in the middle you don't draw anything. Each pixel asks: **"how far am I from the middle?"** Pixels that are close answer "light", the others answer "dark", and together they *look* like a circle. Nobody drew it.

That's exactly the next lesson: we'll turn position into a distance, and a distance into a shape. Every effect in this studio is built that way:

**position** → **a number** (distance, angle, noise...) → **a colour**`, },
]);

lesson('shapes', 'Making shapes from position', 'Beginner',
  'Centre the coordinates, measure distance, and cut it into a hard or soft edged circle. You will learn length, distance, step, smoothstep and mix.', [
  { t: 'Move the zero to the middle', x: `\`vUv\` starts in the corner. For round things we want (0, 0) in the **middle**. Subtracting 0.5 from a vec2 subtracts it from **both** x and y: now each runs from -0.5 to 0.5.

We name the result \`p\` ("position"). The picture shows \`p.x\` as red and \`p.y\` as green. Notice that only the **top-right** quarter is coloured: the left half has negative x and the bottom half has negative y, and **negative numbers show as black**.`,
    new: ['vec2'], try: 'Try vUv - 0.3 and watch where the colour starts.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  gl_FragColor = vec4(p.x, p.y, 0.0, 1.0);
}` },
  { t: 'length: how far from the middle', x: `[[length]] takes a vector and gives back **how long it is**. For a position that's the **distance from (0, 0)**, which is now the middle. (It's Pythagoras: the square root of x² + y².)

The result is 0 in the centre and grows outwards equally in every direction, and *that* is why you get a circle shape. Black in the middle, brighter outwards.`,
    new: ['length'], try: 'Draw the opposite: gl_FragColor = vec4(vec3(1.0 - d), 1.0); is a bright centre.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'Zoom by multiplying', x: `Multiplying the position **changes the scale**. \`p * 3.0\` makes every number three times as big, so the distance grows three times as fast: the circle pattern gets **smaller** (you reach white quickly). Dividing would make it bigger.

Rule of thumb: **multiply a position to get more of a pattern, divide to get less.** You'll use this constantly: \`vUv * 10.0\` repeats something ten times across.`,
    try: 'Try 1.0, 2.0, 6.0 and 20.0.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p * 3.0);
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'distance: from any point', x: `\`length(p)\` measures the distance from the middle. What about from another point? [[distance]](a, b) is the distance between two positions. It's the same as \`length(a - b)\`.

Here the point is \`vec2(0.2, 0.1)\`: to the right of the middle and a bit up, so that's where it's darkest. **Moving the point moves the circle.**`,
    new: ['distance'], try: 'Change the two numbers in vec2(0.2, 0.1). Drag them with the mouse.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = distance(p, vec2(0.2, 0.1));
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'step: a hard on/off switch', x: `So far we have smooth gradients. To get a **sharp edge** we need a switch. [[step]](edge, x) gives back **0.0 if x is below the edge, and 1.0 if x is at or above it**. Nothing in between.

Here x is the pixel's horizontal position and the edge is 0.5: left half 0 (black), right half 1 (white).`,
    new: ['step'], try: 'Change 0.5 to 0.2 or 0.8 and the edge moves. Change vUv.x to vUv.y.',
    code: `void main() {
  float s = step(0.5, vUv.x);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'A hard-edged circle', x: `Combine the two: take the **distance** from the middle (0 in the centre, bigger outward) and cut it with \`step\`.

\`step(0.3, d)\` is **0 close to the middle** (d below 0.3) and **1 outside**. That's the opposite of what we want, so we flip it with \`1.0 - ...\`: 0 becomes 1, and 1 becomes 0. Now the inside is white.

A 0/1 picture like this is called a **mask**: 1 means "yes, this pixel is part of it".`,
    try: 'Change 0.3 to make the circle bigger or smaller. Delete the "1.0 -" to see it inverted.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - step(0.3, d);
  gl_FragColor = vec4(vec3(m), 1.0);
}` },
  { t: 'smoothstep: a soft switch', x: `A hard edge looks jagged. [[smoothstep]](a, b, x) is a **soft step**: it gives 0.0 when x is below \`a\`, 1.0 when x is above \`b\`, and a **smooth blend in between**. The wider the gap between a and b, the softer the transition.

Here the x position goes from 0.3 to 0.7: below 0.3 it's black, above 0.7 it's white, and in between it's a gentle ramp.`,
    new: ['smoothstep'], try: 'Make a and b closer (0.49, 0.51): it almost becomes a hard step. Make them far apart (0.0, 1.0).',
    code: `void main() {
  float s = smoothstep(0.3, 0.7, vUv.x);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'A soft-edged circle', x: `Swap \`step\` for \`smoothstep\` in the circle. The fade now happens between the distance 0.28 and 0.32, a thin soft edge instead of a staircase. Still inverted with \`1.0 -\` so the inside is white.

You now have the two standard ways to make a mask: **step** (hard) and **smoothstep** (soft). Almost every shape in a shader is "make a distance, then smoothstep it".`,
    try: 'Widen the fade: smoothstep(0.1, 0.4, d).',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - smoothstep(0.28, 0.32, d);
  gl_FragColor = vec4(vec3(m), 1.0);
}` },
  { t: 'mix: blend two things', x: `[[mix]](a, b, t) **blends from a to b**: t = 0 gives a, t = 1 gives b, t = 0.5 is halfway. It works on numbers and on colours (it blends every part).

Here t is the pixel's x position, so the colour fades from red on the left to blue on the right.`,
    new: ['mix'], try: 'Change the two colours. Use vUv.y instead of vUv.x.',
    code: `void main() {
  vec3 a = vec3(1.0, 0.1, 0.1);
  vec3 b = vec3(0.1, 0.1, 1.0);
  vec3 col = mix(a, b, vUv.x);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Put it together: a mask picks the colour', x: `Now the circle mask is the \`t\` in \`mix\`: where the mask is 0 you get the background colour, where it is 1 you get the circle colour, and in the soft edge you get a blend.

**Mask + mix is the basic way to layer anything in a shader.** Everything later is a variation: make a mask (some shape, pattern or noise), then \`mix\` two looks with it.`,
    try: 'Change the two colours. Then make the circle bigger with the 0.28 / 0.32 numbers.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - smoothstep(0.28, 0.32, d);
  vec3 bg = vec3(0.05, 0.05, 0.2);
  vec3 disc = vec3(1.0, 0.6, 0.2);
  gl_FragColor = vec4(mix(bg, disc, m), 1.0);
}` },
]);

lesson('orb', 'Build a glowing orb', 'Beginner',
  'Use everything so far, and add exp (for glow) and sin (for pulsing) to build an animated orb.', [
  { t: 'Where we are', x: `This is the soft circle from the last lesson, with a dark blue background. We'll add a **glow** around it and make it **pulse**. First we need two new tools.`,
    try: 'Warm-up: change the colours, or the radius numbers.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float orb = 1.0 - smoothstep(0.25, 0.29, d);
  vec3 bg = vec3(0.02, 0.02, 0.08);
  vec3 col = mix(bg, vec3(1.0, 0.6, 0.2), orb);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'exp: a number that fades quickly', x: `[[exp]](x) is a function with a very useful shape when you feed it a **negative** number: \`exp(-d)\` is 1.0 when d is 0, and drops quickly towards 0 as d grows.

Feed it the distance from the middle and you get something that is **bright in the middle and fades smoothly away**: a glow. The number you multiply d by is the *tightness*: \`exp(-d * 2.0)\` is wide and soft, \`exp(-d * 10.0)\` is small and sharp.`,
    new: ['exp'], try: 'Try 2.0, then 10.0, then 20.0 in place of 6.0.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float glow = exp(-d * 6.0);
  gl_FragColor = vec4(vec3(glow), 1.0);
}` },
  { t: 'Add the glow behind the orb', x: `A glow is **extra light**, so we *add* it: \`bg\` becomes the dark blue plus orange times the glow amount (0.6 to keep it gentle). We do this to the background **before** the orb is mixed on top, so the glow never covers the orb itself.`,
    try: 'Change 0.6 to make the glow stronger or weaker.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float orb = 1.0 - smoothstep(0.25, 0.29, d);
  float glow = exp(-d * 6.0);
  vec3 bg = vec3(0.02, 0.02, 0.08) + vec3(1.0, 0.4, 0.1) * glow * 0.6;
  vec3 col = mix(bg, vec3(1.0, 0.6, 0.2), orb);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'sin: a smooth wave', x: `[[sin]](x) turns a steadily growing number into a **wave** that goes up and down between -1 and 1 and repeats forever. Feed it the x position times 20 and you get 20-ish bumps across the picture.

Because a wave goes *negative* and the screen can't show negative, we squash it into 0..1 with \`0.5 + 0.5 * sin(...)\`: halve it (-0.5 to 0.5), then shift it up (0 to 1). You'll see this "* 0.5 + 0.5" trick a lot.`,
    new: ['sin'], try: 'Change 20.0 to 5.0 (wider stripes) or 60.0 (finer stripes).',
    code: `void main() {
  float s = 0.5 + 0.5 * sin(vUv.x * 20.0);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'sin of time: pulsing', x: `Put \`uTime\` inside the \`sin\`: now the wave is over *time* instead of position, so the number slowly swings up and down. Multiply \`uTime\` to change the speed.

The orb radius becomes \`r = 0.25 + 0.03 * sin(uTime * 3.0)\`: a base size of 0.25 with a wobble of ±0.03. **Animation = take something fixed and add a sin of time to it.** It pulses by itself in the picture.`,
    try: 'Change 3.0 to speed it up, 0.03 for a bigger wobble.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float r = 0.25 + 0.03 * sin(uTime * 3.0);
  float orb = 1.0 - smoothstep(r, r + 0.04, d);
  float glow = exp(-d * 6.0);
  vec3 bg = vec3(0.02, 0.02, 0.08) + vec3(1.0, 0.4, 0.1) * glow * 0.6;
  vec3 col = mix(bg, vec3(1.0, 0.6, 0.2), orb);
  gl_FragColor = vec4(col, 1.0);
}` },
]);
