lesson('b-voronoi', 'Build voronoi: cells and cracks', 'Building the helpers',
  'Scatter one random point in every grid cell, and for each pixel find the nearest one. You get cells, scales, stones and (from the borders) cracks.', [
  { t: 'One random point per cell', x: `Give every grid cell **one random point** somewhere inside it. The hash from before picks where (it needs two numbers, an x and a y; here we make them with two hashes).

For each pixel we measure the **distance to the point of its own cell**. This is a first attempt, and it shows a problem: the distance jumps at cell borders, because a pixel might be much closer to a point in the *next* cell.`,
    try: 'Look at the hard straight lines at the cell borders. The next step fixes them.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 6.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 point = vec2(myHash2(i), myHash2(i + 5.3));
  gl_FragColor = vec4(vec3(distance(f, point)), 1.0);
}` },
  { t: 'Check the neighbours too', x: `The nearest point might be in any of the 8 surrounding cells. So loop over the **3 × 3 block** of cells around the pixel (offsets -1, 0, 1 in each direction), measure the distance to each cell's point, and keep the **smallest**.

The borders are gone, and each point now owns a smooth cone-shaped region. Those regions are called *Voronoi cells*.`,
    try: 'Change the loop bounds from -1..1 to 0..0 and watch the borders return.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 6.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float nearest = 8.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 cell = vec2(float(x), float(y));
      vec2 point = vec2(myHash2(i + cell), myHash2(i + cell + 5.3));
      nearest = min(nearest, distance(f, cell + point));
    }
  }
  gl_FragColor = vec4(vec3(nearest), 1.0);
}` },
  { t: 'The second-nearest gives the edges', x: `Also keep the **second-smallest** distance. Inside a cell the nearest point is much closer than the second, but exactly **on a border the two are equal**. So \`second - nearest\` is **0 on the borders** and grows inside the cells. Pass that through \`smoothstep\` and you get **thin crack lines**.

\`if (condition) { ... } else if (...)\` runs a block only when its condition is true. Here: a new nearest distance pushes the old nearest down to second place.

This is why the studio's \`voronoi\` returns three numbers: the nearest distance, the **edge** value (second minus nearest), and a random **id** for each cell.`,
    new: ['if'], try: 'Change 0.06 to 0.15 for fatter cracks.',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 6.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 cell = vec2(float(x), float(y));
      vec2 point = vec2(myHash2(i + cell), myHash2(i + cell + 5.3));
      float d = distance(f, cell + point);
      if (d < d1) { d2 = d1; d1 = d; }
      else if (d < d2) { d2 = d; }
    }
  }
  float crack = smoothstep(0.0, 0.06, d2 - d1);
  gl_FragColor = vec4(vec3(crack), 1.0);
}` },
  { t: 'A random id for every cell', x: `The last number is the cell's **id**: a random number that is the same everywhere inside one cell. We get it by hashing the **cell that won** (the one that gave the smallest distance) and remembering it. With the id you can give every stone its own colour, height or rotation.

Together, \`d1\`, the edge, and the id make cobblestones, scales, giraffe skin, cracked mud, soap bubbles...`,
    new: ['voronoi'], try: 'Use the id for brightness instead: vec3(id).',
    code: `uint myMix(uint h) {
  h ^= h >> 16u;
  h *= 0x7feb352du;
  h ^= h >> 15u;
  h *= 0x846ca68bu;
  h ^= h >> 16u;
  return h;
}
float myHash2(vec2 p) {
  uvec2 b = floatBitsToUint(p);
  return float(myMix(b.x * 0x9e3779b1u + b.y * 0x85ebca6bu) >> 8u) / 16777216.0;
}
void main() {
  vec2 p = vUv * 6.0;
  vec2 i = floor(p);
  vec2 f = fract(p);
  float d1 = 8.0;
  float d2 = 8.0;
  vec2 winner = vec2(0.0);
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 cell = vec2(float(x), float(y));
      vec2 point = vec2(myHash2(i + cell), myHash2(i + cell + 5.3));
      float d = distance(f, cell + point);
      if (d < d1) { d2 = d1; d1 = d; winner = i + cell; }
      else if (d < d2) { d2 = d; }
    }
  }
  float id = myHash2(winner + 11.0);
  vec3 stone = vec3(id, 0.5 + 0.3 * id, 0.4);
  float crack = smoothstep(0.0, 0.06, d2 - d1);
  gl_FragColor = vec4(stone * crack, 1.0);
}` },
]);

lesson('b-sdf', 'Build shapes from distance (sd functions)', 'Building the helpers',
  'Each shape is a tiny formula that says how far a point is from the shape\'s edge. Build circle, box, rounded box, ring, blend and a crisp, smooth fill.', [
  { t: 'A shape is a distance', x: `A *signed distance function* answers one question: **how far is this point from the shape's edge?** It is **negative inside**, **zero on the edge** and **positive outside**. Once you have that number you can fill the shape, outline it, glow it, blend it with others, all with the same few lines.

The circle is the simplest: distance from the centre, minus the radius. We shift the origin to the middle of the screen first (\`vUv - 0.5\`).`,
    try: 'Change 0.25 for a bigger or smaller circle.',
    code: `float myCircle(vec2 p, float r) {
  return length(p) - r;
}
void main() {
  vec2 p = vUv - 0.5;
  float d = myCircle(p, 0.25);
  gl_FragColor = vec4(vec3(step(d, 0.0)), 1.0);
}` },
  { t: 'A box', x: `For a box, take the absolute value so the four corners behave the same (\`abs\`), then see how far you are **past each side** (\`abs(p) - half size\`). If you are past a side the distance grows; if you are past a corner it is the straight-line distance to the corner, and the \`max\`/\`min\` pieces handle inside and outside.

Don't try to derive the formula; **read the two cases**: outside it is \`length(max(q, 0.0))\`, inside it is the largest negative \`q\`.`,
    try: 'Change the box size vec2(0.3, 0.15).',
    code: `float myBox(vec2 p, vec2 hs) {
  vec2 q = abs(p) - hs;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
}
void main() {
  vec2 p = vUv - 0.5;
  float d = myBox(p, vec2(0.3, 0.15));
  gl_FragColor = vec4(vec3(step(d, 0.0)), 1.0);
}` },
  { t: 'Round it, outline it', x: `Because \`d\` is a real distance, new shapes come almost free.

**Rounded box:** shrink the box by the corner radius, then subtract the radius from the distance (it grows back, with round corners).
**Ring or outline:** take the absolute value of the distance (distance to the edge, from both sides) and subtract a thickness.

The same trick turns *any* shape into an outline.`,
    try: 'Change the corner radius 0.08 and the line thickness 0.01.',
    code: `float myBox(vec2 p, vec2 hs) {
  vec2 q = abs(p) - hs;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0);
}
float myRoundBox(vec2 p, vec2 hs, float r) {
  return myBox(p, hs - r) - r;
}
void main() {
  vec2 p = vUv - 0.5;
  float d = myRoundBox(p, vec2(0.3, 0.15), 0.08);
  float outline = abs(d) - 0.01;
  gl_FragColor = vec4(vec3(step(outline, 0.0)), 1.0);
}` },
  { t: 'Smooth edges without blur', x: `\`step\` gives jagged, stair-stepped edges. The cure is a fill that goes from 1 to 0 **over exactly one pixel**. How wide is one pixel in distance units? \`fwidth(d)\` tells you: how much \`d\` changes between neighbouring pixels. So the fill is a \`smoothstep\` between \`-w\` and \`+w\`.

This is the studio's \`sdfFill\`. Works at any zoom, and the edge is one pixel soft no matter how big the shape is.`,
    new: ['sdfFill', 'fwidth'], try: 'Compare to step(d, 0.0): zoom in the preview and look at the edge.',
    code: `float myCircle(vec2 p, float r) {
  return length(p) - r;
}
void main() {
  vec2 p = vUv - 0.5;
  float d = myCircle(p, 0.3);
  float w = max(fwidth(d), 0.00001);
  float fill = 1.0 - smoothstep(-w, w, d);
  gl_FragColor = vec4(vec3(fill), 1.0);
}` },
  { t: 'Blend two shapes', x: `To **join** two shapes take the smaller distance: \`min(a, b)\`. That makes a hard crease where they meet. A **smooth minimum** rounds the crease so the shapes melt into each other like drops of liquid.

\`smin\` works by dipping the result a little below \`min\` when \`a\` and \`b\` are close (within \`k\`). The wider \`k\`, the gooier the blend. Move one circle with \`uTime\`.`,
    new: ['smin'], try: 'Change k from 0.2 to 0.02 (sharp join) and 0.5 (very gooey).',
    code: `float mySmin(float a, float b, float k) {
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}
void main() {
  vec2 p = vUv - 0.5;
  float a = length(p - vec2(-0.15, 0.0)) - 0.15;
  float b = length(p - vec2(0.15 * sin(uTime), 0.0)) - 0.12;
  float d = mySmin(a, b, 0.2);
  float w = max(fwidth(d), 0.00001);
  gl_FragColor = vec4(vec3(1.0 - smoothstep(-w, w, d)), 1.0);
}` },
]);

lesson('b-small', 'Build the small helpers', 'Building the helpers',
  'saturate, remap, rot2, checker, luma, palette and hsv2rgb: each is one to three lines, and each solves a problem you hit all the time.', [
  { t: 'saturate and remap', x: `**\`saturate(x)\`** keeps a number between 0 and 1. It is just \`clamp(x, 0.0, 1.0)\`, but you type it constantly, so it has a short name.

**\`remap(v, a, b, c, d)\`** converts a number from one range to another: the value \`a\` becomes \`c\`, and \`b\` becomes \`d\`. The formula is *how far along a to b are we* (\`(v - a) / (b - a)\`), then *go that far along c to d*.

Below, the screen's x (0 to 1) is remapped to 0.2 to 0.8, a mid-grey ramp.`,
    new: ['clamp'], try: 'Change 0.2 and 0.8 to 0.0 and 1.0: you get the plain ramp.',
    code: `float mySaturate(float x) {
  return clamp(x, 0.0, 1.0);
}
float myRemap(float v, float a, float b, float c, float d) {
  return c + (v - a) * (d - c) / (b - a);
}
void main() {
  float g = myRemap(vUv.x, 0.0, 1.0, 0.2, 0.8);
  gl_FragColor = vec4(vec3(mySaturate(g)), 1.0);
}` },
  { t: 'rot2: rotating a position', x: `To rotate a shape, don't rotate the shape: **rotate the position you look it up with**, the other way. A 2 × 2 matrix does it: its four numbers are cosine and sine of the angle, arranged so that multiplying a position by it spins the position round the origin.

\`cos\` is cosine, the partner of \`sin\`: as the angle grows, \`cos\` and \`sin\` together trace a circle.

\`mat2\` is the type for that 2 × 2 grid of numbers. You write the numbers in **columns**: (c, s) then (-s, c).`,
    new: ['mat2', 'cos'], try: 'Replace uTime with 0.5 for a fixed angle.',
    code: `mat2 myRot(float a) {
  float c = cos(a);
  float s = sin(a);
  return mat2(c, s, -s, c);
}
void main() {
  vec2 p = myRot(uTime) * (vUv - 0.5);
  float stripes = step(0.5, fract(p.x * 6.0));
  gl_FragColor = vec4(vec3(stripes), 1.0);
}` },
  { t: 'checker and luma', x: `**checker**: \`floor\` each coordinate, add them, and keep the remainder after dividing by 2 (\`mod(..., 2.0)\`). Neighbouring cells alternate between odd and even sums, so you get 0, 1, 0, 1 in both directions.

**luma**: how bright a colour *looks*. Our eyes are most sensitive to green and least to blue, so the weighted sum is 0.299 red + 0.587 green + 0.114 blue. A \`dot\` with those three weights does it in one go. Use it to turn anything grey, or to see whether a palette has enough contrast.`,
    try: 'Change the 8.0, then change a colour of the checker and look at the grey on the right.',
    code: `float myChecker(vec2 p) {
  vec2 q = floor(p);
  return mod(q.x + q.y, 2.0);
}
float myLuma(vec3 c) {
  return dot(c, vec3(0.299, 0.587, 0.114));
}
void main() {
  vec3 colour = mix(vec3(0.9, 0.2, 0.1), vec3(0.1, 0.4, 0.9), myChecker(vUv * 8.0));
  vec3 grey = vec3(myLuma(colour));
  gl_FragColor = vec4(vUv.x < 0.5 ? colour : grey, 1.0);
}` },
  { t: 'palette: colours from a cosine', x: `A cosine wave goes up and down smoothly forever, so three of them (one each for red, green and blue) with **different speeds and offsets** give a loop of smoothly changing colours. Four vec3 numbers describe the whole palette:

\`a\` the middle level, \`b\` how far it swings, \`c\` how fast each channel cycles, \`d\` the offset of each channel.

\`6.28318\` is 2π, so \`c\` of 1.0 means one full loop.`,
    new: ['palette'], try: 'Change d to vec3(0.0, 0.1, 0.2) and then c to vec3(2.0, 1.0, 0.0).',
    code: `vec3 myPalette(float t, vec3 a, vec3 b, vec3 c, vec3 d) {
  return a + b * cos(6.28318 * (c * t + d));
}
void main() {
  vec3 col = myPalette(vUv.x, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'hsv2rgb: pick colours by hue', x: `Mixing red, green and blue is unnatural for picking colours. **HSV** is friendlier: **hue** (which colour, 0 to 1 around the wheel), **saturation** (grey to vivid), **value** (dark to bright).

The helper builds three sawtooth-shaped curves from \`fract\` and \`abs\`, each shifted by a third of the wheel, then clamps them to get red, green and blue. Don't memorise it. Notice that it is again **fract plus a few lines of arithmetic**.`,
    new: ['hsv2rgb'], try: 'Change the second number 0.8 (saturation) and the third 1.0 (value).',
    code: `vec3 myHsv(vec3 c) {
  vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}
void main() {
  gl_FragColor = vec4(myHsv(vec3(vUv.x, 0.8, vUv.y)), 1.0);
}` },
]);

lesson('b-light', 'Build the lighting helpers', 'Building the helpers',
  'lambert, blinn, fresnel and bumpFromHeight: each is one idea about angles, and each is a few lines.', [
  { t: 'lambert: facing the light', x: `A surface looks brighter the more it **faces the light**. The dot product of the surface normal and the direction to the light measures exactly that (1 facing it, 0 side-on, negative facing away), and \`max(..., 0.0)\` stops it going negative.

That is \`lambert\`, the whole of diffuse lighting. \`uLightDir\` is the direction towards the sun in this studio.`,
    shape: true, try: 'Change the surface colour.',
    code: `float myLambert(vec3 n, vec3 l) {
  return max(dot(n, l), 0.0);
}
void main() {
  vec3 n = surfNormal();
  float lit = myLambert(n, uLightDir);
  gl_FragColor = vec4(vec3(0.9, 0.5, 0.3) * (0.15 + 0.85 * lit), 1.0);
}` },
  { t: 'blinn: the shiny spot', x: `A shiny surface also shows a **highlight** where it mirrors the light into your eye. Blinn's trick: find the **halfway vector** between the light direction and the view direction (\`normalize(l + v)\`); the closer the normal is to that halfway direction, the closer you are to the mirror angle.

Raise that dot product to a high power (**\`pow\`**) to make the spot small and sharp. The *shininess* is that power: 8 is a broad glow, 200 a pin-prick.`,
    shape: true, new: ['blinn'], try: 'Change 60.0 to 8.0 and then 300.0.',
    code: `float myBlinn(vec3 n, vec3 l, vec3 v, float shininess) {
  vec3 h = normalize(l + v);
  return pow(max(dot(n, h), 0.0), shininess);
}
void main() {
  vec3 n = surfNormal();
  float spec = myBlinn(n, uLightDir, viewDir(), 60.0);
  vec3 base = vec3(0.2, 0.3, 0.6) * (0.2 + 0.8 * max(dot(n, uLightDir), 0.0));
  gl_FragColor = vec4(base + vec3(spec), 1.0);
}` },
  { t: 'fresnel: the glancing glow', x: `Look at a puddle straight down and you see the bottom; look across it and you see a mirror. Every surface reflects more at **glancing angles**. The measure is how side-on the surface is to your eye: \`1 - dot(n, v)\` is 0 when you face it and 1 at the silhouette. A power sharpens it towards the edge.

You met \`fresnel\` in the lighting lesson. It is exactly this, with the clamp to avoid negatives.`,
    shape: true, try: 'Change 3.0 to 1.0 (wide glow) and 8.0 (thin rim).',
    code: `float myFresnel(vec3 n, vec3 v, float power) {
  return pow(1.0 - clamp(dot(n, v), 0.0, 1.0), power);
}
void main() {
  vec3 n = surfNormal();
  float rim = myFresnel(n, viewDir(), 3.0);
  gl_FragColor = vec4(vec3(0.05, 0.08, 0.15) + vec3(0.3, 0.7, 1.0) * rim, 1.0);
}` },
  { t: 'bumpFromHeight: slopes become normals', x: `Bumps are just **tilted normals**. If a height map rises to the right, the surface tilts left, and the light sees it that way. How steep is the height map? \`dFdx(h)\` and \`dFdy(h)\` tell you how much \`h\` changes from this pixel to its neighbour in x and y.

This tiny version nudges the **normal** against that slope. The studio's \`bumpFromHeight\` does the same in a more careful way (it works out the true surface directions so the bump doesn't change with the camera angle, and limits the tilt so nothing goes wild), but the idea is just: **height slope in, tilted normal out.**`,
    shape: true, new: ['bumpFromHeight', 'dFdx', 'dFdy'], try: 'Change the strength 0.4.',
    code: `void main() {
  float h = fbm3(vPos * 8.0);
  vec3 n = surfNormal();
  vec3 tilted = normalize(n - 0.4 * vec3(dFdx(h), dFdy(h), 0.0) * 30.0);
  float lit = max(dot(tilted, uLightDir), 0.0);
  gl_FragColor = vec4(vec3(0.7, 0.65, 0.6) * (0.2 + 0.8 * lit), 1.0);
}` },
]);

// ====================================================================== optimisation
lesson('o-measure', 'Measure first: where does the time go?', 'Optimisation',
  'Before changing anything, find out what is actually expensive. How a shader\'s cost is counted, and how to read the Perf tab.', [
  { t: 'Cost is per pixel, times every pixel', x: `Your \`main()\` runs **once for every pixel, every frame**. A 1000 × 1000 preview is a million pixels, at 60 frames a second: **sixty million runs of your code per second**. So a tiny saving (one fewer function call) matters a lot, and one extra \`fbm\` hurts a lot.

Two things set how slow a shader is: **how much work one run does**, and **how many pixels** it runs for. You can't change how many pixels the screen has, but you control the first.

The shader below is deliberately expensive: three separate \`fbm\` calls, and each \`fbm\` is five noises (you saw that in the build-fbm lesson).`,
    new: ['fbm'], try: 'Open the Perf tab (right panel) with this shader. Its biggest cost is fbm.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float a = fbm(p);
  float b = fbm(p + 5.0);
  float c = fbm(p + 9.0);
  gl_FragColor = vec4(a, b, c, 1.0);
}` },
  { t: 'Reading the Perf tab', x: `The **Perf** tab does two different things:

**1. A cost estimate**: it reads your code and adds up what each call and loop costs, in "units", then shows **which functions and lines use the most**. It is a *model*, not a measurement, so use it to compare two versions and to find the expensive part, not as an absolute number.

**2. A benchmark**: it really draws your shader many times and times it, then subtracts an empty shader so you see only your code's cost. This depends on your graphics card, which is why it can disagree with the estimate. **When the two disagree, trust the benchmark.**

The tab also lists **suggestions**, each with a button that applies the fix.`,
    try: 'Open the Perf tab and run the benchmark. Then apply a suggestion and run it again.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float n = fbm(p) * 0.6 + fbm(p * 3.0) * 0.4;
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'The rules of thumb', x: `Costs, roughly from cheap to expensive:

**Cheap:** + − × ÷, \`mix\`, \`clamp\`, \`min\`, \`max\`, \`dot\`, \`step\`.
**Medium:** \`sqrt\`, \`length\`, \`normalize\`, \`sin\`, \`cos\`, \`exp\`, \`pow\`.
**Expensive:** a **noise** (a dozen hashes), an \`fbm\` (five noises), a \`voronoi\` (nine hashes and distances), **anything inside a loop** (times the loop count), and **texture reads that depend on other texture reads**.

So 95% of the time the answer to "why is my shader slow?" is **"too much noise"**: too many calls, too many octaves, or noise inside a loop. The next lessons attack exactly that.`,
    try: 'Change the shader to call fbm only once. Compare the two in the Perf tab.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float n = fbm(p);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
]);

lesson('o-less', 'Do less work per pixel', 'Optimisation',
  'Five simple habits: reuse results, drop octaves nobody can see, avoid pow, avoid branches, and keep loops short. No new tools needed.', [
  { t: 'Call it once, use it twice', x: `If you need the same value in two places, **store it in a variable**. The compiler sometimes spots repeats, but you can't count on it, and with something as costly as \`fbm\` a hidden repeat is expensive.

Below, \`fbm(p)\` is computed **twice**. The version in the next step computes it once.`,
    try: 'Open the Perf tab for this one and note the cost.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  vec3 dark = vec3(0.1, 0.1, 0.2);
  vec3 light = vec3(0.9, 0.8, 0.6);
  vec3 col = mix(dark, light, fbm(p));
  col *= 0.6 + 0.8 * fbm(p);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'The fixed version', x: `Same picture, **half** the noise. Store the value once in \`n\`, then use \`n\` wherever you used \`fbm(p)\`.

This is the single most common saving in other people's shaders: look for any expensive call that has the **same arguments** more than once.`,
    try: 'Compare the cost with the previous step in the Perf tab.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float n = fbm(p);
  vec3 dark = vec3(0.1, 0.1, 0.2);
  vec3 light = vec3(0.9, 0.8, 0.6);
  vec3 col = mix(dark, light, n);
  col *= 0.6 + 0.8 * n;
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Drop the octaves nobody can see', x: `Each extra octave of \`fbm\` adds finer detail, **half as strong** as the layer before. The fifth octave is only 3% of the picture, and when the shape is small on screen, those fine layers are smaller than a pixel and just invisible.

If you don't need the fine detail, write your own fbm with **3 octaves**: it costs 40% less than five. Notice how little the picture changes.`,
    try: 'Change 3 to 5 and compare the look, then the cost.',
    code: `float fbm3oct(vec2 p) {
  float sum = 0.0;
  float amp = 0.5;
  for (int i = 0; i < 3; i++) {
    sum += amp * noise(p);
    p = p * 2.03 + vec2(17.1, 9.2);
    amp *= 0.5;
  }
  return sum / 0.875;
}
void main() {
  gl_FragColor = vec4(vec3(fbm3oct(vUv * 4.0)), 1.0);
}` },
  { t: 'Avoid pow, avoid branches', x: `**pow with a small whole exponent:** \`pow(x, 2.0)\` is \`x * x\` and \`pow(x, 4.0)\` is two squarings. Plain multiplication is cheaper than the general \`pow\`, which is built from \`exp\` and \`log\`.

**if / else:** on a graphics card the pixels in a group all take **both** sides if they disagree, so a branch doesn't skip work the way it does on a CPU. Often \`mix\` or \`step\` gives the same result with no branch: \`x > 0.5 ? a : b\` is \`mix(b, a, step(0.5, x))\`.

Both are tiny wins compared with noise, so apply them when it makes the code simpler too.`,
    try: 'Replace pow(n, 4.0) with the n2 * n2 version and compare the pictures. They are identical.',
    code: `void main() {
  float n = noise(vUv * 6.0);
  float n2 = n * n;
  float sharp = n2 * n2;
  vec3 col = mix(vec3(0.1, 0.15, 0.4), vec3(1.0, 0.8, 0.3), step(0.5, sharp + 0.3));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Keep loops short, and never put noise in a loop you can avoid', x: `Everything inside a loop is paid for **every time round**. A 16-step loop with an \`fbm\` inside is 16 × 5 = **80 noises per pixel**. Before you write one, ask: can it be fewer steps? Can the expensive part move **outside** the loop?

In this example the noise doesn't change between the steps, so computing it inside the loop is pure waste. Hoisting it out gives the same picture for **1/8** of the noise.`,
    try: 'Change 8 to 24 and watch the cost in the Perf tab with the noise left outside the loop: it barely moves.',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float n = fbm(p);
  float sum = 0.0;
  for (int i = 0; i < 8; i++) {
    float t = float(i) / 8.0;
    sum += smoothstep(t, t + 0.2, n);
  }
  gl_FragColor = vec4(vec3(sum / 8.0), 1.0);
}` },
]);

lesson('o-lookup', 'Swap calculations for lookups (the T helpers)', 'Optimisation',
  'Instead of calculating hashes every time, read random numbers from a small picture. The studio has a "T" twin for every noise helper.', [
  { t: 'The idea: a table of random numbers', x: `A noise needs a random number at each grid corner, which our hash calculates with several multiplications. But the hash for cell (3, 7) is **always the same number**. So calculate them **once**, store them in a little 256 × 256 picture, and from then on **just look them up**.

The studio does this for you: there is an automatic picture of random numbers, and every helper that reads from it has a name ending in **T**: \`hashT\`, \`noiseT\`, \`noise3T\`, \`fbmT\`, \`fbm3T\`, \`voronoiT\`. Same inputs, same kind of output. Only the insides differ. (They are studio-made; they only exist here.)`,
    new: ['noiseT'], try: 'The right half uses the T version. Compare it with the left.',
    code: `void main() {
  vec2 p = vUv * 8.0;
  float n = vUv.x < 0.5 ? noise(p) : noiseT(p);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'Swap fbm for fbmT', x: `For most shaders the swap is **just adding a T**. \`fbmT\` has the same five octaves, but each octave reads the table instead of hashing.

The pattern is **not identical**: the table holds different random numbers than the hash makes, so the blobs land in different places. The *character* (sizes, contrast, smoothness) is the same. Pick the look you like; you aren't losing quality.

The Perf tab recognises this and offers it as a suggestion with a button.`,
    new: ['fbmT'], try: 'Left: fbm. Right: fbmT. Then run the Perf benchmark on each (swap which one is in the shader).',
    code: `void main() {
  vec2 p = vUv * 4.0;
  float n = vUv.x < 0.5 ? fbm(p) : fbmT(p);
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: '3D and voronoi', x: `The same applies to the others. \`noise3T\` and \`fbm3T\` are the 3D versions, and they are what to use on a 3D object (\`vPos\`). \`voronoiT\` replaces the nine-neighbour search's hashes with lookups.

How does \`noise3T\` get a 3D value from a flat picture? Each layer in z is the same picture **shifted** a bit (the G channel is the R channel moved by (37, 17)), and the helper mixes two. A neat trick, with a limit: it repeats every 256 cells, which is far more than a shader ever uses.`,
    shape: true, new: ['fbm3T', 'voronoiT'], try: 'Replace fbm3T with fbm3 and compare the picture and the Perf tab cost.',
    code: `void main() {
  float n = fbm3T(vPos * 3.0);
  vec3 v = voronoiT(vUv * 6.0);
  vec3 base = vec3(0.6, 0.55, 0.5) * (0.5 + 0.5 * n);
  gl_FragColor = finish(base * smoothstep(0.0, 0.08, v.y), 1.0);
}` },
  { t: 'hashT: four random numbers at once', x: `\`hashT(cell)\` returns a **vec4**: four independent random numbers in one lookup. When you need a few (a random point and a random colour for a cell, say) one \`hashT\` replaces several hash calls.

It takes a grid cell, so give it a **whole-number** position (\`floor\` first). It repeats every 256 cells.

Rule of thumb: **use the T helper by default for anything that runs per pixel**, and the plain one when you need the exact same pattern as another tool (or a cell value beyond 256).`,
    new: ['hashT'], try: 'Change 10.0. Note that every cell has four different random numbers to use: r, g, b and a.',
    code: `void main() {
  vec4 h = hashT(floor(vUv * 10.0));
  gl_FragColor = vec4(h.rgb * 0.8 + 0.1, 1.0);
}` },
]);

lesson('o-bake', 'Compute once, reuse every frame: bake()', 'Optimisation',
  'If a pattern doesn\'t change over time, why recalculate it for every pixel in every frame? Draw it once into a picture and just read the picture.', [
  { t: 'The idea', x: `Many textures never change: wood grain, stone, a marble pattern. Yet a normal shader recalculates them for every pixel, 60 times a second. **Baking** means: draw the pattern **once** into a picture, then in \`main()\` only **read that picture**, which costs almost nothing.

In the studio, write a function called **\`bake(vec2 uv)\`** that returns the pattern for each position of a square, and in \`main()\` read it back with **\`texture(uBake, uv)\`**. The studio draws \`bake\` once, and again only if one of the sliders it uses changes.

\`texture(picture, position)\` is the GLSL function that reads a colour out of a picture at a position (0 to 1 across). (\`bake\` and \`uBake\` are studio-made; \`texture\` is real GLSL.)`,
    new: ['bake', 'uBake', 'texture'], try: 'Open the Perf tab. The estimate counts bake() separately because it runs once, not every pixel.',
    code: `vec4 bake(vec2 uv) {
  float n = fbm(uv * 6.0);
  return vec4(vec3(n), 1.0);
}
void main() {
  gl_FragColor = texture(uBake, vUv);
}` },
  { t: 'Set the picture size', x: `The baked picture has a **size**. A comment right above \`bake\` sets it: \`// bake 1024\` (a 1024 × 1024 picture; the default is 512). Bigger is sharper and uses more memory. Pick the smallest that still looks good at the size the texture is shown.

Zooming works by **changing the coordinate you read with**: \`vUv * 2.0\` shows the picture twice across, repeating. The picture wraps around (it *repeats*) at its edges.`,
    try: 'Try 256, 512, 2048 and zoom in on the preview.',
    code: `// bake 1024
vec4 bake(vec2 uv) {
  float n = fbm(uv * 6.0);
  return vec4(vec3(n), 1.0);
}
void main() {
  gl_FragColor = texture(uBake, vUv * 2.0);
}` },
  { t: 'Make it tile', x: `When the picture repeats, you may see a **seam** where the left edge meets the right: ordinary noise doesn't match up at the borders. The studio has **tileable** twins: \`noiseTile\` and \`fbmTile\`. They take an extra **period**, a whole number saying "repeat exactly after this many cells". Use the **same whole number** as the scale and the edges meet perfectly.

Here the picture has 6 cells across and the period is 6.`,
    new: ['fbmTile'], try: 'Replace fbmTile(uv * 6.0, 6.0) with fbm(uv * 6.0) and look for the seam in the zoomed preview.',
    code: `// bake 1024
vec4 bake(vec2 uv) {
  float n = fbmTile(uv * 6.0, 6.0);
  return vec4(vec3(n), 1.0);
}
void main() {
  gl_FragColor = texture(uBake, vUv * 3.0);
}` },
  { t: 'Sliders inside bake()', x: `You can use \`uniform\` sliders inside \`bake\`. The studio notices which sliders \`bake\` reads, and **re-bakes only when one of those moves**. Sliders only used in \`main\` (like the bump strength below) change instantly with no re-bake.

**The limit:** \`bake\` can't use \`uTime\` (it isn't drawn every frame). If you need motion, **move the lookup, not the bake**: scroll the position you read with in \`main()\`, as below.`,
    new: ['uniform'], try: 'Move uScale: it re-bakes. Move uBump: it doesn\'t. The texture drifts with uTime for free.',
    code: `uniform float uScale;   // 6.0 [2, 12]
uniform float uBump;    // 0.1 [0, 0.4]
// bake 1024
vec4 bake(vec2 uv) {
  float n = fbmTile(uv * floor(uScale), floor(uScale));
  return vec4(vec3(0.4 + 0.5 * n), n);
}
void main() {
  vec4 b = texture(uBake, vUv * 2.0 + vec2(uTime * 0.02, 0.0));
  gNormal = bumpFromHeight(b.a, uBump);
  gHasN = 1.0;
  gl_FragColor = finish(b.rgb, 1.0);
}` },
]);

lesson('o-practice', 'Practice: speed up a slow shader', 'Optimisation',
  'Take one slow shader and speed it up in four steps, checking the Perf tab after each: reuse, fewer octaves, T helpers, bake.', [
  { t: 'The slow version', x: `A stone-like surface. It works, but: **two** \`fbm3\` calls with the **same position** (one is hidden in the colour, one in the bump), a **third** at 20× zoom, and every call is the full five octaves. Run the benchmark in the Perf tab and write the number down.`,
    shape: true, new: ['fbm3', 'gShine'], try: 'Note the Perf tab cost and benchmark. We will beat it step by step.',
    code: `void main() {
  float h = fbm3(vPos * 5.0);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(fbm3(vPos * 5.0) + grit * 0.2, 0.08);
  gHasN = 1.0;
  gShine = 0.3;
  vec3 col = mix(vec3(0.35), vec3(0.65), h) * (0.8 + 0.4 * grit);
  gl_FragColor = finish(col, 1.0);
}` },
  { t: 'Step 1: reuse', x: `The \`fbm3(vPos * 5.0)\` is computed twice with the same position. Store it once (\`h\`) and use \`h\` in both places. The picture is **identical**. Two of the three noises remain.`,
    shape: true, try: 'Check the cost in the Perf tab. It dropped by about a third.',
    code: `void main() {
  float h = fbm3(vPos * 5.0);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(h + grit * 0.2, 0.08);
  gHasN = 1.0;
  gShine = 0.3;
  vec3 col = mix(vec3(0.35), vec3(0.65), h) * (0.8 + 0.4 * grit);
  gl_FragColor = finish(col, 1.0);
}` },
  { t: 'Step 2: lookups', x: `Swap both calls to the T version: \`fbm3\` becomes \`fbm3T\`. Two letters, and every octave now reads the random-number picture instead of calculating hashes. The stones land in slightly different places, with the same character.`,
    shape: true, try: 'Run the benchmark again and compare with the first step.',
    code: `void main() {
  float h = fbm3T(vPos * 5.0);
  float grit = fbm3T(vPos * 20.0);
  gNormal = bumpFromHeight(h + grit * 0.2, 0.08);
  gHasN = 1.0;
  gShine = 0.3;
  vec3 col = mix(vec3(0.35), vec3(0.65), h) * (0.8 + 0.4 * grit);
  gl_FragColor = finish(col, 1.0);
}` },
  { t: 'Step 3: bake it', x: `The rock never changes, so **don't recalculate it**. But \`bake\` draws into a flat picture, and a 3D object wants a pattern that wraps all round it with no seams. For a flat or tiling surface, bake the **tileable** noise and read it with the UVs; that is the right choice for floors, walls and planks.

(For a ball or other object, the \`fbm3T\` version above is already cheap, and is the better answer. **Bake when the surface is a plane or tiles; use T helpers when it wraps 3D shapes.**)

Here the stone is baked and \`main\` is just one picture read.`,
    new: ['noiseTile'], try: 'Compare the benchmark with Step 2. The more complicated the bake, the bigger the gap.',
    code: `// bake 1024
vec4 bake(vec2 uv) {
  float h = fbmTile(uv * 5.0, 5.0);
  float grit = fbmTile(uv * 20.0, 20.0);
  return vec4(mix(vec3(0.35), vec3(0.65), h) * (0.8 + 0.4 * grit), h + grit * 0.2);
}
void main() {
  vec4 b = texture(uBake, vUv);
  gNormal = bumpFromHeight(b.a, 0.08);
  gHasN = 1.0;
  gShine = 0.3;
  gl_FragColor = finish(b.rgb, 1.0);
}` },
  { t: 'What to remember', x: `1. **Measure**, don't guess (Perf tab: estimate to find the hotspot, benchmark to confirm).
2. **Reuse** any expensive value you compute twice.
3. **Drop** octaves and loop steps you can't see.
4. **Swap** to the T helpers by default (\`fbmT\`, \`noise3T\`, \`voronoiT\`).
5. **Bake** anything that doesn't change over time on a flat or tiling surface.

And one habit to build: after every change, look at the picture **and** the number. A faster shader that looks wrong is not faster, just wrong.`,
    try: 'Open any library shader, run the Perf tab and see how many of these five tricks apply.',
    code: `void main() {
  float n = fbmT(vUv * 6.0);

}` },
]);

const GOAL_TABLE = [
  ['A shape: circle, box, line, star…', ['length', 'distance', 'sdCircle', 'sdBox', 'sdSegment', 'smoothstep'], 'Make a **distance** number (how far from the shape), then cut it into a mask with `smoothstep`. The "Shapes (2D distance)" docs category has ready-made ones.'],
  ['Repeating things: tiles, stripes, dots', ['fract', 'floor', 'mod', 'checker'], '`fract(p * count)` repeats space. `floor` tells you which tile you are in (for per-tile randomness).'],
  ['Natural, uneven, organic', ['noise', 'fbm', 'fbm3', 'voronoi', 'perlin'], 'Use noise as a **height or a mask**. fbm = clouds, rock, dirt. voronoi = cells, cracks, scales, stones.'],
  ['Random variation', ['hash11', 'hash21', 'hash22', 'hash31'], 'Pair with `floor(p)` so each tile gets its own steady random number.'],
  ['Smooth transitions and edges', ['mix', 'smoothstep', 'step', 'clamp', 'saturate', 'remap'], 'Build a 0 to 1 number first, shape it with smoothstep or pow, then use it as `t` in mix.'],
  ['Picking colours', ['mix', 'palette', 'hsv2rgb', 'rgb2hsv', 'luma'], 'Few colours: mix. A rainbow or random hues: palette or hsv2rgb. Greyscale or saturation: luma.'],
  ['Motion and animation', ['uTime', 'sin', 'cos', 'fract', 'rot2'], 'Add `uTime` to a coordinate, to a noise input, or inside a `sin`. Rotate with `rot2(angle) * p`.'],
  ['Rings, spirals, radial patterns', ['length', 'atan', 'rot2', 'sin'], 'Polar: distance = `length(p)`, angle = `atan(p.y, p.x)`. A pattern in angle/distance becomes radial.'],
  ['Distort or warp a pattern', ['noise', 'fbm', 'sin', 'rot2'], 'Add a noise or sin value to the **coordinate** before using it: `p = p + 0.1 * noise(p * 4.0)`.'],
  ['Lighting, shine, rim glow', ['surfNormal', 'viewDir', 'dot', 'pow', 'fresnel', 'finish'], 'Normal + light direction + view direction are the three vectors all lighting uses.'],
  ['Surface detail: bumps, dents, scratches', ['bumpFromHeight', 'fbm3', 'voronoi', 'gNormal', 'gShine'], 'Design a **height** picture, then `bumpFromHeight`. See the bump lesson.'],
  ['Mirror, metal, glass, water', ['reflect', 'fresnel', 'surfNormal', 'viewDir', 'pow'], 'Reflect the view direction, look it up in an environment function, mix with fresnel. See the reflection lesson.'],
  ['Transparency and glow', ['fresnel', 'smoothstep', 'exp'], 'Set the type to **transparent** and put the see-through amount in alpha. Glows are added light: `col = col + glowColour * exp(-d * k)`.'],
  ['Something based on the object\'s own position', ['vPos', 'vUv', 'vN', 'vW', 'cameraPosition'], '`vUv` stays on the surface (can show seams), `vPos` is a 3D position in the object (seamless with fbm3).'],
];
lesson('backwards', 'Working backwards from a picture in your head', 'Method',
  'How to take an idea like "molten lava" apart into pieces, find where each piece lives in the Docs, and rebuild it layer by layer.', [
  { t: 'Start with questions, not code', x: `When you picture something and don't know how to make it, don't look for **the** function. Almost nothing is one function. Look at the picture and ask, in order:

**1. Shape.** What are the regions? (A circle? Cells? Blobs? Stripes?) Each region is a **mask**: a 0 to 1 number.
**2. Pattern.** Does it repeat (fract / floor), is it random and organic (noise / fbm / voronoi), or a smooth gradient (a coordinate)?
**3. Colour.** How many colours, and what picks between them? (mask → mix, height → ramp, angle → palette.)
**4. Surface.** Flat, bumpy, shiny, glowing, see-through? (bump, gShine, fresnel, extra light, alpha.)
**5. Motion.** What changes over time? (add \`uTime\` to one of the inputs above.)

Write the answers down as a list of layers. Each layer can be built and checked alone, and the line preview lets you inspect each one.` },
  { t: 'Where to look for what', x: `Click any name to jump to its documentation and example in the Docs tab. Each row is a thing you might want, the pieces that produce it, and the usual way to use them.`, table: GOAL_TABLE },
  { t: 'Worked example: "a molten lava ball". Layer 1, the pattern', x: `Take the idea apart.
**Shape:** dark crust plates with glowing cracks. **Pattern:** organic and random, so noise. **Colour:** black-brown crust, orange-yellow lava. **Surface:** crust is rough and lit; lava glows by itself. **Motion:** the lava slowly moves.

Build the pattern first, alone, in black and white. \`fbm3\` on the 3D position wraps cleanly around the ball, and adding to the y input makes it drift slowly.`,
    shape: true, try: 'Change 2.5 for bigger or smaller plates.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  gl_FragColor = vec4(vec3(n), 1.0);
}` },
  { t: 'Layer 2: turn the pattern into a mask', x: `We need two regions, crust and lava, so cut the noise with \`smoothstep\`: above about 0.56 is crust (1), below 0.46 is lava (0), a narrow transition between. Moving these two numbers changes how much of the ball is crust: that's your main design control.`,
    shape: true, try: 'Raise both numbers to get more lava.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  gl_FragColor = vec4(vec3(crust), 1.0);
}` },
  { t: 'Layer 3: colour each region', x: `Give each region its own colour and combine with \`mix\` and the mask. The lava gets a gradient too (hotter yellow where the noise is lowest, the middle of the cracks). The same \`n\` drives both the mask and the lava colour. This is the "which colour comes from which number" step.`,
    shape: true, try: 'Change the lava colours to make green slime.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 col = mix(lavaCol, crustCol, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 4: light only the crust', x: `Lava gives off its own light, so it shouldn't be darkened by shading; rock should. So we run only the crust colour through \`finish\` and take the colour from the result: \`finish(...)\` returns a vec4, and **\`.rgb\`** picks its first three parts (red, green, blue). The lava is shown unlit and over-bright (\`* 1.6\`; values above 1 look intense), and the mask chooses.

**Different parts of one object can follow different rules**, as long as a mask chooses.`,
    shape: true, try: 'Change 1.6 to 1.0 and 3.0.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 5: bump the crust', x: `The crust should look raised above the lava. Reuse the same mask as the **height**: crust high, lava low, plus a little fine grit. \`gNormal\` and \`gHasN\` are set **before** \`finish\` is called. No new idea: it's the bump lesson with numbers you already had.`,
    shape: true, try: 'Raise 0.06 for stronger bumps.',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(crust * 0.8 + grit * 0.15, 0.06);
  gHasN = 1.0;
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n) * (0.6 + 0.8 * grit);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Layer 6: a hot rim', x: `Finishing touches usually come from the lighting group. A \`fresnel\` mask adds an orange glow at the edge of the ball, like heat haze. We *add* because it's emitted light. Compare the first picture with this one: six small, separate decisions, each answering one question from step one.

When you build your own: finish one layer, look at it, add the next. If something looks wrong, click the line that makes it and use the line preview to see which layer is the problem.`,
    shape: true, try: 'Change 0.6 (the rim strength).',
    code: `void main() {
  float n = fbm3(vPos * 2.5 + vec3(0.0, uTime * 0.1, 0.0));
  float crust = smoothstep(0.46, 0.56, n);
  float grit = fbm3(vPos * 20.0);
  gNormal = bumpFromHeight(crust * 0.8 + grit * 0.15, 0.06);
  gHasN = 1.0;
  vec3 crustCol = mix(vec3(0.07, 0.05, 0.05), vec3(0.28, 0.2, 0.17), n) * (0.6 + 0.8 * grit);
  vec3 lavaCol = mix(vec3(1.0, 0.85, 0.3), vec3(0.9, 0.15, 0.0), smoothstep(0.2, 0.5, n));
  vec3 lit = finish(crustCol, 1.0).rgb;
  vec3 col = mix(lavaCol * 1.6, lit, crust);
  col = col + vec3(1.0, 0.35, 0.05) * fresnel(surfNormal(), viewDir(), 3.0) * 0.6;
  gl_FragColor = vec4(col, 1.0);
}` },
], true);

/* ===== editor.js : a small self-contained code editor engine for GLSL =====
   textarea (input, caret, selection) + a highlighted <pre> underneath + line-number gutter.
   Features: syntax highlighting, error markers, undo/redo, auto-indent, auto-close brackets, bracket matching, comment toggle,
   move/duplicate lines, find/replace, autocomplete, signature help, hover docs, and drag-to-change numbers. */
class CodeEditor {
  constructor(host, o) {
    this.o = o || {}; this.host = host;
    host.innerHTML = '<div class="ed"><div class="ed-gut"><div class="ed-gutin"></div></div><div class="ed-view">' +
      '<div class="ed-under"></div><pre class="ed-hl"></pre>' +
      '<textarea class="ed-ta" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>' +
      '<div class="ed-ac" hidden></div><div class="ed-tip" hidden></div><div class="ed-sig" hidden></div><div class="ed-scrub" hidden></div>' +
      '<div class="ed-find" hidden><input class="ef-q" placeholder="Find" spellcheck="false"><input class="ef-r" placeholder="Replace" spellcheck="false">' +
      '<button class="ef-prev" title="Previous (Shift+Enter)">↑</button><button class="ef-next" title="Next (Enter)">↓</button><button class="ef-rep">Replace</button><button class="ef-all">All</button><span class="ef-n"></span><button class="ef-x">✕</button></div>' +
      '</div></div>';
    const q = s => host.querySelector(s);
    this.ta = q('.ed-ta'); this.hl = q('.ed-hl'); this.under = q('.ed-under'); this.view = q('.ed-view'); this.gut = q('.ed-gutin');
    this.acEl = q('.ed-ac'); this.tipEl = q('.ed-tip'); this.sigEl = q('.ed-sig'); this.scrubEl = q('.ed-scrub'); this.findEl = q('.ed-find');
    this.errors = []; this.sx = 0; this.sy = 0; this.hist = []; this.hp = -1; this.lastCoalesce = 0; this.ac = { open: false, items: [], sel: 0, ws: 0 };
    this.hoverNum = null; this.finds = []; this.gutLines = 0; this.gutEls = [];
    this.measure();
    this.bind();
    this.setValue(this.o.value || '');
    new ResizeObserver(() => { this.measure(); this.renderUnder(); }).observe(this.view);
  }
  get value() { return this.ta.value; }
  measure() {
    const sp = document.createElement('span'); sp.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font:inherit;left:0;top:0';
    sp.textContent = 'M'.repeat(80); this.view.appendChild(sp);
    this.cw = sp.getBoundingClientRect().width / 80 || 7.5; sp.remove();
    const cs = getComputedStyle(this.ta);
    this.lh = parseFloat(cs.lineHeight) || 20; this.pt = parseFloat(cs.paddingTop) || 0; this.pl = parseFloat(cs.paddingLeft) || 0;
  }
  // ------------------------------------------------------------------ text model
  setValue(v, opts) {
    v = String(v).replace(/\r\n?/g, '\n').replace(/\t/g, '  ');
    this.ta.value = v; this.ta.setSelectionRange(0, 0);
    if (!opts || !opts.keepHistory) { this.hist = [{ v, s: 0, e: 0 }]; this.hp = 0; }
    this.ta.scrollTop = 0; this.ta.scrollLeft = 0; this.sx = this.sy = 0;
    this.refresh(); this.closeAC(); this.closeTips();
    if (this.o.onCursor) this.o.onCursor(this.cursorInfo());
  }
  refresh() {
    const v = this.ta.value; this.text = v;
    this.toks = GL.lex(v); this.A = GL.analyze(v);
    this.hl.innerHTML = GL.highlight(v, this.toks, this.A);
    this.ls = [0]; for (let i = v.indexOf('\n'); i >= 0; i = v.indexOf('\n', i + 1)) this.ls.push(i + 1);
    this.buildMatches();
    this.renderGutter(); this.renderUnder(); this.applyScroll();
  }
  buildMatches() { // bracket partners, from tokens (so brackets in comments are ignored)
    const m = new Map(), st = [], pairs = { ')': '(', ']': '[', '}': '{' };
    for (const t of this.toks) { if (t.t !== 'op') continue; if ('([{'.includes(t.v)) st.push(t); else if (pairs[t.v]) { for (let i = st.length - 1; i >= 0; i--) if (st[i].v === pairs[t.v]) { m.set(st[i].s, t.s); m.set(t.s, st[i].s); st.length = i; break; } } }
    this.brk = m;
  }
  rc(off) { let lo = 0, hi = this.ls.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (this.ls[mid] <= off) lo = mid; else hi = mid - 1; } return { row: lo, col: off - this.ls[lo] }; }
  off(row, col) { row = Math.max(0, Math.min(this.ls.length - 1, row)); const end = row + 1 < this.ls.length ? this.ls[row + 1] - 1 : this.text.length; return Math.min(this.ls[row] + Math.max(0, col), end); }
  lineEnd(row) { return row + 1 < this.ls.length ? this.ls[row + 1] - 1 : this.text.length; }
  focusOff() { const s = this.ta.selectionStart, e = this.ta.selectionEnd; return this.ta.selectionDirection === 'backward' ? s : e; }
  cursorInfo() { const off = this.focusOff(), r = this.rc(off); return { off, line: r.row + 1, col: r.col + 1 }; }
  // ------------------------------------------------------------------ drawing
  renderGutter() {
    const n = this.ls.length;
    if (n !== this.gutLines) {
      this.gutLines = n; let h = ''; for (let i = 1; i <= n; i++) h += '<div>' + i + '</div>';
      this.gut.innerHTML = h; this.gutEls = Array.from(this.gut.children); this.gutMark = new Set();
    }
    this.paintGutter();
  }
  paintGutter() {
    const errLines = new Map(); for (const e of this.errors) if (e.line > 0 && !errLines.has(e.line)) errLines.set(e.line, e.msg);
    const cur = this.rc(this.focusOff()).row + 1;
    for (let i = 0; i < this.gutEls.length; i++) {
      const el = this.gutEls[i], ln = i + 1;
      el.className = (errLines.has(ln) ? 'err ' : '') + (ln === cur ? 'cur' : '');
      el.title = errLines.get(ln) || '';
    }
    const first = this.o.previewLine; // line currently shown in the line preview
    for (let i = 0; i < this.gutEls.length; i++) if (first && i + 1 === first) this.gutEls[i].classList.add('pv');
  }
  renderUnder() {
    if (!this.ls) return;
    const lh = this.lh, pt = this.pt, pl = this.pl, cw = this.cw; let h = '';
    const bar = (row, cls) => '<div class="bar ' + cls + '" style="top:' + (pt + row * lh) + 'px;height:' + lh + 'px"></div>';
    const box = (off, len, cls) => { const r = this.rc(off); return '<div class="box ' + cls + '" style="top:' + (pt + r.row * lh) + 'px;left:' + (pl + r.col * cw) + 'px;width:' + (len * cw) + 'px;height:' + lh + 'px"></div>'; };
    const fo = this.focusOff(), cur = this.rc(fo);
    h += bar(cur.row, 'cur');
    if (this.o.previewLine && this.o.previewLine - 1 !== cur.row) h += bar(this.o.previewLine - 1, 'pv');
    const seen = new Set(); for (const e of this.errors) if (e.line > 0 && !seen.has(e.line)) { seen.add(e.line); h += bar(e.line - 1, 'err'); }
    for (const f of this.finds) h += box(f, this.findLen, 'find');
    const t = this.text;
    for (const p of [fo, fo - 1]) if (this.brk.has(p) && this.ta.selectionStart === this.ta.selectionEnd) { h += box(p, 1, 'brk') + box(this.brk.get(p), 1, 'brk'); break; }
    if (this.hoverNum) h += box(this.hoverNum.s, this.hoverNum.e - this.hoverNum.s, 'num');
    this.under.innerHTML = h;
  }
  applyScroll() {
    this.sx = this.ta.scrollLeft; this.sy = this.ta.scrollTop;
    const tf = 'translate(' + (-this.sx) + 'px,' + (-this.sy) + 'px)';
    this.hl.style.transform = tf; this.under.style.transform = tf; this.gut.style.transform = 'translateY(' + (-this.sy) + 'px)';
  }
  setErrors(errs) { this.errors = errs || []; this.paintGutter(); this.renderUnder(); }
  setPreviewLine(n) { if (this.o.previewLine !== n) { this.o.previewLine = n; this.paintGutter(); this.renderUnder(); } }
  caretXY(off) { const r = this.rc(off); return { x: this.pl + r.col * this.cw - this.sx, y: this.pt + r.row * this.lh - this.sy }; }
  reveal(off) {
    const r = this.rc(off), top = r.row * this.lh, ta = this.ta, vh = ta.clientHeight - this.pt;
    if (top < ta.scrollTop + this.lh) ta.scrollTop = Math.max(0, top - this.lh * 3);
    else if (top + this.lh * 2 > ta.scrollTop + vh) ta.scrollTop = top + this.lh * 3 - vh;
    const x = this.pl + r.col * this.cw;
    if (x < ta.scrollLeft + 20) ta.scrollLeft = Math.max(0, x - 60); else if (x > ta.scrollLeft + ta.clientWidth - 40) ta.scrollLeft = x - ta.clientWidth + 80;
    this.applyScroll();
  }
  gotoLine(line, col) { const o = this.off(line - 1, (col || 1) - 1); this.ta.focus(); this.ta.setSelectionRange(o, o); this.reveal(o); this.onSel(); }
  focus() { this.ta.focus(); }
  // ------------------------------------------------------------------ history + edits
  record(coalesce, key) {
    const st = { v: this.ta.value, s: this.ta.selectionStart, e: this.ta.selectionEnd }, now = performance.now();
    if (this.hist[this.hp] && this.hist[this.hp].v === st.v) { this.hist[this.hp].s = st.s; this.hist[this.hp].e = st.e; return; }
    if (coalesce && this.hp === this.hist.length - 1 && this.hp > 0 && this.lastKey === key && (key === 'scrub' ? this.inScrub : now - this.lastCoalesce < 800)) this.hist[this.hp] = st;
    else { this.hist.length = this.hp + 1; this.hist.push(st); this.hp++; if (this.hist.length > 400) { this.hist.shift(); this.hp--; } }
    this.lastCoalesce = coalesce ? now : 0; this.lastKey = key;
  }
  applyHist(i) { const st = this.hist[i]; this.ta.value = st.v; this.ta.setSelectionRange(st.s, st.e); this.hp = i; this.lastCoalesce = 0; this.refresh(); this.closeAC(); this.emitChange(); this.reveal(this.focusOff()); this.onSel(); }
  undo() { if (this.hp > 0) { if (this.hist[this.hp].v !== this.ta.value) this.record(false); this.applyHist(this.hp - 1); } }
  redo() { if (this.hp < this.hist.length - 1) this.applyHist(this.hp + 1); }
  emitChange() { if (this.o.onChange) this.o.onChange(this.ta.value); }
  /** replace [s,e) by text and put the selection at [ns,ne]; everything (keys, scrubbing, autocomplete) goes through here */
  edit(s, e, text, ns, ne, opt) {
    opt = opt || {}; const ta = this.ta, st = ta.scrollTop, sl = ta.scrollLeft;
    ta.setRangeText(text, s, e, 'end');
    if (ns == null) ns = s + text.length; if (ne == null) ne = ns;
    ta.setSelectionRange(ns, ne); ta.scrollTop = st; ta.scrollLeft = sl;
    this.record(!!opt.coalesce, opt.key || 'edit'); this.refresh(); this.emitChange();
    if (!opt.noReveal) this.reveal(this.focusOff());

  if (now - lastRd > 250) { lastRd = now; const rd = $('#timeRead'); if (rd) rd.textContent = (S.scene.anim ? 'uTime ' + S.time.toFixed(1) : 'uTime paused at ' + S.time.toFixed(1)) + '  ↺'; }

function orbit(cv, active) {
  let drag = null;

  cv.addEventListener('pointermove', e => { if (!drag) return; S.scene.yaw = drag.yaw - (e.clientX - drag.x) * 0.008; S.scene.pitch = clamp(drag.pitch + (e.clientY - drag.y) * 0.008, -1.45, 1.45); markDirty(); });

// ------------------------------------------------------------------ line preview controls

  const mode = h('select'); mode.title = 'Show the value on a flat square or on the 3D shape'; [['shape', 'Shape'], ['flat', 'Flat']].forEach(([v, t]) => mode.add(new Option(t, v))); mode.value = S.line.mode;
  mode.onchange = () => { S.line.mode = mode.value; markDirty(); saveSoon(); };
  const viz = h('select'); viz.title = 'How a number is turned into a colour'; [[0, 'Auto'], [1, 'Signed'], [2, 'Fract'], [3, 'Heat'], [4, 'Alpha']].forEach(([v, t]) => viz.add(new Option(t, v))); viz.value = S.line.viz;

  const lo = h('input'); lo.type = 'number'; lo.step = 0.1; lo.value = S.line.lo; lo.title = 'Value shown as black';

  lo.oninput = () => { const x = parseFloat(lo.value); if (isFinite(x)) { S.line.lo = x; markDirty(); saveSoon(); } };

// ------------------------------------------------------------------ init

    onCursor: c => { S.caret = c; $('#sbPos').textContent = 'Ln ' + c.line + ', Col ' + c.col; scheduleLine(); },

  $('#typeSel').onchange = e => { S.cur.type = e.target.value; renderLib(); markDirty(); saveSoon(); };
  $('#bName').onclick = doRename; $('#bUndo').onclick = () => { ed.undo(); ed.focus(); }; $('#bRedo').onclick = () => { ed.redo(); ed.focus(); }; $('#bFind').onclick = () => ed.openFind();
  $('#bNew').onclick = doNew; $('#bDup').onclick = doDup; $('#bRen').onclick = doRename; $('#bDel').onclick = doDelete; $('#bReset').onclick = doReset; $('#bResetAll').onclick = doResetAll;
  $('#bExport').onclick = exportAll; $('#bDownload').onclick = () => download(S.cur.name.replace(/[^\w\-]+/g, '_') + '.frag', S.cur.code);
  $('#bCopy').onclick = async () => toast((await copyText(S.cur.code)) ? 'Copied the shader code' : 'Could not copy');

  addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  addEventListener('drop', async e => { dc = 0; drop.style.display = 'none'; if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); for (const f of e.dataTransfer.files) importText(f.name, await f.text()); } });

  sp.onpointerdown = e => { sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); const move = ev => { S.ui.rightW = clamp(innerWidth - ev.clientX, 340, Math.max(400, innerWidth - 380)); document.documentElement.style.setProperty('--right', S.ui.rightW + 'px'); markDirty(); }; const up = () => { sp.classList.remove('drag'); sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); saveSoon(); }; sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up); };
  // vertical splitters: main preview / line preview heights

  const applyH = () => { for (const k in HK) $(HK[k][0]).style.height = clamp(S.ui[k] || HK[k][1], 80, Math.max(200, innerHeight - 160)) + 'px'; markDirty(); };

      const move = ev => { S.ui[k] = Math.round(clamp(h0 + ev.clientY - y0, 80, Math.max(200, innerHeight - 160))); applyH(); };

window.addEventListener('DOMContentLoaded', init);
