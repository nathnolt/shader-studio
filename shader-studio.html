  float d = min(distance(vUv, vec2(0.3, 0.6)), distance(vUv, vec2(0.7, 0.35)));   // distance to the nearest of two points
  gl_FragColor = vec4(vec3(0.5 + 0.5 * cos(d * 60.0)), 1.0);
}`, { ret: 'float', G });
add('Geometry', 'fn', 'dot', 'dot(a, b)', 'Dot product: how much two vectors point the same way (1 same, 0 at right angles, -1 opposite for unit vectors). Also gives a gradient along a direction, and is the heart of lighting.', `void main() {
  vec2 p = vUv - 0.5;
  vec2 dir = vec2(cos(0.7), sin(0.7));
  float d = dot(p, dir) + 0.5;                       // a gradient that runs along dir
  gl_FragColor = vec4(vec3(d), 1.0);
}`, { ret: 'float', G });
add('Geometry', 'fn', 'cross', 'cross(a, b)', 'Cross product of two vec3: a vector at right angles to both. Used to build coordinate frames.', `void main() {
  vec3 a = vec3(1.0, 0.0, 0.0);
  vec3 b = normalize(vec3(vUv - 0.5, 0.7));
  gl_FragColor = vec4(abs(cross(a, b)), 1.0);
}`, { ret: 'vec3', G });
add('Geometry', 'fn', 'normalize', 'normalize(v)', 'Scale a vector to length 1, keeping its direction. Directions and normals should usually be normalised before dot() or lighting.', `void main() {
  vec2 n = normalize(vUv - 0.5);                      // direction away from the centre
  gl_FragColor = vec4(n * 0.5 + 0.5, 0.5, 1.0);
}`, { ret: 'genType', G });
add('Geometry', 'fn', 'reflect', 'reflect(I, N)', 'Bounce direction I off a surface with normal N (N must be length 1). Used for mirror reflections.', `void main() {
  vec3 r = reflect(-viewDir(), surfNormal());         // where the mirror image comes from
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}`, { ret: 'genType', G, shape: true });
add('Geometry', 'fn', 'refract', 'refract(I, N, eta)', 'Bend direction I as it enters a material (eta = ratio of refractive indices, e.g. 0.75 for glass seen from air). Returns 0 on total reflection.', `void main() {
  vec3 r = refract(-viewDir(), surfNormal(), 0.75);
  gl_FragColor = vec4(r * 0.5 + 0.5, 1.0);
}`, { ret: 'genType', G, shape: true });
add('Geometry', 'fn', 'faceforward', 'faceforward(N, I, Nref)', 'Flip N if it points the wrong way relative to I. Returns N when dot(Nref, I) < 0, otherwise -N.', `void main() {
  vec3 n = normalize(vWN);
  vec3 f = faceforward(n, -viewDir(), n);             // always faces the viewer
  gl_FragColor = vec4(f * 0.5 + 0.5, 1.0);
}`, { ret: 'genType', G, shape: true });

// ------------------------------------------------------------------ matrices
add('Matrices', 'fn', 'transpose', 'transpose(m)', 'Flip a matrix over its diagonal. For a rotation matrix the transpose rotates back.', `void main() {
  vec2 p = vUv - 0.5;
  float a = 0.8;
  mat2 R = mat2(cos(a), sin(a), -sin(a), cos(a));
  vec2 q = transpose(R) * (R * p);                    // rotate and rotate back: no change
  gl_FragColor = vec4(vec3(step(0.0, sin(q.x * 40.0))), 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'inverse', 'inverse(m)', 'The matrix that undoes m.', `void main() {
  vec2 p = vUv - 0.5;
  mat2 S = mat2(3.0, 0.0, 0.0, 0.6);                  // stretch x by 3, squash y
  vec2 q = inverse(S) * p;                            // undo the stretch: wide stripes
  gl_FragColor = vec4(vec3(step(0.0, sin(q.x * 40.0)) * step(0.0, sin(q.y * 40.0))), 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'determinant', 'determinant(m)', 'A single number that says how much a matrix scales area (0 means it flattens everything).', `void main() {
  float d = determinant(mat2(vUv.x, 0.5, 0.5, vUv.y));
  gl_FragColor = vec4(vec3(0.5 + d), 1.0);
}`, { ret: 'float', G });
add('Matrices', 'fn', 'matrixCompMult', 'matrixCompMult(a, b)', 'Multiply two matrices component by component (the * operator does real matrix multiplication).', `void main() {
  mat2 a = mat2(vUv.x, 1.0, 0.5, vUv.y);
  mat2 b = mat2(0.5, 1.0, 1.0, 0.5);
  mat2 c = matrixCompMult(a, b);
  gl_FragColor = vec4(c[0].x, c[0].y, c[1].x, 1.0);
}`, { ret: 'mat', G });
add('Matrices', 'fn', 'outerProduct', 'outerProduct(c, r)', 'Matrix made from a column vector times a row vector.', `void main() {
  mat2 m = outerProduct(vec2(1.0, 0.5), vUv);
  gl_FragColor = vec4(m[0], m[1].x, 1.0);
}`, { ret: 'mat', G });

// ------------------------------------------------------------------ compare vectors
add('Compare vectors', 'fn', 'lessThan', 'lessThan(a, b)', 'Compare each component: a bvec of true/false.', `void main() {
  bvec2 b = lessThan(vUv, vec2(0.5));
  gl_FragColor = vec4(vec2(b), 0.0, 1.0);             // red where x < 0.5, green where y < 0.5
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'lessThanEqual', 'lessThanEqual(a, b)', 'Per component a <= b.', `void main() {
  bvec2 b = lessThanEqual(floor(vUv * 4.0), vec2(1.0, 2.0));
  gl_FragColor = vec4(vec2(b), 0.0, 1.0);
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'greaterThan', 'greaterThan(a, b)', 'Per component a > b.', `void main() {
  bvec2 b = greaterThan(vUv, vec2(0.3, 0.6));
  gl_FragColor = vec4(vec2(b), 0.0, 1.0);
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'greaterThanEqual', 'greaterThanEqual(a, b)', 'Per component a >= b.', `void main() {
  bvec2 b = greaterThanEqual(vUv, vec2(0.5));
  gl_FragColor = vec4(vec2(b), 0.0, 1.0);
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'equal', 'equal(a, b)', 'Per component a == b.', `void main() {
  bvec2 b = equal(floor(vUv * 4.0), vec2(1.0, 2.0));
  gl_FragColor = vec4(vec3(all(b)), 1.0);             // light up the one cell where both match
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'notEqual', 'notEqual(a, b)', 'Per component a != b.', `void main() {
  bvec2 b = notEqual(floor(vUv * 4.0), vec2(1.0, 2.0));
  gl_FragColor = vec4(vec3(any(b)), 1.0);
}`, { ret: 'bvec', G });
add('Compare vectors', 'fn', 'any', 'any(b)', 'True if at least one component is true.', `void main() {
  bool edge = any(lessThan(vUv, vec2(0.1))) || any(greaterThan(vUv, vec2(0.9)));
  gl_FragColor = vec4(vec3(edge), 1.0);
}`, { ret: 'bool', G });
add('Compare vectors', 'fn', 'all', 'all(b)', 'True only if every component is true.', `void main() {
  bool inside = all(greaterThan(vUv, vec2(0.25))) && all(lessThan(vUv, vec2(0.75)));
  gl_FragColor = vec4(vec3(inside), 1.0);
}`, { ret: 'bool', G });
add('Compare vectors', 'fn', 'not', 'not(b)', 'Flip every component of a bvec.', `void main() {
  bvec2 b = not(lessThan(vUv, vec2(0.5)));
  gl_FragColor = vec4(vec2(b), 0.0, 1.0);
}`, { ret: 'bvec', G });

// ------------------------------------------------------------------ derivatives
add('Derivatives', 'fn', 'dFdx', 'dFdx(v)', 'How much v changes from this pixel to its right neighbour. The base of anti-aliasing and of cheap bump maps.', `void main() {
  float f = sin(vUv.x * 40.0 + vUv.y * 10.0);
  gl_FragColor = vec4(vec3(0.5 + dFdx(f) * 3.0), 1.0);   // the slope along x
}`, { ret: 'genType', G });
add('Derivatives', 'fn', 'dFdy', 'dFdy(v)', 'How much v changes from this pixel to the one above.', `void main() {
  float f = sin(vUv.x * 10.0 + vUv.y * 40.0);
  gl_FragColor = vec4(vec3(0.5 + dFdy(f) * 3.0), 1.0);   // the slope along y
}`, { ret: 'genType', G });
add('Derivatives', 'fn', 'fwidth', 'fwidth(v)', 'abs(dFdx(v)) + abs(dFdy(v)): roughly how much v changes across one pixel. Shows edges and gives the width for smooth, pixel-sized lines.', `void main() {
  float f = step(0.5, noise(vUv * 6.0));
  gl_FragColor = vec4(vec3(fwidth(f)), 1.0);             // bright only on the edges
}`, { ret: 'genType', G });

// ------------------------------------------------------------------ textures
add('Textures', 'fn', 'texture', 'texture(sampler, uv)', 'Read a colour from a texture at coordinates uv (0..1). texture2D() is the same function under its old name.', `void main() {
  gl_FragColor = texture(uTex0, vUv * 1.5);
}`, { ret: 'vec4', G });
add('Textures', 'fn', 'texture2D', 'texture2D(sampler, uv)', 'Old name of texture(). Studio note: removed from modern GLSL; the studio keeps it working by turning it into texture().', `void main() {
  vec2 uv = vUv + 0.03 * vec2(sin(vUv.y * 20.0), 0.0);   // wobble the lookup
  gl_FragColor = texture2D(uTex0, uv);
}`, { ret: 'vec4', G });
add('Textures', 'fn', 'textureLod', 'textureLod(sampler, uv, lod)', 'Read from a blurrier, smaller copy (mip level) of the texture. lod 0 = sharp, higher = blurrier.', `void main() {
  gl_FragColor = textureLod(uTex0, vUv, 3.0);
}`, { ret: 'vec4', G });
add('Textures', 'fn', 'texelFetch', 'texelFetch(sampler, ivec2 pixel, lod)', 'Read one exact pixel of a texture by its integer position, no filtering.', `void main() {
  ivec2 px = ivec2(vUv * 16.0) * 16;                    // 16x16 big pixels
  gl_FragColor = vec4(texelFetch(uTex0, px, 0).rgb, 1.0);
}`, { ret: 'vec4', G });
add('Textures', 'fn', 'textureSize', 'textureSize(sampler, lod)', 'Size of a texture in pixels as an ivec2.', `void main() {
  vec2 s = vec2(textureSize(uTex0, 0));
  gl_FragColor = vec4(s / 512.0, vUv.x * 0.2, 1.0);
}`, { ret: 'ivec2', G });

// ------------------------------------------------------------------ noise & random
const STUDIO = { studio: true };
add('Noise & random', 'fn', 'hash11', 'hash11(float p)', 'A random-looking number 0..1 from one number. The same input always gives the same output. Works for any input: whole numbers, smooth values, negatives, large numbers.', fx('hash11(floor(x * 24.0))', '// one random height per step'), Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'hash21', 'hash21(vec2 p)', 'A random number 0..1 from a 2D position. Use floor(p) to get one random value per cell, or pass a smooth position for a different value at every pixel. Works for any input.', `void main() {
  float r = hash21(floor(vUv * 12.0));               // a random grey per square
  gl_FragColor = vec4(vec3(r), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'hash22', 'hash22(vec2 p)', 'Two random numbers from a 2D position (a random point or direction per cell).', `void main() {
  vec2 r = hash22(floor(vUv * 12.0));
  gl_FragColor = vec4(r, 0.4, 1.0);
}`, Object.assign({ ret: 'vec2' }, STUDIO));
add('Noise & random', 'fn', 'hash31', 'hash31(vec3 p)', 'A random number from a 3D position.', `void main() {
  float r = hash31(vec3(floor(vUv * 12.0), 3.0));
  gl_FragColor = vec4(vec3(r), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'hash33', 'hash33(vec3 p)', 'Three random numbers from a 3D position (a random colour or direction per cell).', `void main() {
  vec3 r = hash33(vec3(floor(vUv * 10.0), 1.0));
  gl_FragColor = vec4(r, 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));
add('Noise & random', 'fn', 'hashBits', 'hashBits(uint x)', 'The scrambler inside every hash: a whole number in, a thoroughly mixed whole number out (shift-xor and multiply, three shifts and two multiplies). The Learn tab builds it step by step.', `void main() {
  uint h = hashBits(uint(vUv.x * 40.0));              // 40 different whole numbers
  gl_FragColor = vec4(vec3(float(h >> 24u) / 255.0), 1.0);
}`, Object.assign({ ret: 'uint' }, STUDIO));
add('Noise & random', 'fn', 'hashToFloat', 'hashToFloat(uint h)', 'Turns a mixed whole number (from hashBits) into a float from 0 up to just under 1, using its top 24 bits.', `void main() {
  float r = hashToFloat(hashBits(uint(vUv.x * 40.0)));
  gl_FragColor = vec4(vec3(r), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'hash', 'hash(vec2 p)', 'Older name for hash21, kept so shaders from the game paste in unchanged. It gives the same numbers as hash21.', `void main() {
  gl_FragColor = vec4(vec3(hash(floor(vUv * 16.0))), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'noise', 'noise(vec2 p)', 'Smooth random blobs, 0..1 ("value noise"). p * 8.0 gives about 8 blobs across. The base of clouds, dirt, wood...', `void main() {
  float n = noise(vUv * 8.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'noise3', 'noise3(vec3 p)', '3D value noise, 0..1. Use the third value for time or for an object-space position, so patterns flow or have no seams.', `void main() {
  float n = noise3(vec3(vUv * 6.0, uTime * 0.5));
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'fbm', 'fbm(vec2 p)', 'Fractal noise: five layers of noise, each twice as detailed and half as strong. Natural-looking clouds, rock, terrain. Result 0..1.', `void main() {
  float n = fbm(vUv * 5.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'fbm3', 'fbm3(vec3 p)', '3D version of fbm, 0..1.', `void main() {
  float n = fbm3(vec3(vUv * 5.0, uTime * 0.3));
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'perlin', 'perlin(vec3 p)', 'Gradient (Perlin) noise from -1 to 1: smoother and less blocky than value noise.', `void main() {
  float n = perlin(vec3(vUv * 6.0, uTime * 0.3)) * 0.5 + 0.5;
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'pfbm', 'pfbm(vec3 p)', 'Three layers of Perlin noise, result 0..1.', `void main() {
  float n = pfbm(vec3(vUv * 4.0, 1.0));
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Noise & random', 'fn', 'voronoi', 'voronoi(vec2 p)', 'Cell pattern. Returns vec3(distance to nearest cell centre, distance to the border, random id of the cell). Stones, scales, cracks.', `void main() {
  vec3 v = voronoi(vUv * 6.0);
  vec3 col = hsv2rgb(vec3(v.z, 0.5, 0.9)) * smoothstep(0.0, 0.08, v.y);   // colour per cell, dark borders
  gl_FragColor = vec4(col, 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));

// ------------------------------------------------------------------ 2D shapes
add('Shapes (2D distance)', 'fn', 'sdCircle', 'sdCircle(vec2 p, float r)', 'Distance to a circle of radius r around the origin. Negative inside. Move a shape by subtracting from p.', sdf('sdCircle(p, 0.5)'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdBox', 'sdBox(vec2 p, vec2 halfSize)', 'Distance to a rectangle.', sdf('sdBox(p, vec2(0.6, 0.35))'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdRoundBox', 'sdRoundBox(vec2 p, vec2 halfSize, float r)', 'Rectangle with rounded corners.', sdf('sdRoundBox(p, vec2(0.6, 0.4), 0.2)'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdSegment', 'sdSegment(vec2 p, vec2 a, vec2 b)', 'Distance to a line segment from a to b (always 0 or more). Subtract a thickness to get a rounded line.', sdf('sdSegment(p, vec2(-0.6, -0.4), vec2(0.5, 0.45)) - 0.08'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdRing', 'sdRing(vec2 p, float r, float width)', 'Distance to a ring of radius r and half-thickness width.', sdf('sdRing(p, 0.5, 0.07)'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdHexagon', 'sdHexagon(vec2 p, float r)', 'Distance to a hexagon.', sdf('sdHexagon(p, 0.55)'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdTriangle', 'sdTriangle(vec2 p, float r)', 'Distance to an equilateral triangle.', sdf('sdTriangle(p, 0.5)'), Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'sdfFill', 'sdfFill(float d)', 'Turns a distance into a 0..1 mask with a one-pixel soft edge (1 inside). Multiply or mix with it to paint the shape.', `void main() {
  vec2 p = vUv * 2.0 - 1.0;
  float d = min(sdCircle(p - vec2(-0.3, 0.0), 0.4), sdBox(p - vec2(0.35, 0.0), vec2(0.3)));   // min = union of shapes
  gl_FragColor = vec4(mix(vec3(0.08), vec3(0.4, 0.8, 1.0), sdfFill(d)), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Shapes (2D distance)', 'fn', 'smin', 'smin(float a, float b, float k)', 'Smooth minimum: joins two distances with a rounded blend of size k (metaballs, gooey shapes).', sdf('smin(sdCircle(p - vec2(-0.3, 0.0), 0.35), sdCircle(p - vec2(0.3, 0.0), 0.35), 0.4)'), Object.assign({ ret: 'float' }, STUDIO));

// ------------------------------------------------------------------ colour
add('Colour', 'fn', 'palette', 'palette(t, a, b, c, d)', 'A smooth colour ramp made from cosines: a + b * cos(2π (c t + d)). Change the four vec3s for different looks.', `void main() {
  vec3 col = palette(vUv.x, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  gl_FragColor = vec4(col, 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));
add('Colour', 'fn', 'hsv2rgb', 'hsv2rgb(vec3 hsv)', 'Colour from hue, saturation, value (each 0..1). Hue goes round the colour wheel; turning only the hue is an easy way to recolour.', `void main() {
  vec3 col = hsv2rgb(vec3(vUv.x, 1.0 - vUv.y * 0.8, 1.0));   // hue across, less saturated going up
  gl_FragColor = vec4(col, 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));
add('Colour', 'fn', 'rgb2hsv', 'rgb2hsv(vec3 rgb)', 'The reverse: hue, saturation, value of a colour.', `void main() {
  vec3 hsv = rgb2hsv(vec3(vUv, 0.3));
  gl_FragColor = vec4(vec3(hsv.x), 1.0);                       // the hue as a grey
}`, Object.assign({ ret: 'vec3' }, STUDIO));
add('Colour', 'fn', 'luma', 'luma(vec3 rgb)', 'How bright a colour looks to the eye (0..1). Use it to turn a colour into grey.', `void main() {
  vec3 c = vec3(vUv.x, vUv.y, 0.2);
  gl_FragColor = vec4(vec3(luma(c)), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));

// ------------------------------------------------------------------ lighting (shape previews)
add('Lighting', 'fn', 'viewDir', 'viewDir()', 'Unit vector from the surface towards the camera.', `void main() {
  gl_FragColor = vec4(viewDir() * 0.5 + 0.5, 1.0);
}`, Object.assign({ ret: 'vec3', shape: true }, STUDIO));
add('Lighting', 'fn', 'surfNormal', 'surfNormal()', 'The surface normal in world space, length 1, flipped to face you when you look at a back face.', `void main() {
  gl_FragColor = vec4(surfNormal() * 0.5 + 0.5, 1.0);
}`, Object.assign({ ret: 'vec3', shape: true }, STUDIO));
add('Lighting', 'fn', 'fresnel', 'fresnel(vec3 n, vec3 v, float power)', 'Bright at the edge of an object, dark in the middle. Higher power = thinner rim.', `void main() {
  float f = fresnel(surfNormal(), viewDir(), 3.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}`, Object.assign({ ret: 'float', shape: true }, STUDIO));
add('Lighting', 'fn', 'lambert', 'lambert(vec3 n, vec3 l)', 'Diffuse light: 1 where the surface faces the light, 0 when it faces away.', `void main() {
  gl_FragColor = vec4(vec3(lambert(surfNormal(), uLightDir)), 1.0);
}`, Object.assign({ ret: 'float', shape: true }, STUDIO));
add('Lighting', 'fn', 'blinn', 'blinn(vec3 n, vec3 l, vec3 v, float shininess)', 'Specular highlight (Blinn-Phong). Higher shininess = smaller, harder highlight.', `void main() {
  float s = blinn(surfNormal(), uLightDir, viewDir(), 60.0);
  gl_FragColor = vec4(vec3(s), 1.0);
}`, Object.assign({ ret: 'float', shape: true }, STUDIO));
add('Lighting', 'fn', 'sceneLight', 'sceneLight(vec3 worldPos, vec3 normal)', 'The light colour reaching a surface: soft sky/ground ambient plus the sun. finish() multiplies your colour by this.', `void main() {
  gl_FragColor = vec4(sceneLight(vW, surfNormal()), 1.0);
}`, Object.assign({ ret: 'vec3', shape: true }, STUDIO));
add('Lighting', 'fn', 'finish', 'finish(vec3 colour, float alpha)', 'Applies lighting (and gShine / gNormal etc. if you set them) to a colour and returns the final vec4. Normally the last line: gl_FragColor = finish(col, 1.0);', `void main() {
  vec3 col = mix(vec3(0.8, 0.3, 0.2), vec3(0.95, 0.8, 0.5), noise(vP * 3.0));
  gl_FragColor = finish(col, 1.0);
}`, Object.assign({ ret: 'vec4', shape: true }, STUDIO));
add('Lighting', 'fn', 'bumpFromHeight', 'bumpFromHeight(float h, float strength)', 'Cheap bump mapping: give it any height pattern and it tilts the normal by the slope. Assign the result to gNormal and set gHasN = 1.0.', `void main() {
  float h = fbm(vUv * 20.0);
  gNormal = bumpFromHeight(h, 0.1);
  gHasN = 1.0;
  gl_FragColor = finish(vec3(0.7, 0.6, 0.5), 1.0);
}`, Object.assign({ ret: 'vec3', shape: true }, STUDIO));

// ------------------------------------------------------------------ helpers
add('Helpers', 'fn', 'saturate', 'saturate(x)', 'clamp(x, 0.0, 1.0).', fx('saturate(x * 1.6 - 0.3)'), Object.assign({ ret: 'genType' }, STUDIO));
add('Helpers', 'fn', 'remap', 'remap(v, inLo, inHi, outLo, outHi)', 'Move a value from one range to another (not clamped).', fx('remap(x, 0.2, 0.8, 0.1, 0.9)'), Object.assign({ ret: 'float' }, STUDIO));
add('Helpers', 'fn', 'rot2', 'rot2(float angle)', 'A 2×2 matrix that turns a vec2 counter-clockwise by angle (radians): p = rot2(a) * p;', `void main() {
  vec2 p = vUv - 0.5;
  p = rot2(0.5) * p;
  float stripes = step(0.0, sin(p.x * 40.0));
  gl_FragColor = vec4(vec3(stripes), 1.0);
}`, Object.assign({ ret: 'mat2' }, STUDIO));
add('Helpers', 'fn', 'uvWorldSize', 'uvWorldSize()', 'How big one whole UV unit is in the world, as vec2(width, height), measured under this pixel. On a block that is 2 wide and 0.8 tall the front face gives about (2.0, 0.8). Flat faces, boxes and cylinders are measured per pixel; on curved shapes (sphere, torus, knot, cone) one average size for the whole mesh is used, so patterns stay smooth. On the stretched Rectangle preview it follows the proportions of the window, so patterns stay square. Needs a shape preview.', `void main() {
  vec2 s = uvWorldSize();
  gl_FragColor = vec4(s / 2.0, 0.0, 1.0);          // red = width, green = height of the face
}`, Object.assign({ ret: 'vec2', shape: true, view: 'block' }, STUDIO));
add('Helpers', 'fn', 'uvPixelSize', 'uvPixelSize()', 'How many screen pixels one whole UV unit covers, as vec2(across, up). Works on the flat rectangle too, where the picture is stretched to the window and the world size is no help.', `void main() {
  vec2 s = uvPixelSize();
  gl_FragColor = vec4(s / 600.0, 0.0, 1.0);
}`, Object.assign({ ret: 'vec2' }, STUDIO));
add('Helpers', 'fn', 'uvFit', 'uvFit(vec2 uv, float tile)', 'Turn uv into coordinates where one unit is tile world units wide, so patterns keep their shape on any face. uvFit(vUv, 0.25) gives squares a quarter of a world unit across, whatever the size of the face.', `void main() {
  gl_FragColor = vec4(vec3(checker(uvFit(vUv, 0.25))), 1.0);
}`, Object.assign({ ret: 'vec2', shape: true, view: 'block' }, STUDIO));
add('Helpers', 'fn', 'uvFitWrap', 'uvFitWrap(vec2 uv, float tile, vec2 stretch)', 'Like uvFit, but the number of repeats across each direction is rounded to a whole number, so the pattern meets itself at the seam of a cylinder, sphere or torus (uvFit usually leaves a visible seam). The tiles are up to half a tile off from the size you asked for. stretch squeezes the pattern: vec2(2.0, 1.0) gives twice as many repeats across, so tiles half as wide. Use vec2(1.0) for none.', `void main() {
  vec2 p = uvFitWrap(vUv, 0.25, vec2(1.0));
  gl_FragColor = vec4(vec3(checker(p)), 1.0);
}`, Object.assign({ ret: 'vec2', shape: true, view: 'cylinder' }, STUDIO));
add('Helpers', 'fn', 'checker', 'checker(vec2 p)', 'Checkerboard: 0 or 1, one square per unit. checker(uv * 8.0) gives 8 squares across.', `void main() {
  gl_FragColor = vec4(vec3(checker(vUv * 8.0)), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Helpers', 'fn', 'plot', 'plot(float v, float y)', 'A thin 0..1 line where v is close to y. Draws the graph of a function (used by every function example on this page).', fx('0.5 + 0.3 * sin(x * 12.0)'), Object.assign({ ret: 'float' }, STUDIO));
add('Helpers', 'fn', 'graphBG', 'graphBG(vec2 uv)', 'A dark graph-paper background for plotting.', `void main() {
  gl_FragColor = vec4(graphBG(vUv), 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));

// ------------------------------------------------------------------ fast & precomputed (studio helpers)
const FASTNOTE = ' Studio helper: it reads the studio\'s random-number picture (uNoiseTex), so it only works where that picture is available.';
add('Fast & precomputed', 'fn', 'hashT', 'hashT(vec2 cell)', 'Four random numbers 0..1 for a whole-number cell (the same cell always gives the same numbers). It reads them from a 256 × 256 picture of random values, so it is one texture read instead of a calculation like hash21(). The cell repeats every 256 units.' + FASTNOTE, `void main() {
  vec4 h = hashT(floor(vUv * 12.0));   // one random colour per square
  gl_FragColor = vec4(h.rgb, 1.0);
}`, Object.assign({ ret: 'vec4' }, STUDIO));
add('Fast & precomputed', 'fn', 'noiseT', 'noiseT(vec2 p)', 'Smooth value noise 0..1, the same idea as noise() but made with ONE texture read (the graphics card blends the neighbours for free) instead of four hashes and three mixes: roughly 2 times fewer operations. Same range, a slightly different pattern. Left half: noise(), right half: noiseT().' + FASTNOTE, `void main() {
  vec2 p = vUv * 8.0;
  float n = vUv.x < 0.5 ? noise(p) : noiseT(p);   // left: calculated, right: from the picture
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Fast & precomputed', 'fn', 'noise3T', 'noise3T(vec3 p)', '3D version of noiseT(): two texture reads\' worth of work in one read (the picture hides a second layer in its green channel). Roughly 3 times fewer operations than noise3().' + FASTNOTE, `void main() {
  float n = noise3T(vPos * 5.0);
  gl_FragColor = finish(vec3(n), 1.0);
}`, Object.assign({ ret: 'float', shape: true }, STUDIO));
add('Fast & precomputed', 'fn', 'fbmT', 'fbmT(vec2 p)', 'Same layered cloud noise as fbm(), built from noiseT(): roughly 2 times fewer operations (use the Perf tab to measure on your own graphics card). Left half: fbm(), right half: fbmT().' + FASTNOTE, `void main() {
  vec2 p = vUv * 6.0;
  float f = vUv.x < 0.5 ? fbm(p) : fbmT(p);
  gl_FragColor = vec4(vec3(f), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Fast & precomputed', 'fn', 'fbm3T', 'fbm3T(vec3 p)', 'Same as fbm3(), built from noise3T(): the 3D clouds that follow the object, roughly 3 times fewer operations.' + FASTNOTE, `void main() {
  float f = fbm3T(vPos * 3.0);
  gl_FragColor = finish(mix(vec3(0.1, 0.2, 0.5), vec3(0.95), f), 1.0);
}`, Object.assign({ ret: 'float', shape: true }, STUDIO));
add('Fast & precomputed', 'fn', 'voronoiT', 'voronoiT(vec2 p)', 'Same result as voronoi() (x = distance to the nearest point, y = gap to the edge, z = cell id) but the random point of each cell comes from one texture read (a modest saving: the loop over 9 neighbour cells is most of the cost). Left half: voronoi(), right half: voronoiT().' + FASTNOTE, `void main() {
  vec2 p = vUv * 6.0;
  vec3 v = vUv.x < 0.5 ? voronoi(p) : voronoiT(p);
  gl_FragColor = vec4(vec3(v.x), 1.0);
}`, Object.assign({ ret: 'vec3' }, STUDIO));
add('Fast & precomputed', 'fn', 'noiseTile', 'noiseTile(vec2 p, float period)  or  noiseTile(vec2 p, vec2 period)', 'Value noise that repeats exactly every "period" cells (a whole number; give a vec2 to repeat a different number of cells across and up). Made for bake(): a picture that tiles can be scrolled forever with no visible seam. The picture below shows 2 × 2 copies of one tile.', `void main() {
  vec2 tile = fract(vUv * 2.0);
  float n = noiseTile(tile * 4.0, 4.0);
  gl_FragColor = vec4(vec3(n), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Fast & precomputed', 'fn', 'fbmTile', 'fbmTile(vec2 p, float period)  or  fbmTile(vec2 p, vec2 period)', 'Layered noise (like fbm) that repeats exactly every "period" cells at its coarsest layer (a vec2 sets across and up separately), so it tiles with no seam. Use it inside bake(). The picture shows 2 × 2 copies of one tile.', `void main() {
  vec2 tile = fract(vUv * 2.0);
  float f = fbmTile(tile * 4.0, 4.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}`, Object.assign({ ret: 'float' }, STUDIO));
add('Fast & precomputed', 'fn', 'bake', 'vec4 bake(vec2 uv)', 'Precompute once instead of every frame. Write this function yourself: the studio draws it ONE time into a picture (when you edit the code or a uniform) and gives you the picture as uBake. Your main() then only needs one texture() read to get the expensive result back. Put a comment "// bake 1024" above it for a 1024 × 1024 picture (default 512, up to 2048). bake() cannot use uTime (it is drawn once), and the picture has 16-bit precision so it can hold heights and vectors, not just colours. To animate, scroll the lookup in main(), as below.', `// bake 512
vec4 bake(vec2 uv) {          // runs ONE time, not every frame
  float f = fbmTile(uv * 4.0, 4.0);
  return vec4(f, 1.0 - f, 0.6, 1.0);
}
void main() {
  vec2 uv = vUv + vec2(uTime * 0.05, 0.0);    // scroll the finished picture
  gl_FragColor = vec4(texture(uBake, uv).rgb, 1.0);
}`, Object.assign({ ret: 'vec4' }, STUDIO));
add('Fast & precomputed', 'var', 'uBake', 'sampler2D uBake', 'The picture your bake() function was drawn into (empty if you have no bake()). Read it with texture(uBake, uv). It repeats past 0..1, so a tileable bake can scroll forever.', `// bake 256
vec4 bake(vec2 uv) {
  return vec4(vec3(step(0.5, fract(uv.x * 4.0))), 1.0);
}
void main() {
  gl_FragColor = vec4(texture(uBake, vUv).rgb * vec3(1.0, 0.7, 0.3), 1.0);
}`, Object.assign({}, STUDIO));

// everything the studio adds on top of real GLSL gets flagged (the Docs tab and autocomplete mark it)
for (const n of 'vUv vP vPos vP3 vN vW vWN uTime uSeed uResolution uLightDir uLightCol uAmbSky uAmbGround cameraPosition uTex0 uNoiseTex PI TAU gNormal gHasN gShine gRough gSpec gGlint gBlow gDirect gl_FragColor texture2D'.split(' ')) {
  const d = DOCS.find(x => x.n === n); if (d) d.studio = true; else console.warn('studio flag: no docs entry for ' + n);
}

for (const d of DOCS) { const m = /\(([^)]*)\)/.exec(d.sig); d.argc = d.kind === 'fn' ? (m && m[1].trim() ? m[1].split(',').length : 0) : 0; d.key = d.n; }
const DOC_BY = {}; for (const d of DOCS) DOC_BY[d.n] = d;
GL.setNames(new Set(DOCS.filter(d => d.kind === 'fn' && !d.studio).map(d => d.n)), new Set(DOCS.filter(d => d.kind === 'fn' && d.studio).map(d => d.n)), new Set(DOCS.filter(d => d.kind === 'var' || d.kind === 'cn').map(d => d.n)));

/* ===== library.js : the shaders that come with the studio ===== */
const LIB = [];
const sh = (cat, n, code, type) => LIB.push({ cat, n, code: code.trim() + '\n', type: type || 'opaque' });

// ------------------------------------------------------------------ Basics
sh('Basics', 'Solid colour', `
// The simplest shader: one colour, lit by the sun. Try changing the numbers: drag them!
void main() {
  vec3 col = vec3(0.85, 0.38, 0.22);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'UV gradient', `
// Unlit: the texture coordinates shown as colour (red = u, green = v).
void main() {
  gl_FragColor = vec4(vUv, 0.4, 1.0);
}`);
sh('Basics', 'Normals', `
// The surface normal shown as colour: x = red, y = green, z = blue.
void main() {
  vec3 n = surfNormal();
  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
}`);
sh('Basics', 'Object position', `
// Position on the object (about -1..1) shown as colour. Needs no UVs, so it has no seams.
void main() {
  vec3 p = vPos;
  gl_FragColor = vec4(p * 0.5 + 0.5, 1.0);
}`);
sh('Basics', 'Checkerboard', `
// checker() gives 0 or 1 per square. Multiply the coordinates for more squares.
void main() {
  float c = checker(vUv * 8.0);
  vec3 col = mix(vec3(0.12), vec3(0.92), c);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Diagonal stripes', `
uniform float uCount; // 10 [2, 40]
void main() {
  float t = fract((vUv.x + vUv.y) * uCount * 0.5);
  float stripe = smoothstep(0.0, 0.03, t) * (1.0 - smoothstep(0.47, 0.5, t));
  vec3 col = mix(vec3(0.95, 0.85, 0.3), vec3(0.12, 0.12, 0.14), stripe);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Rings', `
uniform float uRings; // 8 [1, 30]
void main() {
  float r = length(vUv - 0.5) * uRings;
  float ring = smoothstep(0.35, 0.65, abs(fract(r) - 0.5) * 2.0);
  vec3 col = mix(vec3(0.15, 0.3, 0.7), vec3(0.95, 0.95, 1.0), ring);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Polka dots', `
uniform float uCount; // 8 [2, 30]
uniform float uSize;  // 0.3 [0.05, 0.5]
void main() {
  vec2 g = fract(vUv * uCount) - 0.5;
  float dotMask = 1.0 - smoothstep(uSize - 0.03, uSize, length(g));
  vec3 col = mix(vec3(0.97, 0.9, 0.85), vec3(0.85, 0.2, 0.3), dotMask);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Grid lines', `
uniform float uCells; // 10 [2, 40]
void main() {
  vec2 g = abs(fract(vUv * uCells + 0.5) - 0.5) / fwidth(vUv * uCells);   // distance to the nearest line, in pixels
  float line = 1.0 - smoothstep(0.0, 1.5, min(g.x, g.y));
  vec3 col = mix(vec3(0.1, 0.13, 0.2), vec3(0.6, 0.8, 1.0), line);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Palette gradient', `
// palette() turns a number into a smooth colour. Change the four vec3s for other looks.
void main() {
  float t = vUv.y + 0.15 * sin(vUv.x * 6.0);
  vec3 col = palette(t, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.1, 0.2));
  gl_FragColor = finish(col, 1.0);
}`);
sh('Basics', 'Colour wheel', `
void main() {
  vec2 p = vUv - 0.5;
  float hue = atan(p.y, p.x) / TAU + 0.5;
  float sat = clamp(length(p) * 2.0, 0.0, 1.0);
  gl_FragColor = vec4(hsv2rgb(vec3(hue, sat, 1.0)), 1.0);
}`);
sh('Basics', 'Plasma', `
// A classic: add several sine waves and map the sum to colours. Animated by uTime.
void main() {
  vec2 p = vUv * 6.0;
  float v = sin(p.x + uTime) + sin((p.y + uTime) * 0.7) + sin((p.x + p.y + uTime) * 0.5);
  v += sin(length(p - 3.0) * 1.5 - uTime);
  vec3 col = palette(v * 0.2 + 0.5, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Basics', 'Sunburst', `
uniform float uRays; // 14 [2, 40]
void main() {
  vec2 p = vUv - 0.5;
  float a = atan(p.y, p.x) / TAU * uRays + uTime * 0.1;
  float ray = smoothstep(0.35, 0.65, abs(fract(a) - 0.5) * 2.0);
  vec3 col = mix(vec3(1.0, 0.8, 0.25), vec3(0.95, 0.45, 0.15), ray);
  col *= 1.0 - 0.6 * smoothstep(0.2, 0.7, length(p));
  gl_FragColor = vec4(col, 1.0);
}`);

// ------------------------------------------------------------------ Lighting
sh('Lighting', 'Lambert (by hand)', `
// Diffuse lighting without finish(): the surface is brighter the more it faces the sun.
void main() {
  vec3 n = surfNormal();
  float d = lambert(n, uLightDir);
  vec3 base = vec3(0.8, 0.5, 0.3);
  vec3 col = base * (uAmbSky * 0.6 + uLightCol * d);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Blinn-Phong', `
// Diffuse plus a specular highlight. Raise shininess for a smaller highlight.
uniform float uShine; // 80 [2, 300]
void main() {
  vec3 n = surfNormal(), v = viewDir();
  vec3 base = vec3(0.15, 0.3, 0.7);
  float d = lambert(n, uLightDir);
  float s = blinn(n, uLightDir, v, uShine);
  vec3 col = base * (uAmbSky + uLightCol * d) + uLightCol * s * 0.8;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Toon', `
// Cel shading: light is cut into three flat steps, with a dark outline from the rim.
void main() {
  vec3 n = surfNormal();
  float d = clamp(dot(n, uLightDir), 0.0, 0.999);
  float band = floor(d * 3.0) / 2.0;               // 0, 0.5, 1
  vec3 base = vec3(0.9, 0.35, 0.25);
  vec3 col = base * (0.35 + 0.65 * band);
  col += vec3(1.0) * step(0.96, blinn(n, uLightDir, viewDir(), 60.0)) * 0.6;
  float outline = step(0.72, fresnel(n, viewDir(), 2.0));
  col = mix(col, vec3(0.04), outline);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Rim light', `
// Fresnel: bright where the surface turns away from you. Added after lighting through gSpec.
uniform vec3 uRim; // color 0.4 0.75 1.0
void main() {
  float rim = fresnel(surfNormal(), viewDir(), 3.0);
  gSpec = uRim * rim;
  gl_FragColor = finish(vec3(0.3, 0.32, 0.4), 1.0);
}`);
sh('Lighting', 'Hemisphere light', `
// Colour from the sky above and the ground below, blended by which way the surface faces.
void main() {
  vec3 n = surfNormal();
  vec3 sky = vec3(0.55, 0.75, 1.0), ground = vec3(0.35, 0.28, 0.2);
  vec3 col = mix(ground, sky, n.y * 0.5 + 0.5);
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Gooch (warm / cool)', `
// Technical-illustration shading: lit side warm, shadow side cool, no black.
void main() {
  vec3 n = surfNormal();
  float t = dot(n, uLightDir) * 0.5 + 0.5;
  vec3 col = mix(vec3(0.2, 0.25, 0.6), vec3(0.95, 0.8, 0.5), t);
  col += vec3(1.0) * blinn(n, uLightDir, viewDir(), 90.0) * 0.7;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Soft wrap light', `
// Wrapped diffuse lets light creep past the terminator, with a warm tint in the soft zone (a cheap skin look).
void main() {
  vec3 n = surfNormal();
  float nl = dot(n, uLightDir);
  float wrap = clamp((nl + 0.6) / 1.6, 0.0, 1.0);
  float soft = smoothstep(0.0, 0.5, wrap) * (1.0 - smoothstep(0.5, 1.0, wrap));
  vec3 base = vec3(0.9, 0.7, 0.6);
  vec3 col = base * (uAmbSky * 0.8 + uLightCol * wrap) + vec3(0.6, 0.12, 0.05) * soft * 0.5;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Plastic', `
// finish() adds a highlight when gShine is set. gRough sets how wide it is.
void main() {
  gShine = 1.0;
  gRough = 0.25;
  gl_FragColor = finish(vec3(0.8, 0.15, 0.2), 1.0);
}`);
sh('Lighting', 'Chrome (fake reflection)', `
// Look up a made-up environment (sky, horizon, ground, sun) in the reflected direction.
void main() {
  vec3 r = reflect(-viewDir(), surfNormal());
  vec3 sky = mix(vec3(0.75, 0.82, 0.9), vec3(0.22, 0.42, 0.85), smoothstep(0.0, 1.0, r.y));
  vec3 ground = mix(vec3(0.28, 0.24, 0.2), vec3(0.06, 0.05, 0.05), 1.0 - smoothstep(-1.0, 0.0, r.y));
  vec3 env = mix(ground, sky, smoothstep(-0.04, 0.04, r.y));
  env += uLightCol * pow(max(dot(r, uLightDir), 0.0), 200.0) * 3.0;
  gl_FragColor = vec4(env, 1.0);
}`);
sh('Lighting', 'Iridescent', `
// Colour that shifts with the viewing angle, like an oil film or a beetle shell.
void main() {
  vec3 n = surfNormal(), v = viewDir();
  float f = 1.0 - clamp(dot(n, v), 0.0, 1.0);
  vec3 col = palette(f * 1.4 + 0.1, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.33, 0.67));
  col *= 0.35 + 0.65 * lambert(n, uLightDir) + 0.3;
  col += vec3(1.0) * blinn(n, uLightDir, v, 120.0) * 0.5;
  gl_FragColor = vec4(col, 1.0);
}`);
sh('Lighting', 'Glass (see-through)', `
// Set the shader type to "transparent". Alpha is low in the middle and high at the rim.
void main() {
  vec3 n = surfNormal(), v = viewDir();
  float f = fresnel(n, v, 3.0);
  vec3 tint = vec3(0.7, 0.88, 1.0);
  vec3 col = mix(tint * 0.5, vec3(1.0), f) + blinn(n, uLightDir, v, 150.0);
  gl_FragColor = vec4(col, 0.15 + 0.75 * f);
}`, 'transparent');
sh('Lighting', 'Metal (finish)', `
void main() {
  gShine = 1.0;
  gRough = 0.12;
  vec3 col = vec3(0.62, 0.64, 0.68);
  gSpec = col * fresnel(surfNormal(), viewDir(), 4.0) * 0.5;
  gl_FragColor = finish(col, 1.0);
}`);

// ------------------------------------------------------------------ Materials
sh('Materials', 'Wood (3D grain)', `
// Rings around the up axis from the object's own 3D position: no seams on any shape.
void main() {
  vec3 p = vPos * 2.2;
  float warp = fbm3(p * 1.5);
  float r = length(p.xz + warp * 0.5) * 7.0 + warp * 3.0;
  float rings = smoothstep(0.0, 1.0, abs(fract(r) - 0.5) * 2.0);
  float fine = noise(vec2(p.y * 40.0, atan(p.z, p.x) * 10.0));
  vec3 light = vec3(0.78, 0.55, 0.32), dark = vec3(0.42, 0.24, 0.12);
  vec3 col = mix(dark, light, rings * 0.8 + fine * 0.2);
  gShine = 0.25; gRough = 0.5;
  gl_FragColor = finish(col, 1.0);
}`);
sh('Materials', 'Marble (3D veins)', `
void main() {
  vec3 p = vPos * 2.0;
  float v = sin(p.x * 4.0 + fbm3(p * 2.2) * 9.0);
  float vein = 1.0 - smoothstep(0.0, 0.18, abs(v));
  vec3 base = mix(vec3(0.9, 0.9, 0.92), vec3(0.78, 0.8, 0.84), fbm3(p * 3.0));
  vec3 col = mix(base, vec3(0.2, 0.22, 0.3), vein * 0.8);
  gShine = 0.9; gRough = 0.2;
  gl_FragColor = finish(col, 1.0);
}`);
sh('Materials', 'Bricks', `
uniform float uCols; // 6 [2, 20]
void main() {
  vec2 uv = vUv * vec2(uCols, uCols * 2.0);
  float row = floor(uv.y);
  uv.x += mod(row, 2.0) * 0.5;                       // every second row is shifted
  vec2 f = fract(uv), id = floor(uv);
  float brick = smoothstep(0.02, 0.07, f.x) * smoothstep(0.02, 0.07, 1.0 - f.x) * smoothstep(0.05, 0.14, f.y) * smoothstep(0.05, 0.14, 1.0 - f.y);
  float grain = fbm(uv * 8.0);
  vec3 bc = mix(vec3(0.6, 0.22, 0.14), vec3(0.78, 0.38, 0.22), hash21(id)) * (0.8 + 0.35 * grain);
  vec3 col = mix(vec3(0.62, 0.6, 0.56) * (0.8 + 0.3 * grain), bc, brick);
  gNormal = bumpFromHeight(brick * 0.6 + grain * 0.25, 0.05);
  gHasN = 1.0;
  gl_FragColor = finish(col, 1.0);
}`);
sh('Materials', 'Cobblestones', `
void main() {
  vec3 v = voronoi(vUv * 7.0);
  float stone = smoothstep(0.02, 0.16, v.y);
  float grain = fbm(vUv * 40.0);
  vec3 sc = mix(vec3(0.38, 0.36, 0.34), vec3(0.62, 0.58, 0.52), v.z) * (0.75 + 0.4 * grain);

  float d = 1.0e3;
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    vec2 c = 0.55 * vec2(sin(uTime * (0.6 + 0.2 * fi) + fi * 2.0), cos(uTime * (0.5 + 0.15 * fi) + fi * 1.7));
    d = smin(d, sdCircle(p - c, 0.2), 0.35);
  }
  vec3 col = mix(vec3(0.06, 0.07, 0.12), vec3(0.95, 0.45, 0.3), sdfFill(d));
  col += vec3(0.4, 0.15, 0.1) * (1.0 - smoothstep(0.0, 0.3, d)) * (1.0 - sdfFill(d));
  gl_FragColor = vec4(col, 1.0);
}`);
sh('SDF & fractals', 'Hexagon target', `
void main() {
  vec2 p = vUv * 2.0 - 1.0;
  float d = sdHexagon(p, 0.7);
  float rings = smoothstep(0.35, 0.65, abs(fract(d * 7.0 - uTime * 0.2) - 0.5) * 2.0);
  vec3 col = mix(vec3(0.9, 0.3, 0.2), vec3(0.15, 0.1, 0.12), rings) * (1.0 - smoothstep(0.0, 0.9, d));
  col = mix(col, vec3(0.04), step(0.0, d));
  gl_FragColor = vec4(col, 1.0);
}`);
sh('SDF & fractals', 'Mandelbrot', `
uniform float uZoom;   // 1 [0.5, 60]
uniform vec2 uCenter;  // -0.75 0.0
void main() {
  vec2 c = (vUv - 0.5) * 3.2 / uZoom + uCenter;
  vec2 z = vec2(0.0);
  int n = 0;
  for (int i = 0; i < 200; i++) {
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    if (dot(z, z) > 256.0) break;
    n++;
  }
  float s = float(n) - log2(max(log2(dot(z, z)), 1.0e-4)) + 4.0;
  vec3 col = n >= 200 ? vec3(0.0) : palette(s * 0.03, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.0, 0.1, 0.2));
  gl_FragColor = vec4(col, 1.0);
}`);
sh('SDF & fractals', 'Julia set', `
void main() {
  vec2 z = (vUv - 0.5) * 3.0;
  vec2 c = 0.7885 * vec2(cos(uTime * 0.3), sin(uTime * 0.3));
  int n = 0;
  for (int i = 0; i < 100; i++) {
    z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
    if (dot(z, z) > 16.0) break;
    n++;
  }
  vec3 col = n >= 100 ? vec3(0.02) : palette(float(n) * 0.04, vec3(0.5), vec3(0.5), vec3(1.0), vec3(0.3, 0.2, 0.2));
  gl_FragColor = vec4(col, 1.0);
}`);

// ------------------------------------------------------------------ Bump & texture
sh('Bump & texture', 'Texture lookup', `
// texture(uTex0, uv) reads the built-in test picture. Change the uv to move, scale and distort it.
void main() {
  vec2 uv = vUv * 2.0;
  vec3 col = texture(uTex0, uv).rgb;
  gl_FragColor = finish(col, 1.0);
}`);
sh('Bump & texture', 'Pixelate', `
uniform float uPix; // 16 [2, 128]
void main() {
  vec2 uv = floor(vUv * uPix) / uPix;
  gl_FragColor = vec4(texture(uTex0, uv).rgb, 1.0);
}`);
sh('Bump & texture', 'Noise texture', `
// uNoiseTex holds random values: a cheap random source (use more than one channel for more randomness).
void main() {
  vec4 t = texture(uNoiseTex, vUv * 4.0);
  gl_FragColor = vec4(vec3(t.r), 1.0);
}`);
sh('Bump & texture', 'Bumpy plastic', `
void main() {
  float h = fbm3(vPos * 9.0);
  gNormal = bumpFromHeight(h, 0.07); gHasN = 1.0;
  gShine = 1.0; gRough = 0.3;
  gl_FragColor = finish(vec3(0.2, 0.55, 0.45), 1.0);
}`);
sh('Bump & texture', 'Rock', `
void main() {
  float h = fbm3(vPos * 3.0) * 0.7 + fbm3(vPos * 13.0) * 0.3;
  gNormal = bumpFromHeight(h * 2.0, 0.08); gHasN = 1.0;
  vec3 col = mix(vec3(0.22, 0.2, 0.19), vec3(0.58, 0.53, 0.47), h);
  gl_FragColor = finish(col, 1.0);
}`);
sh('Bump & texture', 'Dents (Voronoi bump)', `
void main() {
  vec3 v = voronoi(vUv * 9.0);
  float h = smoothstep(0.0, 0.5, v.x);
  gNormal = bumpFromHeight(h, 0.07); gHasN = 1.0;
  gShine = 0.8; gRough = 0.3;
  gl_FragColor = finish(vec3(0.75, 0.55, 0.25), 1.0);
}`);
sh('Bump & texture', 'Ripple bumps', `
void main() {
  float d = length(vUv - 0.5);
  float h = sin(d * 60.0 - uTime * 4.0) * exp(-d * 4.0);
  gNormal = bumpFromHeight(h, 0.08); gHasN = 1.0;
  gShine = 1.0; gRough = 0.2;
  gl_FragColor = finish(vec3(0.3, 0.5, 0.75), 1.0);
}`);

/* ===== lessons.js : the Learn tab content =====
   Rules this file follows (and test_compile.html checks automatically):
     - every function / variable / type that appears in a step's code was introduced in that step or an earlier one
       (listed in `new`), so nothing is used before it is taught
     - at most one or two new ideas per step
   Text markup: `code`, **bold**, *italic*, [[docName]] (link to the Docs tab), blank line = new paragraph.
   Step fields: t (title), x (text), code, shape (3D preview), new (list of docs names, or N(...) for custom items), try (what to change). */
const LESSONS = [];
const lesson = (id, title, level, blurb, steps, shape) => LESSONS.push({ id, title, level, blurb, steps, shape: !!shape });
const N = (k, sig, d) => ({ k, sig, d });   // a "new" item that has no Docs entry of its own

// ====================================================================== 1
lesson('basics', 'The very first shader: main() and colour', 'Absolute beginner',
  'One line that paints everything red, then what `void main()`, `gl_FragColor`, `vec4` and the four colour numbers really mean.', [
  { t: 'One line, one colour', x: `This is a complete shader. It has exactly one job: **decide the colour of a pixel**. The line sets \`gl_FragColor\`, the shader's output, to four numbers: red, green, blue and alpha.

Red is 1.0 (full), green and blue are 0.0 (none), so everything is red. The \`void main() { }\` around it is the wrapper every shader needs; the next step explains it.

**Two kinds of names, so you always know what is real:** *GLSL* is the language itself (\`void\`, \`float\`, \`vec4\`, \`mix\`, \`sin\`…); it works in every shader program. This studio also writes some **helpers and variables of its own** (like \`finish\`, \`noise\`, \`vUv\`, \`uTime\`). Those carry a blue **studio-made** tag whenever they are introduced, and they only exist here. Even \`gl_FragColor\` is a bit of both: modern GLSL has no such name, so the studio renames it to the real output variable for you.`,
    new: ['gl_FragColor', 'vec4'], try: 'Click the line and change a number, for example the second one to 1.0. The big preview updates instantly.',
    code: `void main() {
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
}` },
  { t: 'What void main() { } means', x: `\`main\` is the **name** of the function the graphics card runs. You never call it yourself: the card calls it for you, **once for every pixel**.

\`void\` means "this function gives nothing back". Instead it *writes* its answer into \`gl_FragColor\`. Whatever is in there when \`main\` ends becomes the pixel's colour.

The curly braces \`{ }\` hold everything that belongs to \`main\`. Every line that does something ends with a **semicolon**. A missing semicolon is the most common first error; the red message under the editor tells you which line.

Text after \`//\` is a **comment**: the computer ignores it, it's a note for you.`,
    new: [N('main', 'void main() { ... }', 'The function the card runs once for every pixel. Your code goes between the braces.')],
    try: 'Delete the semicolon at the end of the gl_FragColor line and read the error message. Then put it back.',
    code: `void main() {
  // everything in here runs once per pixel
  gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);   // red
}` },
  { t: 'The four numbers: r, g, b, a', x: `The colour is **four numbers, always in this order**:

**r** red amount, **g** green amount, **b** blue amount, **a** alpha (how solid; 1.0 is fully solid).

Each goes from **0.0** (none) to **1.0** (full). A screen makes every colour by mixing red, green and blue light, so mixing means **adding light**: red + green = **yellow**, all three = **white**, none = **black**.

Alpha only matters when the shader type (top bar) is set to *transparent*. Otherwise leave it at 1.0.`,
    try: 'Make green: (0.0, 1.0, 0.0, 1.0). Make grey: (0.5, 0.5, 0.5, 1.0). Make white. Make black.',
    code: `void main() {
  gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0);
}` },
  { t: 'Give each number a name', x: `\`vec4(1.0, 1.0, 0.0, 1.0)\` is hard to read: which number is which? Let's **name the four numbers** first.

\`float\` is the type for **one decimal number**. We make four of them, called r, g, b and a, and hand them to \`vec4(...)\` in the same order. The picture is identical to the last step; only the writing is clearer.

This is the pattern every shader uses: **work out some numbers, then gather them into a colour on the last line.**`,
    new: ['float'], try: 'Change the value of b from 0.0 to 1.0. The yellow becomes white.',
    code: `void main() {
  float r = 1.0;
  float g = 1.0;
  float b = 0.0;
  float a = 1.0;
  gl_FragColor = vec4(r, g, b, a);
}` },
  { t: 'Numbers can be calculated', x: `A number doesn't have to be typed in. It can be **calculated from other numbers**. Here \`b\` is "one minus r", so when r is 0.5, b is 0.5.

Also: always write **1.0, not 1**. GLSL is strict: \`1\` is a whole number (an *int*), \`1.0\` is a decimal number (a *float*), and it will **not** convert between them for you. Using \`1\` where a float is needed is a common error.`,
    try: 'Change r to 0.9: b follows automatically (it becomes 0.1).',
    code: `void main() {
  float r = 0.5;
  float g = 0.2;
  float b = 1.0 - r;
  float a = 1.0;
  gl_FragColor = vec4(r, g, b, a);
}` },
  { t: 'What is a vector?', x: `\`vec4\` is a **vector**: a small bundle of numbers stored under one name. Three sizes matter:

**vec2**: two numbers, usually a *position* (x, y)
**vec3**: three numbers, usually a *colour* (r, g, b) or a *direction*
**vec4**: four numbers, a colour with alpha

You can reach each part by name. For colours: \`.r .g .b .a\`. For positions: \`.x .y .z .w\`. These are the **same four slots with different names**: \`c.r\` and \`c.x\` are the same number. You can read a part (\`c.r\`) or change it (\`c.g = 0.9;\`).`,
    new: [N('c.r  c.g  c.b  c.a', 'c.r   c.x', 'Pick one part of a vector by name (r, g, b, a for colours; x, y, z, w for positions).')],
    try: 'Change the 0.9 on the c.g line, or change c.r = 0.0 to see only green.',
    code: `void main() {
  vec4 c = vec4(1.0, 0.5, 0.0, 1.0);
  c.g = 0.9;
  gl_FragColor = c;
}` },
  { t: 'vec3: a colour without alpha', x: `Most of the time you only care about red, green and blue, and alpha is always 1.0. So we make an RGB colour with **vec3** and add the alpha at the very end:

\`vec4(col, 1.0)\` means "the three numbers of col, then 1.0": a vec4 built from a vec3 plus one float. GLSL lets you mix pieces like this, as long as the total count is right.

Two shortcuts: \`vec3(0.5)\` means \`vec3(0.5, 0.5, 0.5)\` (a grey), and \`.rgb\` picks the first three parts of a vec4.`,
    new: ['vec3'], try: 'Try vec3(0.5) as the colour for a grey, or vec3(1.0, 0.3, 0.6) for pink.',
    code: `void main() {
  vec3 col = vec3(0.2, 0.6, 1.0);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Maths on vectors', x: `Arithmetic on a vector works on **all its parts at once**:

\`col * 0.5\`: every part halved (darker)
\`col + 0.2\`: 0.2 added to every part (lighter)
\`col * tint\`: matching parts multiplied (red × red, green × green...)

Multiplying two colours is how you **tint** something: a blue thing times an orange tint keeps only what both colours share, so it gets dark and murky. Below, the sky blue is multiplied by the tint, then 0.1 is added to all three parts.`,
    try: 'Set tint to vec3(1.0) and nothing changes (multiplying by 1 does nothing). Set it to vec3(0.5) and everything halves.',
    code: `void main() {
  vec3 col = vec3(0.2, 0.6, 1.0);
  vec3 tint = vec3(1.0, 0.7, 0.3);
  col = col * tint;
  col = col + 0.1;
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'The limits: below 0 and above 1', x: `A screen can only show 0 to 1. A value of 3.0 is **clamped** and looks exactly like 1.0; a negative value looks like 0.0 (black). This colour is orange-red with its red part at 3.0: it looks the same as with 1.0.

The extra brightness isn't lost *inside* the shader, though: if you later multiply or blend, a 3.0 stays strong. That's how glows are made.

You now know every piece in a one-line shader. Next lesson: what the card actually does with it.`,
    try: 'Change 3.0 to 1.0, then to -1.0, and see which changes look different.',
    code: `void main() {
  vec3 col = vec3(3.0, 0.5, 0.2);
  gl_FragColor = vec4(col, 1.0);
}` },
]);

lesson('pixels', 'How shaders run: one pixel at a time', 'Absolute beginner',
  'Your code runs separately for every pixel, and a pixel cannot see its neighbours. What follows from that, and how to think about it.', [
  { t: 'The same code, everywhere at once', x: `A shader is **one small program run again and again, once for each pixel** of the object, all at the same moment (a graphics card has thousands of tiny processors). A 500 × 500 picture means 250,000 runs of \`main()\`.

Every run is the same code. If they all received the same input they'd all give the same colour. What makes the picture interesting is that **each pixel is told where it is**, through an input called [[vUv]]. \`vUv\` is a vec2: \`vUv.x\` is 0 at the left edge and 1 at the right edge. (You can use \`.x .y\` and \`.r .g\` interchangeably, they're the same slots.)

Here the colour is simply the pixel's own x position, repeated three times as a grey. Every pixel runs the same formula; the left ones get small numbers, the right ones large.`,
    new: ['vUv'], try: 'Change vUv.x to vUv.y: the gradient turns to go from bottom (black) to top (white).',
    code: `void main() {
  float g = vUv.x;
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'Two numbers: x and y', x: `\`vUv\` has **two** numbers: x runs 0 to 1 from left to right, y runs 0 to 1 from the bottom to the top. Here they become the red and green parts of the colour.

Look at the corners: bottom-left has x = 0, y = 0 so it's black. Top-right has both at 1, so red + green = yellow. Bottom-right is only red, top-left only green. Once you can predict this picture, you understand \`vUv\`.`,
    try: 'Put vUv.y in the blue slot too: vec4(vUv.x, vUv.y, vUv.y, 1.0).',
    code: `void main() {
  gl_FragColor = vec4(vUv.x, vUv.y, 0.0, 1.0);
}` },
  { t: 'Every pixel does its own sum', x: `Now do some maths with it. \`vUv.x * vUv.x\` multiplies a pixel's x by itself. A pixel at x = 0.5 computes 0.25. A pixel at x = 1.0 computes 1.0. So the picture is dark for a long way and then brightens quickly: the gradient has been *bent*.

The important part: **each pixel just did a small sum with its own position.** It did not look at the pixel next to it. The picture looks smooth only because the formula is smooth: tiny change in position, tiny change in answer.`,
    try: 'Try vUv.x * vUv.y (a corner gradient), or vUv.x * 0.5 (a darker gradient).',
    code: `void main() {
  float g = vUv.x * vUv.x;
  gl_FragColor = vec4(vec3(g), 1.0);
}` },
  { t: 'The big rule: pixels cannot talk to each other', x: `Here is the most important idea in shader writing:

**Each pixel is calculated alone. It cannot read its neighbour's colour, and it cannot see what any other pixel is doing.**

They all run at the same moment, so there is no "left pixel first, then me", and nothing to look at. Writing "my colour = my left neighbour's colour plus a bit" is impossible: there is nowhere to read that from.

What a pixel *can* know: **its own position** (like \`vUv\`), **numbers that are the same for everybody** (like time, next step), and **the maths in your code**.

Consequences you'll see over and over:
**1.** Nothing is remembered between pixels, or between frames. Variables are born when the pixel's run starts and vanish when it ends.
**2.** To make a shape you don't "draw it": every pixel asks *"am I inside the shape?"* from its own position.
**3.** To make something move, you change an **input** that every pixel receives.`, },
  { t: 'fract: count up, then start over', x: `Before we meet time, one small tool, because time **never stops growing** (1, 2, 3 ... 100 ... 5000 seconds) and we'll want it to start over again and again.

[[fract]](x) throws away the whole part of a number and keeps only the decimals: 1.7 becomes 0.7, 2.3 becomes 0.3, 4.0 becomes 0.0. Feed it a number that keeps growing and you get a **ramp from 0 to 1 that restarts** each time the number passes a whole number. (This kind of "wrap around" is also called *modulo*; you'll meet the full version, \`mod\`, later.)

Here \`vUv.x * 3.0\` grows from 0 to 3 across the picture, so the ramp restarts twice and you see **three** ramps. The multiplier is how many repeats.`,
    new: ['fract'], try: 'Change 3.0 to 1.0 (one ramp, same as before), then to 8.0.',
    code: `void main() {
  float f = fract(vUv.x * 3.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}` },
  { t: 'Same for everyone: uTime', x: `[[uTime]] is the number of **seconds since the shader started**. **Every pixel receives the same value** of \`uTime\` in a given frame: a number that is "the same for everybody" is called a **uniform**. You can watch it counting next to the shape buttons above the previews ("uTime 4.2").

Used on its own it has a problem: it only ever grows. \`uTime * 0.25\` would reach 1.0 (full red) after 4 seconds and then stay white-hot forever, because the screen can't show more than 1.0. So we wrap it with \`fract\`: \`fract(uTime * 0.25)\` counts 0 to 1 over four seconds and **starts again, forever**. The whole picture is one flat red that pulses up and restarts every 4 seconds. Not a gradient: every pixel agrees.

The picture moves because *the input* changed; nothing was remembered from the previous frame. If you want to restart time by hand, **click the "uTime" number** above the previews: it jumps back to 0.`,
    new: ['uTime'], try: 'Change 0.25 to 1.0 to make it restart every second. Click the uTime number above the preview to jump back to 0.',
    code: `void main() {
  float r = fract(uTime * 0.25);
  gl_FragColor = vec4(r, 0.0, 0.0, 1.0);
}` },
  { t: 'Different per pixel vs. the same for everyone', x: `Now you know both kinds of input, and a lot of the docs use these words:

**Per-pixel inputs** (often called *varyings*) **differ from pixel to pixel**: \`vUv\`, \`vPos\` (3D position), \`vN\` (surface direction).

**Uniforms** are **the same for every pixel**: \`uTime\`, \`uSeed\`, the light direction, and the sliders in the Uniforms tab.

In this picture red comes from \`vUv.x\` (differs across the picture), green from \`vUv.y\` (differs), and blue from \`fract(uTime * 0.25)\` (identical everywhere, it counts up and restarts). Only the blue changes over time.`,
    try: 'Replace the whole fract(uTime * 0.25) with 0.5 for a still picture.',
    code: `void main() {
  gl_FragColor = vec4(vUv.x, vUv.y, fract(uTime * 0.25), 1.0);
}` },
  { t: 'Think like a single pixel', x: `So shader writing is a particular way of thinking. Before writing code, imagine you are **one pixel** and ask: *"What do I know about myself, and from that, what colour should I be?"*

To draw a circle in the middle you don't draw anything. Each pixel asks: **"how far am I from the middle?"** Pixels that are close answer "light", the others answer "dark", and together they *look* like a circle. Nobody drew it.

That's exactly the next lesson: we'll turn position into a distance, and a distance into a shape. Every effect in this studio is built that way:

**position** → **a number** (distance, angle, noise...) → **a colour**`, },
]);

// ====================================================================== 3
lesson('shapes', 'Making shapes from position', 'Beginner',
  'Centre the coordinates, measure distance, and cut it into a hard or soft edged circle. You will learn length, distance, step, smoothstep and mix.', [
  { t: 'Move the zero to the middle', x: `\`vUv\` starts in the corner. For round things we want (0, 0) in the **middle**. Subtracting 0.5 from a vec2 subtracts it from **both** x and y: now each runs from -0.5 to 0.5.

We name the result \`p\` ("position"). The picture shows \`p.x\` as red and \`p.y\` as green. Notice that only the **top-right** quarter is coloured: the left half has negative x and the bottom half has negative y, and **negative numbers show as black**.`,
    new: ['vec2'], try: 'Try vUv - 0.3 and watch where the colour starts.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  gl_FragColor = vec4(p.x, p.y, 0.0, 1.0);
}` },
  { t: 'length: how far from the middle', x: `[[length]] takes a vector and gives back **how long it is**. For a position that's the **distance from (0, 0)**, which is now the middle. (It's Pythagoras: the square root of x² + y².)

The result is 0 in the centre and grows outwards equally in every direction, and *that* is why you get a circle shape. Black in the middle, brighter outwards.`,
    new: ['length'], try: 'Draw the opposite: gl_FragColor = vec4(vec3(1.0 - d), 1.0); is a bright centre.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'Zoom by multiplying', x: `Multiplying the position **changes the scale**. \`p * 3.0\` makes every number three times as big, so the distance grows three times as fast: the circle pattern gets **smaller** (you reach white quickly). Dividing would make it bigger.

Rule of thumb: **multiply a position to get more of a pattern, divide to get less.** You'll use this constantly: \`vUv * 10.0\` repeats something ten times across.`,
    try: 'Try 1.0, 2.0, 6.0 and 20.0.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p * 3.0);
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'distance: from any point', x: `\`length(p)\` measures the distance from the middle. What about from another point? [[distance]](a, b) is the distance between two positions. It's the same as \`length(a - b)\`.

Here the point is \`vec2(0.2, 0.1)\`: to the right of the middle and a bit up, so that's where it's darkest. **Moving the point moves the circle.**`,
    new: ['distance'], try: 'Change the two numbers in vec2(0.2, 0.1). Drag them with the mouse.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = distance(p, vec2(0.2, 0.1));
  gl_FragColor = vec4(vec3(d), 1.0);
}` },
  { t: 'step: a hard on/off switch', x: `So far we have smooth gradients. To get a **sharp edge** we need a switch. [[step]](edge, x) gives back **0.0 if x is below the edge, and 1.0 if x is at or above it**. Nothing in between.

Here x is the pixel's horizontal position and the edge is 0.5: left half 0 (black), right half 1 (white).`,
    new: ['step'], try: 'Change 0.5 to 0.2 or 0.8 and the edge moves. Change vUv.x to vUv.y.',
    code: `void main() {
  float s = step(0.5, vUv.x);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'A hard-edged circle', x: `Combine the two: take the **distance** from the middle (0 in the centre, bigger outward) and cut it with \`step\`.

\`step(0.3, d)\` is **0 close to the middle** (d below 0.3) and **1 outside**. That's the opposite of what we want, so we flip it with \`1.0 - ...\`: 0 becomes 1, and 1 becomes 0. Now the inside is white.

A 0/1 picture like this is called a **mask**: 1 means "yes, this pixel is part of it".`,
    try: 'Change 0.3 to make the circle bigger or smaller. Delete the "1.0 -" to see it inverted.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - step(0.3, d);
  gl_FragColor = vec4(vec3(m), 1.0);
}` },
  { t: 'smoothstep: a soft switch', x: `A hard edge looks jagged. [[smoothstep]](a, b, x) is a **soft step**: it gives 0.0 when x is below \`a\`, 1.0 when x is above \`b\`, and a **smooth blend in between**. The wider the gap between a and b, the softer the transition.

Here the x position goes from 0.3 to 0.7: below 0.3 it's black, above 0.7 it's white, and in between it's a gentle ramp.`,
    new: ['smoothstep'], try: 'Make a and b closer (0.49, 0.51): it almost becomes a hard step. Make them far apart (0.0, 1.0).',
    code: `void main() {
  float s = smoothstep(0.3, 0.7, vUv.x);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'A soft-edged circle', x: `Swap \`step\` for \`smoothstep\` in the circle. The fade now happens between the distance 0.28 and 0.32, a thin soft edge instead of a staircase. Still inverted with \`1.0 -\` so the inside is white.

You now have the two standard ways to make a mask: **step** (hard) and **smoothstep** (soft). Almost every shape in a shader is "make a distance, then smoothstep it".`,
    try: 'Widen the fade: smoothstep(0.1, 0.4, d).',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - smoothstep(0.28, 0.32, d);
  gl_FragColor = vec4(vec3(m), 1.0);
}` },
  { t: 'mix: blend two things', x: `[[mix]](a, b, t) **blends from a to b**: t = 0 gives a, t = 1 gives b, t = 0.5 is halfway. It works on numbers and on colours (it blends every part).

Here t is the pixel's x position, so the colour fades from red on the left to blue on the right.`,
    new: ['mix'], try: 'Change the two colours. Use vUv.y instead of vUv.x.',
    code: `void main() {
  vec3 a = vec3(1.0, 0.1, 0.1);
  vec3 b = vec3(0.1, 0.1, 1.0);
  vec3 col = mix(a, b, vUv.x);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'Put it together: a mask picks the colour', x: `Now the circle mask is the \`t\` in \`mix\`: where the mask is 0 you get the background colour, where it is 1 you get the circle colour, and in the soft edge you get a blend.

**Mask + mix is the basic way to layer anything in a shader.** Everything later is a variation: make a mask (some shape, pattern or noise), then \`mix\` two looks with it.`,
    try: 'Change the two colours. Then make the circle bigger with the 0.28 / 0.32 numbers.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float m = 1.0 - smoothstep(0.28, 0.32, d);
  vec3 bg = vec3(0.05, 0.05, 0.2);
  vec3 disc = vec3(1.0, 0.6, 0.2);
  gl_FragColor = vec4(mix(bg, disc, m), 1.0);
}` },
]);

lesson('orb', 'Build a glowing orb', 'Beginner',
  'Use everything so far, and add exp (for glow) and sin (for pulsing) to build an animated orb.', [
  { t: 'Where we are', x: `This is the soft circle from the last lesson, with a dark blue background. We'll add a **glow** around it and make it **pulse**. First we need two new tools.`,
    try: 'Warm-up: change the colours, or the radius numbers.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float orb = 1.0 - smoothstep(0.25, 0.29, d);
  vec3 bg = vec3(0.02, 0.02, 0.08);
  vec3 col = mix(bg, vec3(1.0, 0.6, 0.2), orb);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'exp: a number that fades quickly', x: `[[exp]](x) is a function with a very useful shape when you feed it a **negative** number: \`exp(-d)\` is 1.0 when d is 0, and drops quickly towards 0 as d grows.

Feed it the distance from the middle and you get something that is **bright in the middle and fades smoothly away**: a glow. The number you multiply d by is the *tightness*: \`exp(-d * 2.0)\` is wide and soft, \`exp(-d * 10.0)\` is small and sharp.`,
    new: ['exp'], try: 'Try 2.0, then 10.0, then 20.0 in place of 6.0.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float glow = exp(-d * 6.0);
  gl_FragColor = vec4(vec3(glow), 1.0);
}` },
  { t: 'Add the glow behind the orb', x: `A glow is **light**, so it can be brighter than a normal colour. We multiply \`exp(-d * 6.0)\` by 4.0: right next to the orb it is far above 1.0 (the screen clips it, so it looks hot and saturated) and it fades out smoothly with distance.

The glow becomes the **background colour** itself: \`vec3(glow, glow * 0.6, 0.0)\` means red = glow, green = 60% of glow, no blue, so it fades from orange-yellow into black. The orb is now a sun-yellow colour, and \`mix(bg, sunColor, orb)\` lays it on top of the glow. Because the glow is the *background* layer, it never covers the orb.`,
    try: 'Change 4.0 for a stronger or weaker glow, 6.0 for a tighter or wider one, and the 0.6 to change the glow colour.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float orb = 1.0 - smoothstep(0.25, 0.27, d);
  float glow = exp(-d * 6.0) * 4.0;
  vec3 bg = vec3(glow, glow * 0.6, 0.0);
  vec3 sunColor = vec3(1.0, 1.0, 0.2);
  vec3 col = mix(bg, sunColor, orb);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'sin: a smooth wave', x: `[[sin]](x) turns a steadily growing number into a **wave** that goes up and down between -1 and 1 and repeats forever. Feed it the x position times 20 and you get 20-ish bumps across the picture.

Because a wave goes *negative* and the screen can't show negative, we squash it into 0..1 with \`0.5 + 0.5 * sin(...)\`: halve it (-0.5 to 0.5), then shift it up (0 to 1). You'll see this "* 0.5 + 0.5" trick a lot.`,
    new: ['sin'], try: 'Change 20.0 to 5.0 (wider stripes) or 60.0 (finer stripes).',
    code: `void main() {
  float s = 0.5 + 0.5 * sin(vUv.x * 20.0);
  gl_FragColor = vec4(vec3(s), 1.0);
}` },
  { t: 'sin of time: pulsing', x: `Put \`uTime\` inside the \`sin\`: now the wave is over *time* instead of position, so the number slowly swings up and down. Multiply \`uTime\` to change the speed.

The orb radius becomes \`r = 0.25 + 0.03 * sin(uTime * 3.0)\`: a base size of 0.25 with a wobble of ±0.03. **Animation = take something fixed and add a sin of time to it.** It pulses by itself in the picture.`,
    try: 'Change 3.0 to speed it up, 0.03 for a bigger wobble.',
    code: `void main() {
  vec2 p = vUv - 0.5;
  float d = length(p);
  float r = 0.25 + 0.03 * sin(uTime * 3.0);
  float orb = 1.0 - smoothstep(r, r + 0.02, d);
  float glow = exp(-d * 6.0) * 4.0;
  vec3 bg = vec3(glow, glow * 0.6, 0.0);
  vec3 sunColor = vec3(1.0, 1.0, 0.2);
  vec3 col = mix(bg, sunColor, orb);
  gl_FragColor = vec4(col, 1.0);
}` },
]);

lesson('patterns', 'Repeating patterns: stripes, checkers, bricks', 'Beginner',
  'The fract / floor trick that cuts space into tiles, then mod, random numbers (hash21) and min to make stripes, checkerboards and bricks.', [
  { t: 'fract: a ramp that restarts', x: `You met [[fract]](x) in lesson 2: it keeps only the decimals (1.7 becomes 0.7, 4.0 becomes 0.0). Feed it a number that keeps growing and you get a **0 to 1 ramp that restarts over and over**. \`vUv.x * 5.0\` grows from 0 to 5 across the picture, so we get five ramps. This is the most useful trick in pattern making.`,
    new: ['fract'], try: 'Change 5.0 to 2.0 or 10.0.',
    code: `void main() {
  float f = fract(vUv.x * 5.0);
  gl_FragColor = vec4(vec3(f), 1.0);
}` },
  { t: 'Stripes', x: `A ramp that repeats, cut with \`step\` (which you know): below 0.5 gives 0, from 0.5 up gives 1. That's **hard stripes**: half black, half white, five times.

Change the \`0.5\` to change the stripe thickness, change the \`5.0\` to change how many.`,
    try: 'Use vUv.y for horizontal stripes, or (vUv.x + vUv.y) for diagonal ones.',
    code: `void main() {
  float s = step(0.5, fract(vUv.x * 5.0));
  vec3 col = mix(vec3(0.1, 0.15, 0.3), vec3(0.95, 0.85, 0.5), s);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'floor: which stripe am I in?', x: `[[floor]](x) is the other half: it **rounds down** to the whole number, 1.7 becomes 1.0, 4.9 becomes 4.0. Where \`fract\` tells you *where inside* the stripe you are, \`floor\` tells you *which* stripe.

Dividing by 5 at the end squeezes the whole numbers 0, 1, 2, 3, 4 into 0 to 0.8, so you can see them: a **staircase** with five flat steps.`,
    new: ['floor'], try: 'Replace 5.0 with 10.0 (both places).',
    code: `void main() {
  float step5 = floor(vUv.x * 5.0) / 5.0;
  gl_FragColor = vec4(vec3(step5), 1.0);
}` },
  { t: 'Cut space into cells', x: `Do both at once, on a 2D position. We scale by 6 so there are six cells across, then:

\`floor(g)\` is **which cell** you are in: (0,0), (1,0), (2,0)...
\`fract(g)\` is **where inside that cell**, from 0 to 1 in x and y.

The picture shows \`f\` as red and green: each cell contains a small copy of the red-green square from the \`vUv\` lesson. These two values are the basis of grids, tiles, bricks and per-tile randomness.`,
    try: 'Change 6.0 to 3.0 for fewer, bigger cells.',
    code: `void main() {
  vec2 g = vUv * 6.0;
  vec2 cell = floor(g);
  vec2 f = fract(g);
  gl_FragColor = vec4(f.x, f.y, 0.0, 1.0);
}` },
  { t: 'mod: checkerboard', x: `[[mod]](a, b) is the **remainder** after dividing a by b: mod(5.0, 2.0) is 1.0, mod(6.0, 2.0) is 0.0. With b = 2 it flips between 0 and 1: **even, odd, even, odd**.

Add the cell's x and y numbers together and take mod 2: neighbouring cells always differ by one, so they alternate like a chessboard.`,
    new: ['mod'], try: 'Change 8.0 to 3.0 or 20.0.',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  float c = mod(cell.x + cell.y, 2.0);
  vec3 col = mix(vec3(0.15), vec3(0.9), c);
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'hash21: a random number per cell', x: `[[hash21]] takes a position (vec2) and gives back a **random-looking number between 0 and 1**. The same input always gives the same answer, but a slightly different input gives a completely unrelated one.

Feed it the **cell number** (the whole numbers from \`floor\`) and every cell gets its own steady random grey. Remember: each pixel computes this alone, but pixels in the same cell have the same \`cell\` so they agree.`,
    new: ['hash21'], try: 'Try 4.0 and 40.0 for different cell sizes.',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  float r = hash21(cell);
  gl_FragColor = vec4(vec3(r), 1.0);
}` },
  { t: 'Random colour per cell', x: `Three random numbers make a random colour. We shift the cell number by a different amount for each of r, g, b (\`cell + 1.0\` adds 1 to both parts) so that the three values are different from each other.

The result is a patchwork of random colours. Nothing here is new: it is \`hash21\` three times.`,
    try: 'Multiply the colour by 0.5 to darken it: vec4(col * 0.5, 1.0).',
    code: `void main() {
  vec2 cell = floor(vUv * 8.0);
  vec3 col = vec3(hash21(cell), hash21(cell + 1.0), hash21(cell + 2.0));
  gl_FragColor = vec4(col, 1.0);
}` },
  { t: 'min: the smaller of two numbers', x: `[[min]](a, b) gives back **whichever is smaller**. Why is that useful? Take \`f\` (0 to 1 inside a cell). Its distance to the *left* edge is \`f\`, and to the *right* edge is \`1.0 - f\`. The distance to the **nearest** side is the smaller of the two.

The result goes 0, up to 0.5 in the middle, back down to 0: a triangle wave, zero at every cell border.`,
    new: ['min'], try: 'Multiply by 2.0 so the peak is white: vec3(edge * 2.0).',
    code: `void main() {
  float f = fract(vUv.x * 4.0);
  float edge = min(f, 1.0 - f);
  gl_FragColor = vec4(vec3(edge), 1.0);
}` },
  { t: 'Grid lines', x: `Do it for x **and** y, and take the \`min\` of those too: \`edge\` is now the distance to the **nearest border in any direction**, 0 on every grid line and bigger towards the cell centres.

Cut it with \`smoothstep\` (0.0 to 0.06): the pixels very close to a border come out dark, everything else bright. **Grid lines**, from a distance and a smoothstep.`,
    try: 'Change 0.06 for thicker or thinner lines.',
    code: `void main() {
  vec2 f = fract(vUv * 6.0);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float line = smoothstep(0.0, 0.06, edge);
  gl_FragColor = vec4(vec3(line), 1.0);
}` },
  { t: 'Bricks: shift every other row', x: `Bricks are a grid where every second row is slid half a brick sideways. We find the row number with \`floor(g.y)\`, and for **odd rows** (\`mod(row, 2.0)\` is 1) we add 0.5 to x. The 8 and 16 make each brick twice as wide as tall.

The rest is the grid-lines recipe: the border distance (\`edge\`), smoothstep for the mortar, \`hash21\` to vary each brick's colour a little, and \`mix\` to put mortar and brick together.`,
    try: 'Change the brick colour vec3(0.7, 0.3, 0.2), or 8.0 / 16.0.',
    code: `void main() {
  vec2 g = vec2(vUv.x * 8.0, vUv.y * 16.0);
  float row = floor(g.y);
  g.x = g.x + 0.5 * mod(row, 2.0);
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float brick = smoothstep(0.03, 0.08, edge);
  vec3 clay = vec3(0.7, 0.3, 0.2) * (0.7 + 0.5 * hash21(cell));
  gl_FragColor = vec4(mix(vec3(0.8), clay, brick), 1.0);
}` },
  { t: 'Make it move', x: `Animation is the same as always: **add \`uTime\` to the coordinate before cutting it up**. Here one line is added: \`g.x\` also moves by \`uTime * 0.4\`. Every later step uses \`g\`, so the whole wall slides. Watch it slide.`,
    try: 'Make odd and even rows move in opposite directions: add uTime * 0.4 only when mod(row, 2.0) is 1 by changing the multiply.',
    code: `void main() {
  vec2 g = vec2(vUv.x * 8.0, vUv.y * 16.0);
  float row = floor(g.y);
  g.x = g.x + 0.5 * mod(row, 2.0) + uTime * 0.4;
  vec2 cell = floor(g);
  vec2 f = fract(g);
  float edge = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));
  float brick = smoothstep(0.03, 0.08, edge);
  vec3 clay = vec3(0.7, 0.3, 0.2) * (0.7 + 0.5 * hash21(cell));
  gl_FragColor = vec4(mix(vec3(0.8), clay, brick), 1.0);
}` },
]);
